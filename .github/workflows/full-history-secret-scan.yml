# full-history-secret-scan.yml — scheduled full-history credential scan
# Added 2026-08-30 (Codex audit feedback P0-adjacent): pushed-range gitleaks in
# ci-cd.yml only covers new commits; this job scans ALL history on a schedule
# so a credential already in history is surfaced for remediation regardless of
# new pushes. Read-only job (contents: read). Results: gitleaks report upload
# as an artifact; the job fails if leaks are found (owner triages, does not
# auto-rewrite history).
name: full-history-secret-scan

on:
  schedule:
    - cron: "17 3 * * 1"   # weekly, Monday 03:17 UTC
  workflow_dispatch: {}    # allow manual trigger

permissions:
  contents: read
  actions: read

jobs:
  scan:
    name: scan-all-history
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run gitleaks over all history
        env:
          GITLEAKS_VERSION: v8.30.1
        run: |
          set -e
          curl -sSfL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION#v}_linux_x64.tar.gz"
          curl -sSfL -o /tmp/gitleaks_checksums.txt \
            "https://github.com/gitleaks/gitleaks/releases/download/${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION#v}_checksums.txt"
          grep "gitleaks_${GITLEAKS_VERSION#v}_linux_x64.tar.gz" /tmp/gitleaks_checksums.txt > /tmp/gitleaks_expected.sha
          awk '{print $1"  /tmp/gitleaks.tar.gz"}' /tmp/gitleaks_expected.sha > /tmp/gitleaks_expected_renamed.sha
          (cd /tmp && sha256sum -c gitleaks_expected_renamed.sha)
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          # --exit-code 0: findings are evaluated from the report below (the
          # report JSON is a top-level array of finding objects). The
          # scan-completeness check after this run guards against an INCOMPLETE
          # scan (zero commits scanned, or a git/repo error) being mistaken for
          # a clean scan — an empty report because the scan never ran must not
          # pass. Stderr is captured because gitleaks reports scan errors and
          # the "no commits" condition on stderr, not in the findings JSON.
          /tmp/gitleaks git --exit-code 0 --redact --no-banner \
            --report-path /tmp/gitleaks-report.json --report-format json . \
            > /tmp/gitleaks-stdout.txt 2> /tmp/gitleaks-stderr.txt \
            || echo "::warning::gitleaks returned non-zero; the completeness check below will decide pass/fail"

      - name: Fail closed on incomplete scan
        if: always()
        run: |
          set -e
          # A scan that produced no report, or whose stderr indicates a git
          # error / zero commits scanned, is INCOMPLETE and must fail the job —
          # it must never be treated as a clean scan.
          if [ ! -s /tmp/gitleaks-report.json ]; then
            echo "::error::gitleaks produced no report — scan incomplete; treating as failure"
            exit 1
          fi
          # An empty report array [] is a legitimate clean scan ONLY when the
          # scan actually ran. Reject stderr error/no-commit markers so an
          # aborted scan cannot pass as clean.
          if grep -qiE 'no commits|error|failed|fatal|unable to|invalid' /tmp/gitleaks-stderr.txt; then
            echo "::error::gitleaks scan reported an error or scanned zero commits; treating as failure"
            head -20 /tmp/gitleaks-stderr.txt
            exit 1
          fi
          # Report must be valid JSON (array of findings); malformed means incomplete.
          python3 - <<'PYEOF'
          import json, sys
          try:
              with open("/tmp/gitleaks-report.json") as f:
                  findings = json.load(f)
              if not isinstance(findings, list):
                  print("::error::gitleaks report is not a findings array — scan incomplete; treating as failure")
                  sys.exit(1)
              print(f"::notice::gitleaks scan complete and healthy ({len(findings)} findings reported)")
          except Exception as e:
              print(f"::error::gitleaks report unreadable — scan incomplete; treating as failure: {e}")
              sys.exit(1)
          PYEOF

      - name: Upload gitleaks report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gitleaks-full-history-report
          path: /tmp/gitleaks-report.json
          if-no-files-found: warn

      - name: Fail if leaks found
        run: |
          set -e
          if [ -s /tmp/gitleaks-report.json ] && grep -q '"Description"' /tmp/gitleaks-report.json; then
            echo "::error::gitleaks full-history scan found leaks — see artifact gitleaks-full-history-report; owner must triage (rotate/invalidate/clean history per approval discipline — no auto-rewrite)"
            exit 1
          fi
          echo "::notice::gitleaks full-history scan clean — no findings"
