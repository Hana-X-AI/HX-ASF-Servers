# full-history-secret-scan.yml — scheduled full-history credential scan
# Added 2026-08-30 (Codex audit feedback P0-adjacent): pushed-range gitleaks in
# ci-cd.yml only covers new commits; this job scans ALL history on a schedule
# so a credential already in history is surfaced for remediation regardless of
# new pushes. Read-only job (contents: read). Results: gitleaks report upload
# as an artifact; the job fails if leaks are found (owner triages, does not
# auto-rewrite history).
name: full-history-secret-scan

on:
  schedule:
    - cron: "17 3 * * 1"   # weekly, Monday 03:17 UTC
  workflow_dispatch: {}    # allow manual trigger

permissions:
  contents: read
  actions: read

jobs:
  scan:
    name: scan-all-history
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks over all history
        env:
          GITLEAKS_VERSION: v8.24.3
        run: |
          set -e
          curl -sSfL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION#v}_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          # --exit-code 0: findings are evaluated from the report below; a
          # scan execution error still fails the job via set -e.
          /tmp/gitleaks git --exit-code 0 --redact --no-banner --report-path /tmp/gitleaks-report.json --report-format json .

      - name: Upload gitleaks report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-full-history-report
          path: /tmp/gitleaks-report.json
          if-no-files-found: warn

      - name: Fail if leaks found
        run: |
          set -e
          if [ -s /tmp/gitleaks-report.json ] && grep -q '"Description"' /tmp/gitleaks-report.json; then
            echo "::error::gitleaks full-history scan found leaks — see artifact gitleaks-full-history-report; owner must triage (rotate/invalidate/clean history per approval discipline — no auto-rewrite)"
            exit 1
          fi
          echo "::notice::gitleaks full-history scan clean — no findings"
