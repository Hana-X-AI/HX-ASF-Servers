# ci-cd.yml — HX-ASF-Servers (p8, owner-ratified 2026-08-26; amended 2026-08-28)
# Trigger: every push to any branch. 18 steps total across three jobs.
#   gates             — deterministic quality gates (all pushes; happy path ≈3 min)
#   coderabbit-review — CodeRabbit CLI review gate (ALL pushes incl. main — owner
#                       directive 2026-08-28: "coderabbit should run on every commit
#                       regardless of the type"; main pushes review the pushed range
#                       BEFORE..HEAD, branch pushes review vs origin/main; skips
#                       cleanly until the API key secret is configured; blocking =
#                       critical+major+minor per owner directive 2026-08-28 — ALL
#                       issues block, zero-tolerance)
#   pr-manage         — auto-PR, auto-label, auto-merge, PR-comment notifications
#                         (non-main pushes)
# Auto-merge is the GitHub platform feature: it fires only when the required checks
# (gates, coderabbit-review) are green on the PR. No manual approval gates anywhere.
name: ci-cd

on:
  push:
    branches: ["**"]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: gates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout (full history for the secret-scan range)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Lint — byte-compile all Python
        run: python3 -m compileall -q scripts pilots/PILOT-HX1-OLLAMA-QWEN27B-001/fixtures

      - name: Lint — shellcheck repo hooks
        run: shellcheck scripts/hooks/*.sh

      - name: Unit tests — fixtures regression suite
        run: python3 pilots/PILOT-HX1-OLLAMA-QWEN27B-001/fixtures/test_fixtures.py

      - name: Unit tests — wiki renderer suite
        run: python3 scripts/wiki/test_render.py

      - name: Build validation — wiki HTML in sync
        run: python3 scripts/wiki/render.py --check

      - name: Install PyYAML (validate.py dependency)
        run: python3 -m pip install -q pyyaml

      - name: Catalog validation
        run: python3 scripts/validate.py --ci

      - name: Security scan — secrets in the pushed range
        env:
          BEFORE: ${{ github.event.before }}
          GITLEAKS_VERSION: v8.24.3
        run: |
          set -e
          # Pinned gitleaks version (immutable, not 'latest') — supply-chain
          # hardening per Codex audit feedback 2026-08-30.
          curl -sSfL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION#v}_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          RANGE="HEAD~1..HEAD"
          if [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
            RANGE="${BEFORE}..HEAD"
          fi
          /tmp/gitleaks git --redact --log-opts="$RANGE" .

  coderabbit-review:
    name: coderabbit-review
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout (full history for the base diff)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install CodeRabbit CLI
        run: |
          export CODERABBIT_INSTALL_DIR="$RUNNER_TEMP/cr-bin"
          curl -fsSL https://cli.coderabbit.ai/install.sh | sh
          echo "$CODERABBIT_INSTALL_DIR" >> "$GITHUB_PATH"

      - name: CodeRabbit review (agent JSON, light policy)
        id: review
        env:
          CODERABBIT_API_KEY: ${{ secrets.CODERABBIT_API_KEY || secrets.CODERABBIT_API_KEY_2 }}
          BEFORE: ${{ github.event.before }}
          BRANCH: ${{ github.ref_name }}
        run: |
          if [ -z "${CODERABBIT_API_KEY:-}" ]; then
            # Fail-closed: CodeRabbit is a required check (owner directive
            # 2026-08-28: run on every commit; zero-tolerance). A missing key
            # means the gate cannot run — fail rather than pass vacuously.
            # Hardening per Codex audit feedback 2026-08-30.
            echo "::error::CODERABBIT_API_KEY not configured — CodeRabbit is a required check and cannot run; set the secret (see docs/cicd-pipeline.md setup)"
            exit 1
          fi
          echo "skipped=false" >> "$GITHUB_OUTPUT"
          if [ "$BRANCH" = "main" ]; then
            BASE="$BEFORE"
            if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then BASE="HEAD~1"; fi
            echo "main push — reviewing pushed range $BASE..HEAD"
            CMD=(coderabbit review --agent --light --committed --base-commit "$BASE" --api-key "$CODERABBIT_API_KEY")
          else
            git fetch origin main --depth=1 >/dev/null 2>&1 || true
            CMD=(coderabbit review --agent --light --base origin/main --api-key "$CODERABBIT_API_KEY")
          fi
          # The org's included-review quota is shared between CI and local CLI
          # runs. A recoverable rate_limit gets bounded retries at the
          # service-provided waitTime (zero-tolerance era: main must not red-X
          # on a quota collision); after retries the parser stays fail-closed.
          for attempt in 1 2 3; do
            "${CMD[@]}" > "$RUNNER_TEMP/findings.jsonl" || true
            WAIT=$(python3 - "$RUNNER_TEMP/findings.jsonl" <<'PYEOF'
          import json, os, sys
          complete, wait = False, 0
          if os.path.exists(sys.argv[1]):
              for line in open(sys.argv[1]):
                  line = line.strip()
                  if not line:
                      continue
                  try:
                      ev = json.loads(line)
                  except ValueError:
                      continue
                  if ev.get("type") == "complete":
                      complete = True
                  elif ev.get("type") == "error" and ev.get("errorType") == "rate_limit" and ev.get("recoverable"):
                      w = str(ev.get("metadata", {}).get("waitTime", "")).split()
                      if len(w) == 2:
                          try:
                              wait = int(float(w[0]) * (60 if w[1].lower().startswith("min") else 1)) + 20
                          except ValueError:
                              wait = 0
          print(0 if complete else min(wait, 780))
          PYEOF
          )
            case "$WAIT" in ''|*[!0-9]*) WAIT=0 ;; esac
            if [ "$WAIT" -le 0 ]; then break; fi
            if [ "$attempt" -eq 3 ]; then
              echo "::notice::CodeRabbit rate limit persists after retries — parser stays fail-closed"
              break
            fi
            echo "::notice::CodeRabbit rate limit (attempt $attempt) — retrying after ${WAIT}s"
            sleep "$WAIT"
          done

      - name: Parse findings and enforce the gate
        if: steps.review.outputs.skipped == 'false'
        run: |
          python3 - <<'PYEOF'
          import json, os, sys
          path = os.path.join(os.environ.get("RUNNER_TEMP", "/tmp"), "findings.jsonl")
          counts = {"critical": 0, "major": 0, "minor": 0, "trivial": 0, "info": 0}
          complete_status, findings, errors = None, 0, []
          if os.path.exists(path):
              for line in open(path):
                  line = line.strip()
                  if not line:
                      continue
                  try:
                      ev = json.loads(line)
                  except ValueError:
                      continue
                  t = ev.get("type")
                  if t == "finding":
                      findings += 1
                      sev = (ev.get("severity") or "info").lower()
                      counts[sev] = counts.get(sev, 0) + 1
                      # Findings must be human-readable in the job log itself —
                      # a count with no content sends the owner hunting (owner
                      # directive 2026-08-28). Dump each event, truncated.
                      print("FINDING: %s" % json.dumps(ev)[:1500])
                  elif t == "complete":
                      complete_status = ev.get("status")
                  elif t == "error":
                      errors.append(str(ev.get("message", "")))
          rows = "\n".join("| %s | %d |" % (k, v) for k, v in counts.items())
          summary = (
              "CodeRabbit CLI review — status `%s`, findings **%d** "
              "(critical %d, major %d, minor %d, trivial %d, info %d).\n"
              % (complete_status, findings, counts["critical"], counts["major"],
                 counts["minor"], counts["trivial"], counts["info"])
          )
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as fh:
              fh.write("## CodeRabbit review\n\n| severity | count |\n|---|---|\n" + rows + "\n")
          with open("/tmp/cr-summary.md", "w") as fh:
              fh.write(summary)
          if complete_status is None:
              # A generated-only diff (e.g. wiki HTML re-render) yields
              # "No files to review" from the service — nothing was in scope,
              # so the gate passes vacuously. Any OTHER missing-complete
              # (auth/service failure) stays fail-closed.
              if any("no files to review" in e.lower() for e in errors):
                  print("::notice::CodeRabbit: no reviewable files in this range (generated-only diff) — gate passes vacuously")
                  sys.exit(0)
              print("::error::no complete event from CodeRabbit CLI (auth/service failure) %s"
                    % "; ".join(errors))
              sys.exit(1)
          # Owner directive 2026-08-28: ALL findings block — minor through critical.
          # "we are introducing problems in our codebase that coderabbit can find
          # and fix" — the gate enforces zero-tolerance, not severity triage.
          blocking = counts["critical"] + counts["major"] + counts["minor"]
          if blocking:
              print("::error::%d blocking finding(s) (critical/major/minor — owner directive: all issues block) — fix and re-push"
                    % blocking)
              sys.exit(1)
          PYEOF

      - name: Comment review result on the PR
        if: steps.review.outputs.skipped == 'false' && always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR=$(gh pr view -R "$GITHUB_REPOSITORY" --json number -q .number 2>/dev/null || true)
          [ -z "$PR" ] && exit 0
          gh pr comment "$PR" -R "$GITHUB_REPOSITORY" --body-file /tmp/cr-summary.md || true

  pr-manage:
    name: pr-manage
    if: github.ref_name != 'main' && always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Ensure PR exists
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BR="${GITHUB_REF_NAME}"
          NUM=$(gh pr view "$BR" -R "$GITHUB_REPOSITORY" --json number -q .number 2>/dev/null || true)
          if [ -z "$NUM" ]; then
            gh pr create -R "$GITHUB_REPOSITORY" --base main --head "$BR" \
              --title "$BR" --body "Auto-created by ci-cd on first push (p8)."
            NUM=$(gh pr view "$BR" -R "$GITHUB_REPOSITORY" --json number -q .number)
            echo "created=true" >> "$GITHUB_OUTPUT"
          fi
          echo "number=$NUM" >> "$GITHUB_OUTPUT"

      - name: Auto-label by branch prefix
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ steps.pr.outputs.number }}
        run: |
          case "${GITHUB_REF_NAME}" in
            feature/*) L=feature ;; fix/*) L=fix ;; chore/*) L=chore ;;
            *) L="" ;;
          esac
          [ -z "$L" ] && exit 0
          gh label create "$L" -R "$GITHUB_REPOSITORY" --force >/dev/null 2>&1 || true
          gh pr edit "$PR" -R "$GITHUB_REPOSITORY" --add-label "$L"

      - name: Enable auto-merge (squash)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ steps.pr.outputs.number }}
        run: |
          gh pr merge "$PR" -R "$GITHUB_REPOSITORY" --auto --squash \
            || echo "::warning::auto-merge not armed yet (repo setting or required checks pending)"

      - name: Notify pipeline state on the PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ steps.pr.outputs.number }}
        run: |
          gh pr comment "$PR" -R "$GITHUB_REPOSITORY" --body \
            "ci-cd: gates and CodeRabbit review for the latest push are in the Checks tab. Auto-merge (squash) is armed; the PR merges when the required checks are green. Blocking findings are fixed by the factory agent on this branch and re-pushed — the loop re-runs automatically." \
            >/dev/null || true
