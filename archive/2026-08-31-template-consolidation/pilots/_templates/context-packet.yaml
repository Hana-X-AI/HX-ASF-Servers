# Context-packet template (ratified 2026-08-25, UD5/U6). Pairs with work-order.yaml.
# Everything the producer needs and nothing it does not.
context_packet:
  goal_id: "GOAL-<id>"
  goal_version: 1
  work_order_id: "WO-<PILOT>-<AGENT>-<MILESTONE>-NNN"
  session_id: "<agent>-<milestone>-<yyyymmdd>-<nn>"
  role: "producer (<lane>: <roster name> / <call sign>)"
  milestone: "<id — short title>"
  objective: >-
    <Restated from the work order, one paragraph.>
  current_state:
    host: "<hostname (IP), OS, kernel — verified at packet time>"
    key_identities: "<frozen aliases/digests/versions the work must preserve>"
    relevant_config: "<current values the change touches, with evidence dates>"
    units_or_services: "<states that must hold at completion>"
  owner_decisions:
    - "<decision + date + state-log row>"
  constraints:
    - "<loopback-only / read-only scope / no-secret rules / frozen-evidence rules>"
    - "<stop conditions and the bounded-correction budget>"
  evidence_requirements:
    - "<pre/post hashes, diffs, command outputs, journal excerpts, verification runs>"
    - "<budget/arithmetic tables or checklists where the milestone defines them>"
  consulted_records:  # governor cites catalog knowledge consulted (AGENTS.md)
    - "<DOC-ids / retrieval packages consulted at dispatch, or 'none required'>"
  handoff:
    # Two-stage closure (O4, KDD-0024). Carol is background-class: her receipt is
    # required but does not hold the handoff open. Routine work reaches
    # execution_accepted on gate pass; the catalog state is tracked separately.
    - "Deliverable <NN-...> reaches execution_accepted when the evidence is produced
      and the deterministic gates pass; the next work order may dispatch then"
    - "Deliverable <NN-...> goes to Carol for catalog receipt; catalog_pending until
      the receipt is cited in the state log, then catalog_complete — this does NOT
      gate closure (owner directive 2026-08-30)"
    - "SYNCHRONOUS EXCEPTION: if this deliverable changes authority, security, a
      schema, an agent identity, or reusable platform knowledge, the receipt IS
      required before closure. If the class is unclear or arguable, treat it as
      synchronous — over-including costs a delay, under-including means a decision
      made from a stale catalog"
  second_brain_evaluation: "See the governing work order — the packet does not re-decide it"
