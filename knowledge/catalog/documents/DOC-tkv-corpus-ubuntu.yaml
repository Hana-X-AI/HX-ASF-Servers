  lifecycle_claim: "C8 RESOLVED 2026-08-25 (governor verification). Current authority — live Canonical release-cycle page, fetch 2026-08-25, https://ubuntu.com/about/release-cycle: Ubuntu 24.04 LTS standard security maintenance through May 2029; Expanded security maintenance May 2034; Break/bug support May 2034; Legacy add-on May 2039. Rick profile Appendix B (May 2029) CONFIRMED accurate against the live page. Preserved conflicting claim, verbatim with provenance: corpus releases.yaml line 48 — eol 'April 2029' (imprecise mirrored webapp field). Resolution: the live Canonical page outranks the mirrored corpus field per the AGENTS.md TKV rule (mirrored reference material is not current truth). The review batch's asserted dates (May 31 2029 / April 2039) remain unrecorded — unverified review data, also imprecise against the live page."
