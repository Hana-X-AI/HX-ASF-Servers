  checksum_method: "sha256 = digest of the sorted file-name list manifest (2162 files, names only, captured 2026-08-27T08:13Z), NOT content hashes — change-detection baseline, not content integrity; directory canonical_location preserved. Pipeline reproduced and PROVEN 2026-08-27: find /opt/tkv-local/ubuntu -type f -not -path '*/.git/*' -not -path '*/.idea/*' | sort | sha256sum — absolute paths, en_US.UTF-8 locale sort, manifest text digested; the same pipeline reproduces the prior digest 962683e0… exactly on the pre-addition tree (2,127-file subset), and the sibling DOC-tkv-corpus-ollama digest d2545086… was independently reproduced exactly as a known-answer check of the convention family. Exclusions per convention: .git internals (absent — unpacked archives) and .idea editor metadata (ubuntu_mcp_server-master/.idea, 6 files, excluded; its 21 included files match the DOC-tkv-corpus-ubuntu-mcp-server manifest count). Form alignment batch 7 (F-B6-6): method/count text consolidated wholly into notes.checksum_method; the sha256 field carries ONLY the bare 64-char digest; digest VALUE unchanged."
