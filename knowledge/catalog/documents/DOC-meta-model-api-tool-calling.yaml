notes:
  type_judgment: "Typed 'runbook' per dispatch: a vendor operational doc with executable request/response shapes and rules. Same typing as the sibling captures and DOC-meta-muse-glimmer-llama-cpp-guide."
  contract_facts: "The M6 load-bearing rules (dispatch-specified, verified against the document at ingestion): (1) parallel_tool_calls — DEFAULT TRUE: the model MAY return multiple calls in tool_calls in one turn; set parallel_tool_calls: false to limit the model to one call per turn; the flag takes effect ONLY when function tools are provided (with no function tools it is accepted but has no effect, matching OpenAI); applies to both Chat Completions and the Responses API. (2) tool_choice — ONLY 'auto' (the default) is supported on both endpoints; 'none', 'required', and named function choices return HTTP 400; with 'auto' the app must handle both a tool call and a plain text response. (3) strict — schema-validation only: defaults false (schema accepted as-is; missing root type normalized); strict: true validates against the strict subset and returns HTTP 400 on violation; model-generated arguments are guided but NOT guaranteed — always self-validate. (4) max_tool_calls caps BUILT-IN tools only (minimum 1, no enforced maximum) — it does not limit client-side function-tool calls; bound those with parallel_tool_calls: false or a turn cap. (5) the full assistant message INCLUDING tool_calls must precede tool results (HTTP 400 otherwise); each result's tool_call_id/call_id must match the originating call; call_id length 1–64 chars. (6) keep tool results in the same order as their calls when building history manually (with previous_response_id the server does not enforce ordering). (7) tool-name validation applies only to the most recent assistant turn. (8) use tools/tool_choice — 'functions'/'function_call' are deprecated."
  hxs3_relevance: "M6 contract-suite basis (hxs-3 state log row 3): the registered LIMIT parallel_tool_calling: false is model-native for Muse Glimmer (v1.1/KDD-0007); this doc's default-true-with-limiting-flag platform contract means the harness MUST ALSO enforce sequentially — (a) request-level parallel_tool_calls: false WHERE Ollama honors the field (M5/M6 compatibility probe, never assumed), (b) tool-layer sequential execution regardless (KK3-side, always). M6 suite gains: invariant proof + flag-honoring probe + tool-layer sequencing proof. Responses-API mechanics and built-in tools are N/A to the local Ollama artifact. AMENDMENT POINTER (2026-08-26, KDD-0007 + goal review finding, re-validated this run): the harness enforcement contract is now ratified as two-level — responses containing more than one tool call are rejected, accepted calls execute serially with results returned before the next selection; the request-level parallel_tool_calls flag is strictly a compatibility probe, never enforcement (see DOC-kdd-0007-hxs3-muse-glimmer-tooling-adoption notes.limit_enforcement_amendment)."
  authority_label: "authority_level upstream-reference: Meta's own vendor documentation, owner-supplied as a pilot controlling source; verify against the live runtime — every rule here is a hosted-platform contract and a probe hypothesis for the local artifact, not HX-established fact."
