document:
  id: "DOC-meta-model-api-tool-calling"
  title: "tooling.md — Meta Model API 'Tool calling' (539-line official tool-calling doc; upstream capture; the hxs-3 M6 contract-suite basis)"
  type: "runbook"
  declared_purpose: "Meta's official tool-calling doc (front matter: title 'Tool calling', description 'Define functions the model can invoke, execute them locally, and return results for the model to incorporate.', cms alias /model-api/docs/tool-calling; 539 lines): developer-defined tools — functions described in 'tools' and executed in the integrator's own code; the model never executes developer-defined tools itself (the built-in web_search is the server-side exception). Two developer-defined types: 'function' (name, description, JSON Schema parameters) and 'custom' (freeform text input, Responses-API-only — HTTP 400 on Chat Completions; exempt from the single-dot name rule). Definition shapes differ per endpoint: Responses uses flat top-level fields and returns function_call items in the output array (results returned as function_call_output items with call_id, with previous_response_id for server-reconstructed context); Chat Completions nests the same fields under a 'function' key, returns a tool_calls array on the assistant message (finish_reason 'tool_calls'), and takes results as 'tool' messages carrying tool_call_id. Function name rules: ^[a-zA-Z0-9_.-]+$ with AT MOST ONE DOT (two or more dots → HTTP 400); use a namespace tool for MCP/Agents-SDK-style multi-segment names. Root 'type: object' is auto-added if omitted (declaring it is still recommended). Strict flag semantics: strict defaults to FALSE — the schema is accepted as-is (a missing root type is normalized, not rejected); strict: true validates the schema against the supported strict subset (e.g. additionalProperties: false, every property in required) and returns HTTP 400 on violation — only when strict is true; REGARDLESS of strict, the model's generated arguments are not guaranteed to validate — always parse and validate arguments client-side. Guidelines include streaming argument deltas, deferred loading of large tool sets (defer_loading + tool_search), and structured output for complex arguments (see notes.contract_facts for the M6 load-bearing rules)."
  inferred_value: "INFERENCE: the single most operationally dense of the three Meta captures for HX — its guidelines section is the written basis for the hxs-3 M6 contract suite (state log row 3): the parallel_tool_calls default-true-vs-flag nuance, the tool_choice auto-only rule, and the strict semantics are exactly the places where a harness assumption would silently diverge from the platform contract. For the local Ollama artifact each rule is a probe target (which fields Ollama honors is never assumed — request-level flag honoring is an M5/M6 compatibility probe; tool-layer sequencing is enforced KK3-side regardless)."
