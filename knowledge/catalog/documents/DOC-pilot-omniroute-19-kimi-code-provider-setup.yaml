  title: "PILOT-OMNIROUTE-LAYER0-001 19-kimi-code-omniroute-provider-setup.md — Kimi Code -> OmniRoute provider setup (reference, owner-approved 2026-08-27; implementation deferred until baseline completes — baseline now COMPLETE; the L1-M3 closure of the gateway itself remains owner-gated)"
  type: "runbook"
  declared_purpose: "Reference setup guide (status: reference, owner-approved 2026-08-27; implementation deferred until the baseline platform deployment completes — owner sequencing, OmniRoute state log row 43) to run Kimi Code sessions through the OmniRoute gateway (hxs-8) instead of a direct cloud provider — every call logged and metered in the gateway, local fleet models first-class, external models (OpenRouter) opt-in per session. §1 create a dedicated client key (owner, dashboard at http://192.168.50.207:20128 — do NOT reuse the root ops key /opt/omniroute/ops/.hx-client-key, the governor artifact; API Keys -> create 'kimi-code-hxsa', default scopes; shown once, becomes <HX_CLIENT_KEY>). §2 the exact config.toml block to append ([providers.omniroute] type openai, base_url http://192.168.50.207:20128/v1, api_key placeholder; four model entries — omniroute/qwen-x (ollama-local/hx-qwen3.8-27b-64k), omniroute/coder-x (ollama-local/hx-qwen3.6-coderx-64k), omniroute/meta-x (ollama-local/hx-muse-glimmer-64k) all at the 64K operating profile max_context 65536 with capabilities thinking + tool_use, and omniroute/glm-5.3-flash (openrouter/z-ai/glm-5.3-flash) capped 131072 with the cost caution; default_model UNTOUCHED — kimi-k3 stays the default, these are per-session opt-in; model ids verified against the live gateway catalog 2026-08-27, 1497 entries). §3 permissions (chmod 600 — the HX key can spend through the gateway, treated as equally sensitive). §4 use per session (/model picker; first test — a small bounded task, then confirm the calls appear in the gateway usage log; that proves the route). §5 rollback (/model back to moonshot-ai/kimi-k3 or remove the block; no other state touched). Notes and cautions: LAN-only (the provider only works on the HX network); cost — local models free to run, glm-5.3-flash bills against the owner's OpenRouter account if it is a paid model (set the OR spend cap before heavy agent use); data posture — local-model sessions stay on the fleet (local-first rule satisfied mechanically), glm-5.3-flash prompts leave the network and are retained by the provider (not used for training, per its terms); the governor exception STANDS — the owner's rule keeps Kimi-K3 as the governor brain; this setup is for worker sessions and post-baseline evaluation."
  inferred_value: "INFERENCE: the first consumer-onboarding runbook for the governed traffic plane — it turns the L1-M2 gateway into an opt-in session provider with the metering story (usage log) as the proof-of-route, while keeping the governor exception and the local-first posture mechanically intact; its cost/data cautions are the row-42 findings converted into operator instructions (spend cap first, paid tiers visible, prompts leave the network for external models)."
