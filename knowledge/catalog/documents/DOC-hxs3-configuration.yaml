  declared_purpose: 'Server configuration record per the server records contract (servers/AGENTS.md — ''What did HX configure this server to become?''), the FIRST of its class in this repository, written 2026-08-27T02:11Z at the M8 sign-off gate (owner-authorized by the M8 approval, hxs-3 state log row 23) from servers/_templates/configuration.md. Records hxs-3''s assigned role (Agent intelligence — copied from SERVER-REGISTRY.md, owner-ratified 2026-08-13; the record does not assign it) and primary workload (Meta-X tooling-inference backend: Ollama muse-glimmer:30b frozen digest de878ce33ad8…64c1, operating profile alias hx-muse-glimmer-64k digest 9dffb015db40…e7da, ctx 65536, resident Forever, per GOAL-HXS3-MUSE-GLIMMER-001 + KDD-0007), approved by Agent-Zero (goal 2026-08-26; M8 gate 2026-08-27, row 23). Registry alignment RESOLVED 2026-08-27: SERVER-REGISTRY.md now records Meta-X as hxs-3''s workload (the governor''s F-REG-1 fix on the owner''s ''fix it'' directive — hxs-2 state log row 60 — plus the dated superseded-assignment note preserving the 2026-08-13 gpt-oss/LightRAG mapping as history, OmniRoute state log rows 38/44; the current aligned state); the former registry Workload/Model divergence (''gpt-oss-20b TP=2; LightRAG graph & retrieval'' vs the owner-commissioned Muse Glimmer pilot''s configured workload) and the ''registry is owner-maintained and was not edited'' wording are recast as historical context — correct as written at the M8 gate; gpt-oss remains a task-shaped control per KDD-0007. Discovery reference: servers/hxs-3/discovery.md (as-found 2026-08-12) preserved unchanged (sha256 93bc5634…79d3 verified at writing, cited in 15-esme §7). Role objective: the factory''s primary tooling-inference backend (fleet call-sign Meta-X, blueprint §8) for the RAG pipeline — a sequential one-tool-call-per-turn specialist per KDD-0007 (the model proposes, never authorizes or executes; KK3 retains orchestration; parallel_tool_calling: false a first-class capability LIMIT in DOC-backend-meta-x, candidate until the owner''s M8 ACCEPT). Final configuration captured: Ubuntu 24.04.4 LTS kernel 7.0.0-30-generic (DKMS nvidia/580.173.02 for -28/-30), suspend targets masked ×4 (blueprint set, verified at M8), Secure Boot disabled (standing directive), Wi-Fi rfkill soft-blocked with boot persistence (D4), Etc/UTC + NTP time.cloudflare.com (fleet pass 2026-08-26T23:52:40Z); network 192.168.50.202/24 eno1 static gw .1, listeners *:11434 (loopback preserved) + :22 + loopback stub DNS only, NO firewall (owner rule — ufw inactive, nft/iptables empty), the /24 LAN itself the exposure boundary (blueprint §5) with the O1 :cloud-scan tripwire as named residual; storage root ext4 3.6 TB NVMe (3.4 TB free) with the model store on root per D1 (17 GB across the frozen artifact + aliases), 1.8 TB SATA unallocated; 2× PNY RTX 5060 Ti 16,311 MiB each, driver 580.173.02 retain-and-validate, zero Xid across all pilot evidence, both cards x8-wired against x16 max (Gen3 8.0 GT/s under load — the x8 width is the hard ceiling, measured M4/M7); Ollama 0.32.15 pinned (binary == server; 0.33.0 deliberately not taken, F-J4); frozen artifact dense 27.9B 52 blocks Q4_K_M max ctx 131,072, renderer/parser glimmer with ATEM, CLIP ''Muse Glimmer Hf'' 1.92B, Apache-2.0 (publisher-declared); four aliases FROM the frozen artifact with manifest layer-equality proofs (hx-muse-glimmer 472ad84e…, -32k 09c4f825…, -64k 9dffb015… the D5 operating profile resident, -128k 17fe5b80… qualified extended), baked sampling temperature 1 / top_k 64 / top_p 0.95 everywhere (the A01 rule); configuration paths with hashes — ollama.service 11758d46…1dbd3, hx3.conf 07824e4e…e7d5 (OLLAMA_HOST=0.0.0.0 loopback preserved, NUM_PARALLEL=1, MAX_LOADED_MODELS=1, CONTEXT_LENGTH=65536; NO_CLOUD removed 2026-08-26 by the ratified fleet web-search enablement), hx-ollama-preload b1798130…fe08 (bounded phases 208+300+30 = 538 s worst case, keep_alive=-1), ollama-preload.service 3b0e00b6…a5f6 (oneshot, TimeoutStartSec=600, enabled — 300 s under the 900 s D5 recovery SLO); web search ACTIVE (owner 2026-08-26), 0 :cloud tags. Services table: both units enabled+active, NRestarts=0, preload Result=success. Validation checklist all boxes ticked with milestone citations (M1 13/13; M8 boundary; storage across 3 cold reboots; M4 19/19 + M7 3 rungs; services ×3 boots; assigned workload M4/M7/M5/M8) plus the open gap recorded honestly: goal SC-06 multimodal probes have no executed evidence in the pilot record — reconciled OPEN at M8 §8, owner disposition required, not a defect of the configured state. Material Change Record: M1 OS readiness (05:13Z) -> M4 install+freeze (06:28Z) -> fleet web-search enablement NO_CLOUD removed (07:19Z) -> M7 rungs + preload/hx3.conf repoint to -64k (07:58Z) -> fleet time pass Etc/UTC (2026-08-26T23:52:40Z) -> M8 sign-off gate (2026-08-27T02:10Z: persistence 3/3 cold reboots 98 s deterministic, boundary proof, consumer-proof, this record — nothing to roll back, no baseline change in M8), each row with validation + rollback + unresolved issues. Sources cite discovery.md, the pilot package (01-state-log rows 1–23, 04/07/09/12(+A)/15), the goal file (D1–D8, SC-01…08), KDD-0007, blueprint §2–§6 + §8, SERVER-REGISTRY.md, and the fleet-time pass.'
  inferred_value: 'INFERENCE: this is now the first-stop answer to ''what is hxs-3 supposed to be'' — the fleet-level complement to the pilot''s evidence corpus, and the record future work orders on hxs-3 should cite for configured-state truth (its validation checklist points back into the pilot evidence chain rather than restating it). Same class role as DOC-tkv-hxs1-configuration for hxs-1. Freshness risk: it is a point-in-time M8 snapshot — any post-M8 host change must grow its Material Change Record or this record goes stale; the registry workload-field divergence (owner-side, F-REG-1 class) is RESOLVED 2026-08-27 (SERVER-REGISTRY.md now records Meta-X as hxs-3''s workload; the dated superseded-assignment note preserves the 2026-08-13 mapping as history).'
