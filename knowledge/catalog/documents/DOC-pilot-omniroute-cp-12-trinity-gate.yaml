  declared_purpose: "Session-binding packet for the trinity L1-M3 gate dispatch (goal binding GOAL-OMNIROUTE-L1-SECURE-CORE v1; work_order_id WO-L1-GATE-001; session trinity-l1-gate-20260827-01; role producer — OmniRoute lifecycle engineer, trinity; milestone L1-M3 — the Secure Core gate): objective — prove the gate: deep parity per reachable backend, restart ×2, one cold reboot, backup-and-restore, rehearsed rollback, hygiene close-out, configuration.md, and the acceptance package for the owner's sign-off. current_state: deployed — omniroute.service active+enabled on hxs-8 (Type=notify, READY + 60 s watchdog, user omniroute uid 999), Next 16.3.2 standalone at /opt/omniroute/app, 0.0.0.0:20128 (LAN+loopback, no firewall) — with the 2026-08-27 BIND NOTE: 0.0.0.0 on the LAN host with OmniRoute authN/authZ was the deployed choice under OD-07; PRE-GATE TASK for this work order (amended 2026-08-28, rr batch-10): rebind the primary listener to 192.168.50.207:20128 with a separate loopback listener (rr-47 follow-up) — apply during this gate's own restart sequence, verify non-LAN interfaces unexposed + authN/authZ intact, and record the post-bind evidence in the acceptance package [labeled correction 2026-08-28 (batch-10 wave): the note previously read 'tightening the bind to 192.168.50.207 specifically (loopback via separate listener) is queued as an owner-lane hardening decision for this gate window — it requires a service restart' — HISTORICAL, superseded: the item is no longer an owner-lane queue, it is a pre-gate task inside the gate WO itself per the governor's batch-10 disposition (state log row 50)]; secrets — OD-13 verified at M2: 0 plaintext rows in the DB secrets namespace, connection api_key AES-256-GCM ciphertext, management credential bcrypt at rest, root-only 0640 drop-in (hash-recorded, never valued); backends — Qwen-X/Coder-X/Meta-X registered with identity evidence; Chat-X registered with loopback-only posture PROVEN (posture-blocked, not failed); parity_baseline — M2 parity byte-identical ×3 reachable backends (content 42, stop, identical token counts), usage_history evidences the routed calls; findings_carried — cloudEnabled set explicit false (code-default true, caught at M2); backup moved to a versioned systemd timer (daily 03:17 UTC, integrity-gated, keep-20, 2 drill snapshots PASS); session JWTs stateless; Chat-X test_status display quirk noted; reboot_protocol — cold reboot PRE-APPROVED in a governor-announced window (hxs-1 D6 precedent; the owner may abort — honor it); after the reboot, re-prove both the service AND the four backends' own residencies from their hosts. owner_decisions: OD-12 authorized; OD-04 native no-docker; OD-08 amended all-four; OD-13 verified; OD-07 LAN-only + OmniRoute authN/authZ + no host firewall; OD-09 plaintext snapshots + own encryption; local-model-only everywhere. constraints: the four LLM backends are read-only consumers (identity guards before/after, never a change to them); secrets existence + mechanism only — zero values anywhere, zero :cloud, agent surfaces stay disabled; everything versioned and reversible, sanitized command log, helpers deleted at task end. evidence_requirements: G1-G6 evidence per the work order's gate_tests (parity comparisons, restart/reboot timelines vs budgets, restore proof, rollback proof, hygiene close-out); configuration.md complete per servers/AGENTS.md; acceptance reconciliation per the goal's seven gate items with evidence pointers; pre/post hashes for every state touched + the sanitized sequential command log. consulted_records: 03-trinity-l1-install.md; goals/2026-08-27-omniroute-layer1-secure-core.md; servers/AGENTS.md; servers/hxs-3/configuration.md (first-of-class template); the DOC-backend-* records. handoff: deliverable 05-trinity-l1-gate.md goes to Carol for catalog receipt; the handoff stays OPEN until the receipt is cited in the pilot state log; the governor then presents the acceptance package for the owner's ACCEPT verdict. second_brain_evaluation: per the work order — the reusable service-acceptance battery."
