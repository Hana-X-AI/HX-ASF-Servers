  title: "09-work-order-john-chatx.yaml — WO-HXS4-JOHN-L1-001 (Chat-X bounded alignment: pin 0.32.9 → 0.32.15 + ladder 32K/64K/128K + three-profile freeze; DISCHARGED — milestone complete)"
  type: "work-order"
  declared_purpose: "Delegated contract commissioning john / Esme (session john-chatx-20260826-01) for the Chat-X bounded alignment + ladder + three profiles — bring Chat-X onto the blueprint pattern, bounded: (1) align Ollama to the fleet pin 0.32.15 (from 0.32.9; blueprint consistency — the parked alignment item activated by the owner order; reversible by reinstall); (2) run a bounded capacity ladder on qwen3.5:9b-q4_K_M (6.6 GB, digest 6488c96f…): rungs 32768, 65536 (its commissioned default), 131072 — rung Modelfiles FROM the exact digest with only num_ctx varied, capacity proof per rung (resident, KV measured, needle at ~95% depth, no OOM); (3) freeze aliases hx-qwen3.5-9b-32k / -64k / -128k with per-rung digest equality, repoint the default usage reference to hx-qwen3.5-9b-64k (its already-native default), and record it all as Chat-X's profile set. NO preload/persistence unit in this milestone (Chat-X stays owner-provisioned on-demand; persistence is a separate parked owner decision). NO endpoint change (stays loopback-only per current posture). Owner authorizations: owner 2026-08-26 'complete each ladder and profile entries so they appear the same way hxs-1's did — identical pattern, same blueprint' (all LLMs 1-4); the blueprint alignment item activated by that order: version pin 0.32.15 (reversible); preload/persistence and LAN posture remain PARKED owner decisions — do NOT implement them here; NOT authorized: preload/persistence units, endpoint changes, firewall anything, sampling changes, other models, reboots. Boundaries: hxs-5 session, SSH hxsa@192.168.50.203, askpass helper READS the credential from the HX Fleet SSH Access Guide credential-record row at execution time (no extracted copy, helper deleted at task end), hostname + peer IP verified first, sudo -n only; rung Modelfiles FROM the exact digest with num_ctx the ONLY changed parameter; versioned fixtures (needle_probe.py alias-parameterized) run locally on hxs-4 against 127.0.0.1:11434; one bounded correction per failed correctable step; stop conditions: version pin breaks the service (restore 0.32.9 path and report), OOM, any Xid. Rollback: reinstall prior version path for the pin; aliases removed via ollama rm (tags only); pre-state hashes recorded. Deliverable: 10-esme-chatx-ladder-profiles.md. Second Brain evaluation: opportunity identified — ladder pattern on the lightest host, completing the fleet's four-host profile uniformity; disposition implemented."
  inferred_value: "INFERENCE: this is the WO that closed the fleet's four-host uniformity claim — its boundaries are the instructive part: the owner kept preload/persistence and the LAN posture parked even while activating the pin, so Chat-X gained the blueprint's measured profile set without gaining a persistence or exposure contract; the later O2 amendment (owner decision, state log row 21) was executed under the resumed session as a separate provenance-carrying amendment, not smuggled into the ladder."
