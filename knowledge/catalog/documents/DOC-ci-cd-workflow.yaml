document:
  id: DOC-ci-cd-workflow
  title: .github/workflows/ci-cd.yml — p8 CI/CD pipeline definition (owner-ratified 2026-08-26; 18 steps across gates / coderabbit-review / pr-manage; trigger every push to any branch)
  type: contract
  declared_purpose: 'The repository''s machine-enforced quality-gate contract (name: ci-cd), ratified by the owner 2026-08-26 under plan p8 (argent-groot-ant-man). Trigger: every push to any branch. Job gates (all pushes, happy path ~3 min): checkout full history, Python 3.12 setup, byte-compile lint of scripts + fixtures, shellcheck of repo hooks, fixtures regression suite, wiki renderer suite, wiki HTML sync check (render.py --check), catalog validation (scripts/validate.py), and a gitleaks secret scan over the pushed commit range (redacted). Job coderabbit-review (non-main pushes): installs the CodeRabbit CLI and runs `coderabbit review --agent --light --base origin/main`; skips cleanly with a notice until the CODERABBIT_API_KEY repo secret is configured; the gate FAILS on any critical/major finding and fail-closes on a run with no complete event (auth/service failure); posts the severity summary to the PR. Job pr-manage (non-main pushes, always): ensures a PR exists (auto-create targeting main on first push), auto-labels by branch prefix (feature/ fix/ chore/), arms GitHub platform auto-merge (squash), and comments the pipeline state. Auto-merge fires only when the required checks (gates, coderabbit-review) are green on the PR — no manual approval gates anywhere. Branch protection on main requires the two checks for PR merges only; direct governor pushes to main stay possible (governor-on-main flow preserved). CURRENT BEHAVIOUR (2026-08-30): feature-branch pushes review the PUSHED RANGE (BEFORE..HEAD) rather than the whole branch diff, falling back to origin/main when BEFORE is empty, all-zeros, unresolvable, or not an ancestor of HEAD (KDD-0022 — whole-branch payloads closed the CodeRabbit WebSocket once large). The job is FAIL-CLOSED on a missing CODERABBIT_API_KEY and on any review that ends without a complete event, and it distinguishes UNREACHABLE (service/auth) from code findings in both the error and the step summary. Blocking severity is critical+major+MINOR (owner directive 2026-08-28, zero-tolerance). The CodeRabbit CLI installer is pinned by SHA-256 and refuses to execute on digest mismatch; --region is stated explicitly for inline api-key auth. gates additionally runs the work-state engine suite (O1).'
  inferred_value: 'INFERENCE: this moves the factory''s existing local quality discipline (validate.py, fixture suite, wiki sync, secret sweep — the same commands the factory runs locally) into the hosted merge path, so a change cannot reach main through a PR without passing the catalog/wiki/fixtures/secret gates; the CodeRabbit leg is the repo''s first automated external review gate, deliberately fail-closed on CLI failure and deliberately non-blocking for minor/trivial findings (fix loop: factory agent fixes on the branch, <=2 passes).'
