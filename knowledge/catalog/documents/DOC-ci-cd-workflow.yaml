document:
  id: DOC-ci-cd-workflow
  title: .github/workflows/ci-cd.yml — p8 CI/CD pipeline definition (owner-ratified 2026-08-26; 25 steps across gates / coderabbit-review / pr-manage; trigger every push to any branch)
  type: contract
  declared_purpose: 'The repository''s machine-enforced quality-gate contract (name: ci-cd), ratified by the owner 2026-08-26 under plan p8 (argent-groot-ant-man). Trigger: every push to any branch; 25 steps across three jobs. Job gates (all pushes, happy path ~3 min): checkout full history, Python 3.12 setup, byte-compile lint of all Python, shellcheck of repo hooks, fixtures regression suite, wiki renderer suite, wiki HTML sync check (render.py --check), PyYAML install, work-state engine suite (O1 — ordered after the PyYAML install, which it depends on), hook-manifest verifier suite (O5), work-order engine suite (O2), secret-boundary corpus suite (O6; scripts/test_secret_boundary.py), capability registry suite (O8), catalog-freshness baseline regression suite (SY-8, including a clean-interpreter loader probe and post-baseline source/record mutation cases), skill-registry smokes (O7 — smokes execute skill commands, so they run here rather than inside the read-only validator), catalog validation (scripts/validate.py), and a gitleaks secret scan over the pushed commit range (redacted). Job coderabbit-review (feature-branch/PR pushes only — `if: github.ref_name != ''main''`; owner directive 2026-08-30 skips post-merge main pushes, whose commits were already reviewed on the PR, after a post-merge re-review produced a red run on a completed merge, ci-cd #61): installs the CodeRabbit CLI from an installer pinned by SHA-256 that refuses to execute on digest mismatch, then reviews the PUSHED RANGE — `coderabbit review --agent --light --committed --base-commit <BEFORE>` — rather than the whole accumulated branch diff (KDD-0022: a whole-branch `--base origin/main` payload grows with every push and the service drops the WebSocket once it is large). It falls back to `--base origin/main` only when BEFORE is empty, all-zeros, unresolvable, or not an ancestor of HEAD (force-push). `--region` is stated explicitly for inline api-key authentication. The job is FAIL-CLOSED on a missing CODERABBIT_API_KEY (a required check that cannot run is a failure, not a vacuous pass) and on any review that ends without a complete event, and it distinguishes UNREACHABLE (service/auth) from code findings in both the error annotation and the step summary; a recoverable rate_limit gets bounded retries at the service-provided waitTime. Blocking severity is critical + major + MINOR (owner directive 2026-08-28, zero-tolerance — all findings block, not severity triage). Posts the severity summary to the PR. Job pr-manage (non-main pushes, always): ensures a PR exists (auto-create targeting main on first push), auto-labels by branch prefix (feature/ fix/ chore/), arms GitHub platform auto-merge (squash), and comments the pipeline state. Auto-merge fires only when the required checks (gates, coderabbit-review) are green on the PR — no manual approval gates anywhere. Branch protection on main requires the two checks for PR merges only; direct governor pushes to main stay possible (governor-on-main flow preserved). CONCURRENCY (corrected twice on 2026-08-30 — see KDD-0022 Amendment 1 and its two corrections): `group: ci-${{ github.ref }}`, `cancel-in-progress: false`, `queue: max`. Because the review covers the PUSHED RANGE, cancelling a run destroys the only review that range will ever get: the next run computes a new BEFORE and never looks back. Two cancelled reviews let 612 unreviewed insertions reach main through PR #7 (565 from b489216, 47 from d2d8a31; runs 33334670361 and 33334985041). `queue: max` retains up to 100 pending runs per group so pushed ranges serialize; the default `queue: single` keeps only one pending run, which is why an earlier `cancel-in-progress: false` alone did not fix it. `queue: max` cannot be combined with `cancel-in-progress: true`. A second earlier attempt — adding github.sha to the group — is also retired: it prevented cancellation by ensuring nothing ever contended, which defeats the concurrency group and spends a runner per push. Bound stated rather than implied: beyond 100 pending runs on one branch GitHub cancels the excess. Gates gained the secret-boundary corpus suite 2026-08-30 (O6): it runs BOTH scanners against governace/secret-boundary-corpus.yaml so the hook and validate.py cannot silently diverge again.'
  inferred_value: 'INFERENCE: this moves the factory''s existing local quality discipline (validate.py, fixture suite, work-state suite, wiki sync, secret sweep — the same commands the factory runs locally) into the hosted merge path, so a change cannot reach main through a PR without passing the catalog/wiki/fixtures/secret gates; the CodeRabbit leg is the repo''s first automated external review gate, fail-closed on CLI failure, missing key, or absent complete event, and zero-tolerance on findings — critical, major and minor all block (owner directive 2026-08-28). Fix loop: the factory agent fixes on the branch and re-pushes; the pipeline re-runs itself.'
