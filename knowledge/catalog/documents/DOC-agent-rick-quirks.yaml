  title: "agents/rick/quirks.md — rick's quirks register (7 seeded entries with evidence pointers; standing startup input to every rick assignment; every F-class quirk gets an entry at handoff)"
  type: "runbook"
  declared_purpose: "Rick's quirks register (owner-ratified commission, hxs-2 log row 55; delivered row 56). Standing input to every rick assignment — read at startup alongside agents/rick/profile.md. The register is where discovered platform quirks become permanent knowledge: each entry is a fact with an evidence pointer, never a guess, never folklore. Maintenance rules per its header: every future F-class quirk discovered during a task gets an entry at that task's handoff (one line, evidence pointer mandatory); entries are applied, not just recorded (cite the entry in the deliverable instead of re-deriving); entries are never silently rewritten — corrections append a dated note; format name | symptom | root cause | rule to apply | evidence pointer | date added. Seeded 2026-08-27 with 7 entries: (1) timedatectl comma-`-p` quirk (systemd 255 — query single properties; never trust an empty `show` as a negative result); (2) ufw unit-state artifact (rule firewall state on /etc/ufw/ufw.conf ENABLED=, unit state informational only); (3) boot-cleared /tmp on hxs-3 (pull evidence off-host at capture; root cause UNCONFIRMED by its own text); (4) sleep-mask proven set (4-target masked set on LLM hosts; hxs-2's extra sleep.target mask = documented harmless superset; manage via fleet-sleepmasks.sh, never ad-hoc); (5) DMI capacity under-report (trust OS-level data + per-module dmidecode type-17 over the DMI array capacity field; hxs-8); (6) NVRM teardown assertions (monitor-only chatter class on 580.173.02, NOT a halt trigger — Xid remains the stop class); (7) set-timezone vs running processes (cosmetic stale-zone labels post-switch; do not restart services outside the work order)."
  inferred_value: "INFERENCE: the compounding half of rick's lane memory — it converts per-task F-class findings into standing startup knowledge so a quirk is paid for once, and it pairs with DOC-tkv-corpus-ubuntu-refs-ubuntu-24-04: the pinned noble man pages carry the baseline command contract, this register carries the fleet-specific amendments to that contract (the MANIFEST's own notes state the pairing)."
