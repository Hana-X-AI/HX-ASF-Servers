  declared_purpose: "First agent re-verification record for hxs-20 (file created 2026-08-28 by rick's fleet baseline wave, session rick-fleet-baseline-20260828-01 — NO human pre-discovery preparation record exists for this host; the file opens with the agent re-verification section): verdict REPORT — baseline green (8/8 PASS post-change vs the server-default rules) with hostname and addressing drift recorded (owner/governor close them — CLOSED IN FACT at the registry the same wave). Addressing (FACT, supersedes the work-order IP, both values kept): the WO carried hxs-20 = 192.168.50.219 per the fleet .199+N pattern; live — .219 does not answer ping; the owner-supplied servers/hxs-20/discovery.md records eno1 = 192.168.50.220 and .220 answers with hostname hx-20; the discovery address is the real one — the fleet pattern does NOT hold for hxs-20. Identity/OS (FACT, verified live against the owner-supplied discovery): the host-key ceremony 2026-08-28T01:14Z — TOFU-with-corroboration (D-record): no fingerprint exists in any HX record for this host (precedent rick F-05, hxs-2/hxs-3, owner-authorized), the live ED25519 key pinned ONLY on immediate corroboration vs the discovery (hostname prompt hx-20 MATCH, eno1 .220 MATCH, boot 00:23:48Z consistent with the owner session 00:21-00:24Z), StrictHostKeyChecking=yes on every connection; the presented host key ED25519 SHA256:ZUEHfcFL+1Ru070e163g0uJDT7eOwlQh3MW8NZF3Mco recorded so future hxs-20 tasks pin strict — a mismatch must halt the session. Live hostname hx-20 (NOT hxs-20; the discovery already flagged the identity open); machine-id 7b5cd0b865e5462682a619a5b0c9d894 (FIRST LIVE reading — the discovery had none); Ubuntu 24.04.4 LTS kernel 7.0.0-30-generic MATCH; uptime since 2026-08-28 00:23:48 UTC; CPU i5-7500 4c/4t; memory 32 GB (2×16 GB Samsung DDR4 @ 2400 MT/s — DIMM1 M471A2K43DB1-CTD + DIMM3 M471A2K43CB1-CTD) via sudo -n dmidecode; single NVMe 238.5G (p1 vfat /boot/efi, p2 ext4 /) — all FIRST LIVE readings (the discove