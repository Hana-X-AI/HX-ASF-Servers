  type: "work-order"
  declared_purpose: "Delegated contract commissioning john/Esme (session john-pb-20260825-01) to bring the ollama-preload startup budget under the D5 recovery limit (recover <= 900 s, state log rows 9-10). Verified live state at commissioning: ollama-preload.service ran with TimeoutStartUSec=20min (1200 s — 300 s over the SLO) and the preload script's curl retry budget was unbounded in the worst case (measured reality: 51-60 s boot-to-ready at the 64K profile). Two named changes and nothing else: (1) reduce TimeoutStartSec to a justified value <= 900 s (recommend 600 s: 10x the measured 60 s, 300 s margin under D5); (2) bound the script's cumulative retry/delay budget below the new TimeoutStartSec — separate API-wait (bounded fast probes) from the model-load call (single attempt, --max-time sized for a cold 64K load with margin; no retry-on-timeout), preserving the exact alias+digest /api/ps assertion and failure semantics (nonzero exit, journal message). Owner authorizations: owner directive 2026-08-25 'do it now' (state log row 53); NO ollama.service restart, NO reboot, NO keep_alive:0, NO model-store or frozen-identity change. Boundaries: the two named files only; versioned change (pre/post sha256, unified diff, shellcheck clean); one manual NON-REBOOT verification run; ratified askpass execution path (credential read at execution, never extracted). Deliverable: 35-esme-preload-budget.md (completed PASS — TASK COMPLETE; cataloged this run)."
