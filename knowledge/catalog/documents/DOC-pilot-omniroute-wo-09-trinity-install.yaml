  title: "09-work-order-trinity-install.yaml — WO-L1-TRINITY-INSTALL-001 (L1-M2: pinned OmniRoute install on hxs-8 + OD-13 secrets design + four-backend registration — trinity's first MUTATING commission; DISCHARGED — L1-M2 COMPLETE, state log row 37, 2026-08-27T17:38Z; deliverable DOC-pilot-omniroute-ev-03-trinity-l1-install)"
  type: "work-order"
  declared_purpose: "Delegated contract commissioning trinity (owner-ratified lane, KDD-0008; her FIRST MUTATING commission) for L1-M2 of GOAL-OMNIROUTE-L1-SECURE-CORE (goal_file goals/2026-08-27-omniroute-layer1-secure-core.md): install OmniRoute v3.8.51 on hxs-8 from the verified pinned corpus as a native systemd service; deploy it with the OD-13 secrets design (env-provisioned JWT_SECRET + API_KEY_SECRET + STORAGE_ENCRYPTION_KEY, never product defaults); register all four HX backends with identity evidence; configure management authN/authZ and the LAN-only exposure; set the disabled-by-default agent surfaces explicitly off; and lay the plaintext-snapshot backup design — all versioned and reversible. owner_authorizations: OD-12 Layer 1 authorized 2026-08-27; OD-04 native systemd never Docker; OD-08 amended (all four backends); OD-13 secrets rule ratified; OD-07 LAN-only + OmniRoute authN/authZ + no host firewall; OD-09 plaintext snapshots + own encryption; local-model-only everywhere; runtime present — /opt/node-v24.20.0 + /usr/local/bin symlinks (rick L1-M1 PASS — use it, do not install another Node); source /opt/tkv-local/OmniRoute-release-v3.8.51 READ-ONLY (copy to a work location on hxs-8 and build there; corpus hash-witnessed before and after, byte-identical); NOT authorized — Docker/containers/snap, other hosts or backend changes, cloud providers or cloud agent features, enabling any agent-like surface (MCP/A2A/ACP/Conductor/copilot/tunnels/cloud agents/skills/plugins), exposure beyond the LAN, firewall, Layer-2+ route/combo/strategy work. Boundaries: execution from hxs-5 via SSH with the askpass discipline; identity verified first against servers/hxs-8/discovery.md; secrets discipline — generate the three values locally (openssl rand -hex 32 class), provision via the systemd unit's Environment= lines (root-only 0640 drop-in, recorded by hash NEVER value), values in NO artifact/log/receipt/model context, the catalog records EXISTENCE + mechanism only; service conventions per the blueprint (native unit + versioned drop-in, budgets, no RemainAfterExit hacks that mask failure); everything versioned and reversible with documented inverses; the corpus stays pristine (sha256 before/after must be byte-identical). install_design: copy corpus to /opt/omniroute/src (or documented equivalent); npm ci --ignore-scripts per the source's own contract (the P8 container evidence used the same; handle the native-binary fixup CAP-P8-006 if the build needs it); build the Next.js standalone output per the product's own AGENTS.md (upstream guidance); deploy from the standalone build under /opt/omniroute with a systemd unit (Environment= for the OD-13 secrets, DATA_DIR under /opt/omniroute/data, HOSTNAME/LAN bind per the P8 standalone posture); build failure that cannot be bounded = STOP and escalate — never force an alternate runtime or a container (NO container fallback). secrets_design verification (method only, post-start): (a) no plaintext JWT/API secret in the DB key_value secrets table (the P4/P5 plaintext finding), (b) connection-row credential fields AES-256-GCM ciphertext (activates with STORAGE_ENCRYPTION_KEY). backends_registration: all four with identity evidence from the backend-capability records — Qwen-X hxs-1:11434 (hx-qwen3.8-27b-64k, digest 766cd9469fb4…), Coder-X hxs-2:11434 (hx-qwen3.6-coderx-64k, digest ec9ebe08a824…), Meta-X hxs-3:11434 (hx-muse-glimmer-64k, digest 9dffb015db40…), Chat-X hxs-4:11434 LOOPBACK-ONLY today (register it, record the posture: NOT LAN-reachable from hxs-8; parity only if posture allows, else posture-blocked not failed); each registration carries endpoint, profile alias, expected digest, ctx, capability notes; live identity verification from hxs-8 before registering (except Chat-X); a failed identity verification = do not register, report. exposure_and_management: LAN bind only, loopback preserved, no firewall (owner rule); management authN/authZ per the P4 proxy.ts evidence (management credential env-provisioned, same discipline; anonymous gets the documented limited view, management full view — never record the credential); skills execution and background jobs set explicitly off/explicit (the not-code-enforced finding); all agent surfaces verified disabled. backup_design: plaintext SQLite snapshots on a schedule to a managed directory (retention per product default 20); own encryption wrapper only if required later (OD-09: product encryption write-only, cloud upload a dead endpoint — never rely on either). Deliverable: 03-trinity-l1-install.md — versioned install record (source path + hashes, build evidence, unit + drop-in hashes, env-provision mechanism by name not value), secrets verification evidence (method only), backend registration records with identity evidence, exposure + management auth evidence, disabled-surface verification, backup design, pre/post hashes, documented inverses, sanitized sequential command log, Task May Proceed receipt — PLUS the L1-gate evidence section (direct-vs-routed parity per reachable backend, health-surface checks, service-restart routing-intact check; cold-reboot cycle belongs to the L1-M3 gate WO unless trivially safe — state the choice and why). Budgets: sessions 2, transient_retry 1. Stop conditions: build fails environmentally and cannot be bounded (escalate); corpus hash mismatch at any point (STOP — integrity); scope exceedance; secrets verification fails (do not paper over); backend identity verification fails (do not register — report). Rollback/containment: documented inverse per change (unit stop+remove, /opt/omniroute removal, data wipe, backend unregistration); pre-state hashes recorded. second_brain_evaluation: opportunity yes — first governed traffic plane + first secrets-design deployment (configuration.md for hxs-8 the second of its class); disposition implemented (install record + secrets pattern + backend registrations become catalog content at handoff)."
  inferred_value: "INFERENCE: the highest-consequence WO the factory has issued to a non-governor lane — first production install, first secrets-handling contract, first four-backend integration — and its shape shows the Layer-0 ledger doing real work: nearly every boundary line cites a P4/P5/P8 finding (plaintext secrets, STORAGE_ENCRYPTION_KEY activation, not-code-enforced surfaces, write-only backup encryption, dead cloud endpoint), i.e. the capability inventory converted directly into deployment constraints."
