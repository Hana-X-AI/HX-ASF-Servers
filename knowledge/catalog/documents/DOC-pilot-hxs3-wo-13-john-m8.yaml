  title: "13-work-order-john-m8.yaml — WO-HXS3-JOHN-M8-001 (hxs-3 M8: Meta-X sign-off gate — 3 cold reboots pre-approved per-cycle, endpoint boundary, consumer-proof, first configuration.md, acceptance reconciliation; DISCHARGED — milestone complete)"
  type: "work-order"
  declared_purpose: "Delegated contract commissioning john / Esme (session john-m8-hxs3-20260827-01) for hxs-3 milestone M8 — the Meta-X sign-off gate: prove the frozen operating profile (hx-muse-glimmer-64k, digest 9dffb015db40…, ctx 65536) returns to ready state with NO human action across THREE cold reboots (AC-007-class pass 3/3); prove the endpoint boundary as designed; run one consumer-class RAG-pipeline-shaped tool task against the alias end-to-end; write servers/hxs-3/configuration.md per the server-records contract (the FIRST of its class); and reconcile the goal's success criteria for the owner's acceptance decision. Owner authorizations: owner 2026-08-27 'Meta-X M8 approved' (state log row 23) — the full gate; three COLD reboots pre-approved per-cycle inside a governor-announced window (hxs-1 D6 precedent — pre-approved per-cycle; the owner may abort at any time, honored immediately after the current poll completes); NOT authorized: baseline changes (drop-in, Modelfile, aliases, units beyond evidence capture, model store), sampling changes, firewall (owner rule — none), endpoint changes, other models, package installs, M8 on any other host. Boundaries: hxs-5 session, SSH hxsa@192.168.50.202, askpass helper READS the credential from the credential-record row at execution time (never printed/logged/stored, helper deleted at task end), hostname + peer IP verified first, sudo -n only, host key pinned (F-05); hxs-3 now Etc/UTC (fleet pass 2026-08-26T23:52:40Z) — UTC labels, the RUNNING ollama process may still format EST offsets cosmetically until its next service restart (explained, not drift); /tmp BOOT-CLEARED (F-M5-1 fact) — every cycle's evidence pulled off-host IMMEDIATELY after each cycle, before the next reboot; interactive-use rule (MAX_LOADED_MODELS=1): an evicted -64k pin is restored via the frozen preload path (systemctl restart ollama-preload.service) with F-M5-1-class disclosure; Xid-watch armed (F-M6-0 class — any Xid = immediate stop + escalate; NVRM teardown-assertion chatter a recorded class — record, don't panic); incremental deliverable after EVERY phase (a stop never costs more than one phase); one bounded correction per failed correctable cycle — a failed cycle is a finding, never silently re-run. Reboot-cycle protocol per cycle (3 total): pre-state capture (/api/ps identity, digests, unit hashes, journal cursor); cold reboot (systemctl reboot; boot via uptime + boot-id change); poll /api/ps until resident — detection/recovery timings vs D5 (detection <=120 s, recovery <=900 s; preload script <=538 s, TimeoutStartSec 600); identity guard EXACT (name, digest 9dffb015db40…, size == size_vram, context_length 65536, Forever; preload Result=success); journal + Xid + NRestarts sweep; evidence off-host immediately. Endpoint boundary proof: listener shape (*:11434 with loopback preserved — ss -lntp), LAN reachability from hxs-5 (authorized 192.168.50.0/24 member), no host firewall anywhere (owner rule; ufw absent/inactive), boundary = the /24 LAN per blueprint section 5 with the O1 monitoring tripwire named as the residual — proof only, no boundary changes. Consumer-proof: one RAG-pipeline-shaped tool task (retrieved-document question + one tool call), native sampling, the one-call-per-turn contract exercised end-to-end — response shape, conformance, latency reported as §8 consumer-contract evidence. configuration.md per servers/AGENTS.md: role (Meta-X tooling specialist backend, KDD-0007 contract), workload, the material configuration chain (install, frozen artifact + aliases, profiles, preload, exposure, web search, TZ/NTP), validation pointers to the pilot evidence; discovery.md preserved untouched. Deliverable: 15-esme-m8-signoff.md — cycle table (3/3 with timings vs D5), identity guards, endpoint boundary proof, consumer-proof evidence, configuration.md written, acceptance reconciliation per goal SC item, sanitized sequential command log, Task May Proceed receipt — assembled for the owner's ACCEPT decision."
  inferred_value: "INFERENCE: this is the gate that converts Meta-X from a candidate into a production backend — the 3/3 no-human-action persistence proof is the fleet's second AC-007-class sign-off (hxs-1 pattern) and the first on the tooling-specialist class; the configuration.md deliverable instantiates the server-records contract for the first time and becomes the reference for the remaining fleet hosts; per the WO's own second-brain evaluation, every prior milestone exists to make this one cheap, and the backend-capability registration flips candidate -> active only at the owner's ACCEPT (post-deliverable governor wave, not this contract)."
