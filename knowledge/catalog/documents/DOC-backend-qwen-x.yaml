notes:
  record_class: 'NEW RECORD CLASS — backend capability (typed registry per judgment): blueprint §8 and KDD-0005/0006 designate the catalog as the capability registry; each record of this class is one registry entry binding a fleet call-sign to endpoint + frozen identity + capabilities + limits + owner. The consumer-binding force lives in blueprint §8 (type contract) which these entries reference; parallel to DOC-tkv-server-registry holding fleet rows whose force is owner ratification. First materialization of the capability-registration convention flagged at the hxs-3 M0 run (capability LIMITs are first-class registry content — see DOC-backend-meta-x for the first LIMIT-carrying entry).'
  callsign_convention: 'Fleet capability call-signs (owner, 2026-08-26): every LLM backend carries a capability-level call-sign resolved through its Second Brain backend-capability record — never a bare Ollama tag (the hxs-1 bare-alias ambiguity lesson, retired on hxs-1). The X in a call-sign is ALWAYS capital. Status candidate until the host''s M8 sign-off; Qwen-X is ACTIVE because hxs-1 is M8-signed.'
  identity_semantics: 'The frozen digest cited (766cd9469fb4…) is the M6b-frozen hx-qwen3.8-27b-64k operating/resident profile manifest digest (evidence: 29-esme M6b profiles, 30-esme M7a reboot cycles, 38-cp exposure packet — resident hx-qwen3.8-27b-64k:latest, 20,463,789,012 B, 100% VRAM, ctx 65536, Forever). Each hxs-1 profile alias carries its own manifest digest per baked ctx (32k db2c6206…, 128k 94b83a1e…); identity = exact alias + its frozen digest, per blueprint §1.'
