  title: Backend-capability record — Qwen-X (hxs-1, 192.168.50.200:11434; qwen3.8:27b Q4_K_M; status ACTIVE, M8-signed)
  type: registry
  declared_purpose: 'Fleet backend-capability registration per servers/BLUEPRINT-llm-server.md §8 (registration schema: endpoint, exact tag + digest, capabilities, runtime profile, health/evidence contracts, owner). call_sign ''Qwen-X'' (owner fleet call-sign directive 2026-08-26; the X in a call-sign is ALWAYS capital) = hxs-1 (192.168.50.200), the fleet Deep reasoning & synthesis backend (Qwen 3.8 27B). Endpoint http://192.168.50.200:11434 (Ollama API: /api/generate, /api/chat, /api/ps, /api/tags; reachable only from 192.168.50.0/24 with no service-layer auth — the private LAN is the boundary, loopback preserved; exposure posture per the hxs-1 SC-07a amendment and blueprint §5). Model qwen3.8:27b GGUF Q4_K_M, frozen digest 766cd9469fb47c42890616880772f2647fcfe4656b7550e5cc37ab186cc99d8a (M6b freeze — the hx-qwen3.8-27b-64k operating/resident profile manifest; see notes.identity_semantics). Profile aliases: hx-qwen3.8-27b-32k (recovery baseline, digest db2c6206…), hx-qwen3.8-27b-64k (operating default, resident), hx-qwen3.8-27b-128k (qualified extended, 94b83a1e…); model reference is alias-only — never upstream tags, never :latest. Capabilities: completion; tool calling (native, validated on hxs-1); thinking ON by default; vision NOT in baseline. Runtime profile: ctx 65536 operating (hx1.conf; clients do NOT send num_ctx — the server profile governs). Health/evidence contracts: ollama-preload.service with the bounded-phase preload script (TimeoutStartSec=600; script worst case ≤538 s = 208 s probes + 300 s single-attempt load + 30 s /api/ps assertion of exact alias + frozen digest; 900 s D5 recovery SLO); both units enabled/active; identity + residency proven across three cold reboots (M7a). Limits: serialized admission (OLLAMA_NUM_PARALLEL=1, OLLAMA_MAX_LOADED_MODELS=1) — consumers MUST serialize requests; native-defaults baseline sampling (A01 rule — no overrides). Owner: Agent-Zero. Status ACTIVE — hxs-1 is M8-signed (pilot M0–M8 closed PASS 2026-08-26).'
  inferred_value: 'INFERENCE: this is the resolve target behind the Qwen-X call-sign — blueprint §8 makes consumers configure from §8 AND the live catalog record, so this entry is a runtime dependency for every gateway, router, agent preset, and client that addresses the reasoning backend; its freshness requirement is therefore operational, not archival.'
