document:
  id: DOC-kdd-0024-two-stage-closure
  title: 'KDD-0024 — Two-stage closure: cataloguing does not gate acceptance (O4)'
  type: decision
  declared_purpose: 'Ratified decision (2026-08-30) resolving a five-day contradiction between two ratified records that never cited each other: AGENTS.md (2026-08-25) made a material handoff "incomplete without Carol''s catalog receipt", while KDD-0013 Amendment 5 (2026-08-29) directed that "no gate, handoff, or lane blocks on her output". Owner directive 2026-08-30 — non-critical-path work must never block critical path, agents included — settles it for Amendment 5. D1: a handoff has two independent states, execution_accepted (evidence produced and deterministic gates passed; the acceptance row is written, goal status updates, and the next work order may dispatch) and catalog_pending/catalog_complete (knowledge projection, tracked separately, never gating). D2: Carol''s receipt is still required — this is a sequencing change, not a removal. D3: synchronous exception, deliberately narrow — authority, security, schema, agent-identity and reusable-platform-knowledge changes take the receipt before closure, and an unclear class is treated as synchronous. D4: the goal work-state schema is deliberately NOT extended; execution_accepted is a handoff state at work-order granularity, and adding it to the goal enum would conflate two levels — the state lives in the hx gate receipt (O3). D5 as originally written called all three amended documents append-only; Amendment 1 (2026-08-30) corrects that: AGENTS.md and governace/process/** are LIVE artifacts corrected in place per the CLAUDE.md artifact-class policy, and they were re-corrected accordingly, with the unclear-class fallback added to both context-packet templates. Evidence of record that the blocking rule was already failing: catalog receipt 2026-08-27T0030Z-carol-tmicro-fleet-time-pass.md parks a handoff OPEN because Carol''s write set was scoped elsewhere.'
