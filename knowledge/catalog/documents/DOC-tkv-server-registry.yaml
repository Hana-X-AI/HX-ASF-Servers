  superseded_20260827: 'MARKED SUPERSEDED 2026-08-27 (review-batch follow-up wave; OmniRoute state log row 44 queue — ''index marks it superseded pointing to DOC-server-registry as authoritative''): status active -> superseded, freshness current -> superseded, superseded_by [DOC-server-registry] + the relation edge above; authority_level ratified-governance PRESERVED per the dispatch (the TKV registry''s owner-ratified content lineage stands). Rationale: the REPO copy is the living registry of record for consumers (minted at the M2-handoff wave as source of truth with this copy as mirror); the TKV mirror file itself is maintained by the governor and this record continues to track it (re-hashes on amendment). ALSO in this wave: (a) declared_purpose updated — the ''hxs-cp control plane deliberately outside the fleet'' wording is historical pre-amendment; hxs-5 is the CURRENT control plane per owner advisory 2026-08-27 (rows + historical note carry the succession); (c) re-hash 24053689… -> caff7987… — the TKV file gained the dated superseded-assignment note at the governor''s 20:49Z review-batch fix (hxs-3''s original 2026-08-13 gpt-oss/LightRAG target superseded by Meta-X tooling specialist, history preserved — tkv line 88, VERIFIED PRESENT this run [line-reference correction 2026-08-28 (batch-7 wave, labeled): the superseded-assignment note block moved — tkv :88 -> :98 CURRENT, repo :77 -> :92 CURRENT (the row-59 amendment''s header + addressing-note lines; live-verified 2026-08-28T02:4xZ)]; matching the repo copy''s line 77 [-> 92 CURRENT, live-verified]). Hash chain: 8f0f3017… (2026-08-25 ingestion) → 24053689… (touch-up wave 2026-08-27T18:43Z) → caff7987… (this run).'
