  m8_resolution_20260826: 'RESOLVED IN FACT at M8 (addendum, 2026-08-26T0110Z run — phase3_tension preserved above as the historical record): hxs-1/configuration.md now exists at /opt/tkv-local/servers/hxs-1/configuration.md (server records contract Phase 2, companion to the M8 sign-off package) and is cataloged as DOC-tkv-hxs1-configuration — the TKV server records now reflect hxs-1''s configured state; first-ingestion flag F8 closed. Registry file itself verified undrifted this run (sha256 8f0f3017… match). STILL OPEN: F-REG-1/F7 row-wording refresh (''unreleased, slot reserved'' text and any Phase-2 status wording) is an owner-side registry amendment, pending — the registry row text, not the catalog, is what lags.'
  roster_advisory_20260827: 'OWNER ADVISORY of record (2026-08-27; provenance: hxs-2 state log row 58, 2026-08-27T16:20Z — ''Owner advisory: roster changes recorded; rick fleet pre-work commissioned''): (1) hxs-5 has REPLACED hxs-cp as the control plane — hxs-5 is EXCLUDED from rick''s pre-work list for now (it is the governor''s host in practice); (2) hxs-7 is REPLACED BY hxs-20 (provisioning in progress — no pre-work until ready); (3) hxs-21 is being provisioned to eventually replace the hxs-5 machine (out of scope until ready). Row 58''s own carry instruction: ''Registry + server records to carry these with provenance (owner advisory) in the next records wave; anything rick''s pre-work contradicts in older records gets flagged, never silently rewritten.'' CATALOG-LANE HANDLING (this run): SERVER-REGISTRY.md is owner-maintained — the registry rows themselves are NOT amended by the catalog lane (server records contract: automation must not populate manual role assignments; the file''s own ownership stands with the owner). The advisory is therefore recorded HERE with provenance and FLAGGED for the governor for the owner''s next registry amendment: the affected registry text is the ''hxs-cp control plane deliberately outside the fleet'' note (hxs-cp replaced by hxs-5), the hxs-5/hxs-7 rows (role succession), and the absence of hxs-20/hxs-21 rows (both provisioning — no server records exist for them yet; their records catalog when their first artifacts land). Per-host advisory notes carried on DOC-tkv-hxs5-discovery, DOC-tkv-hxs5-pre-work-results, DOC-tkv-hxs7-discovery, DOC-tkv-hxs7-pre-work-results, DOC-tkv-hxscp-pre-work-results this run. Registry file hash UNCHANGED this run (8f0f3017… == live at run start; re-verified at close) — no registry drift; the advisory arrived via the state log, not the registry.'
  f_reg_1_row60_disposition: 'MID-RUN ROW-60 DISPOSITION (provenance: hxs-2 state log row 60, 2026-08-27T17:05Z — owner dispositions ×3, landed mid-run during the prework-registry run): F-REG-1 FIXED by the governor on the owner''s explicit directive (''fix it'') — in the REPO copy servers/SERVER-REGISTRY.md: the hxs-3 workload field now reads the commissioned reality (Meta-X tooling specialist — Muse Glimmer 30B hx-muse-glimmer-64k production ACTIVE 2026-08-27, primary tool agent for the RAG pipeline one-call-per-turn contract), replacing the stale 2026-08-13 gpt-oss/LightRAG target text (open correction with owner-directive provenance). THIS record''s source — the TKV copy /opt/tkv-local/servers/SERVER-REGISTRY.md — is UNCHANGED (hash 8f0f3017… re-verified == live at the close; mtime 2026-08-17) and now CARRIES THE STALE hxs-3 workload text (''gpt-oss-20b TP=2; LightRAG graph & retrieval'', VERIFIED PRESENT at tkv line 40 this run) relative to the fixed repo copy (tkv line 40 vs repo line 53). CROSS-COPY DRIFT FLAGGED for the governor: the tkv registry amendment is the owner''s lane (owner-maintained file; the catalog never edits a source). Terminology precision: the row-60 ''F-REG-1'' names the stale-workload class (hxs-3); this record''s own F-REG-1 thread (hxs-1 ''unreleased, slot reserved'' wording, per the governs note + m8_resolution above) is a separate wording item — re-verify BOTH copies'' row texts at the next records wave. The REPO registry copy has NO catalog record — mint candidate flagged for the next wave.'
  amendment_20260827: 'TKV COPY AMENDED by the governor 2026-08-27T17:48Z (mtime 17:48:43Z; OmniRoute pilot state log row 38 — the prework-registry receipt''s F-4/F-5 flags FIXED in both copies): the hxs-5 role row now reads Control plane (replaced hxs-cp per owner advisory 2026-08-27) / HX factory control plane (Kimi-K3 governor host) (line 42, VERIFIED PRESENT), the hxs-7 row is marked REPLACED BY hxs-20 (provisioning, no pre-work until ready) (line 44, VERIFIED PRESENT), the hxs-cp historical note is amended (hxs-5 replaced hxs-cp; hxs-21 provisioning to eventually replace the hxs-5 machine — lines 83-85, VERIFIED PRESENT), and the F-REG-1 hxs-3 workload line reads the commissioned Meta-X reality (tkv line 40 == repo line 53, VERIFIED at the M2-handoff wave [line-reference correction 2026-08-28 (batch-7 wave, labeled): the repo side moved — 53 (that era) -> 55 (batch-11 exception note; the dispatch''s governor-verified number) -> 57 (row-59 amendment state) -> 59 CURRENT (the row-59 amendment''s own +2 header lines postdate that check; live-verified 2026-08-28T02:4xZ); the TKV line 40 is UNCHANGED and matches the dispatch]). RESOLUTIONS recorded openly: the roster_advisory_20260827 carry flag (rows to carry the advisory at the owner''s next amendment) is RESOLVED IN FACT — the rows carry it; the f_reg_1_row60_disposition cross-copy drift flag (tkv line 40 then-stale vs repo line 53) is RESOLVED IN FACT — both copies agree; receipt 2026-08-27T1834Z-carol-m2-handoff.md F-1 (this record hash-stale) is RESOLVED by this re-hash (touch-up wave, dispatched at OmniRoute log row 41); the repo copy''s mint (DOC-server-registry, source of truth with this copy as mirror) landed at the M2-handoff wave — the ''NO catalog record'' sentence above is likewise closed. All three flag texts preserved above as the historical record. Hash chain: 8f0f3017… (2026-08-25 ingestion; re-verified == live at 2026-08-27T17:14Z) → 24053689… (this re-hash 2026-08-27T18:43Z — the 17:48Z amendment