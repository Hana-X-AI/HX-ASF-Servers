  declared_purpose: 'Current program boundary: Layer 0 and Layer 1 are COMPLETE by owner acceptance on 2026-08-28; Layer 2 remains unauthorized and frozen. The source remains the corrected Layer-0 re-issue (schema_version 1.1.0, manifest_id hx-omniroute-layer0-control, prepared 2026-08-27T10:45Z, status active) of the OmniRoute v3.8.51 implementation control manifest, superseding candidate manifest codex_20260826_1548 v1.0.0 (443 lines, preserved unchanged at /home/hxsa/opt/local-tkv/agent-zero-docs/pilots/omniroute/plan/). Corrections per the reconciliation register: DeepSeek Harness removed (never existed, KDD-0006); knowledge_root /opt/tkv-local/omniroute rejected (canonical catalog + verified corpus path); host-firewall controls removed (owner rule — LAN boundary + service authN/authZ); roster-true roles (Cipher/Independent QA mapped to the verifier contract); OD-01 decided hxs-8; OD-02 ratified Trinity active; OD-13 added (secrets-at-rest, owner-ratified 2026-08-27). Content: source_identity (OmniRoute v3.8.51, branch release/v3.8.51, commit 42a13fedef8bb6806c1c4382b2c65539e871e88c, identity_state VERIFIED — content-sensitive proof 13,098/13,098 git-blob identical, upstream head c9f11d86b55d past snapshot documented; local_path /opt/tkv-local/OmniRoute-release-v3.8.51 READ-ONLY; MIT; node_engine >=22.22.2 <23 || >=24.0.0 <27; pre_lts_characterization_baseline); hx_authority (Agent Zero human authority; KK3 logical orchestrator + execution substrate; OmniRoute bounded traffic plane — never orchestrator or knowledge authority; trinity omniroute_steward owner-ratified KDD-0008 O1; carol knowledge_steward — the catalog the only knowledge authority; Coder-X execution_backend — per-task identity/health verification, stop-and-escalate, no substitution, no cloud; Qwen-X independent_verifier — ACTIVE M8-signed, producer host != verifier host always; seven forbidden_authority_transfer rules incl. no host firewalls, no cloud/remote inference, no second knowledge authority