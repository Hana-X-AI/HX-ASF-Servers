document:
  id: "DOC-meta-model-api-sdks"
  title: "sdk.md — Meta Model API 'SDKs and libraries' (OpenAI SDK + Anthropic SDK; upstream capture, agent-zero-docs/pilots/hxs-3/meta/)"
  type: "runbook"
  declared_purpose: "Meta's official SDK doc (front matter: title 'SDKs and libraries', description 'Use the OpenAI SDK (Python or TypeScript) or the Anthropic SDK with Meta Model API. No custom client required.', cms alias /model-api/docs/sdks): Meta Model API works with the OpenAI SDK and the Anthropic SDK — no custom client to learn; any OpenAI-compatible SDK, HTTP client, or framework (LangChain, LlamaIndex, Vercel AI SDK) works too. Point the OpenAI SDK at base URL https://api.meta.ai/v1 for Responses (client.responses.create()) and Chat Completions (client.chat.completions.create()); point the Anthropic SDK at base host https://api.meta.ai for the Messages format (the SDK appends /v1/messages; Model API key passed as bearer/auth_token). Supported features through the OpenAI SDK: Responses API, chat completions, search grounding (via Responses), image understanding (vision), video and audio understanding (Responses + Chat Completions), structured output (response_format), function calling / tool use, file uploads (client.files.create()), streaming, temperature and sampling parameters, model selection. Worked examples in Python and TypeScript for both SDKs (pip install openai / npm install openai; model 'muse-spark-1.1'). Authentication nuance: the OpenAI SDK looks for OPENAI_API_KEY by default, NOT MODEL_API_KEY — pass the Model API key explicitly when creating the client."
  inferred_value: "INFERENCE: the client-surface reference for any HX harness that speaks to Meta-format endpoints — the explicit-key nuance (OPENAI_API_KEY default vs MODEL_API_KEY) and the base-url-vs-base-host distinction are exactly the class of wiring mistakes the hxs-3 harness work can avoid up front; for the LOCAL Ollama artifact the OpenAI-SDK shapes carry over (Ollama's OpenAI-compatible surface) while the hosted-only features (files, grounding) do not — an M5/M6 probe question, not an assumption."
