  declared_purpose: "Milestone completion evidence for WO-HXS3-RICK-M1-001 (session rick-m1-20260826-01, window 2026-08-26T04:58:32Z→05:04:24Z host clock UTC, owner plan approval 2026-08-26 state log seq 1): hxs-3's OS plane is proven ready for the Muse Glimmer tooling backend — 13 defined, 13 executed, 13 PASS, 0 FAIL/BLOCKED/NOT RUN; no probe retries, no corrections (the hxs-2 dpkg-query escaping lesson pre-applied). Exactly two mutations: (a) systemctl mask of suspend/hibernate/hybrid-sleep/suspend-then-hibernate targets — the EXACT blueprint set (hybrid-sleep IS in; the hxs-2 variant NOT used; sleep.target deliberately untouched), 3-view verified (/dev/null symlinks ×4); (b) rfkill soft block of the Wi-Fi device — rfkill1 = phy0/wlp5s0 at PCI 0000:05:00.0 (MAC 58:91:cf:e7:53:74 matches discovery), no routes/sessions proven FIRST (state DOWN, 0 IPs, 0 routes, netplan no wifi stanza, NetworkManager inactive), block via sysfs state file (rfkill binary ABSENT on hxs-3 — second host confirmed, F-03), state=0 soft=1 held across an independent second session; systemd-rfkill persistence proven — the block event triggered the service, save file /var/lib/systemd/rfkill/pci-0000:05:00.0:wlan re-created with content '1' (= soft-blocked; encoding confirmed by the untouched bluetooth control pair, F-04); boot-persistence proven by mechanism + saved state, not by an observed reboot (R-01 accepted-by-design). Driver/DKMS re-proof: 580.173.02 + CUDA 13.0, both PNY RTX 5060 Ti bound nvidia, DKMS built for the running 7.0.0-30 AND 7.0.0-28; zero NVRM Xid across 8 retained boots; AER = benign capability lines only; 0 failed units; wait-online SUCCESS; root ext4 3.4 T free (1 %) — D1 headroom for the ~18 GB artifact trivial; Secure Boot disabled untouched; NO FIREWALL verified absent on all three managers (ufw inactive, nftables empty, iptables zero rules, firewalld not installed — nothing created); listeners :22 + loopback stub DNS only. Regression + independent-second-session proo