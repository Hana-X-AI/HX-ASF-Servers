  findings_register: "F-01 (drift, resolved): kernel 7.0.0-28 → 7.0.0-30 since as-found; host rebooted 2026-08-25 16:23 UTC (same outage window class as hxs-1/hxs-2/hxs-5); driver stack live-proven on -30, DKMS built for -30 and -28. F-02 (note): DKMS not built for 7.0.0-29 (superseded intermediate image; matters only if -29 ever manually booted). F-03 (mechanism): rfkill binary ABSENT on hxs-3 (second host confirmed after hxs-2) — the sysfs state file is the block/unblock mechanism. F-04 (confirmed semantics): systemd-rfkill save file stores the kernel soft flag (1 = blocked), confirmed by the bluetooth control pair; service ran 13 times across the journal. F-05 (D-record): TOFU host-key pin — no prior known_hosts pin for 192.168.50.202 existed on hxs-5; first connection accept-new per the owner-authorized work order, identity corroborated vs discovery machine-id/MAC/IP; ED25519 fingerprint SHA256:R/3mdfv7J0Fajo8yryT7JB6B4EoBm47W2rLX+siHEog recorded in evidence §2 (public by design) — future hxs-3 tasks pin StrictHostKeyChecking=yes; a mismatch must halt the session. F-06 (observation): wpa_supplicant enabled+active with no configured network; rendered moot by the rfkill block; RECOMMENDATION (not executed): formal disablement under a future authorized service change. F-07 (record-only): routine package upgrades pending; no installs authorized. F-08 (drift, record-only): timezone Etc/UTC → America/Panama (EST, -0500) since discovery; clock synchronized, NTP active, RTC in UTC — hxs-3 evidence timestamps are EST/-05:00 (governor-verified, state log row 5: 'record in evidence rules'); discovery superseded on this point. F-09 (record-only): stale rfkill save file /var/lib/systemd/rfkill/pci-0000:04:00.0:wlan (content 0, dated 2026-08-12) — no device at that PCI address; harmless leftover, untouched."
