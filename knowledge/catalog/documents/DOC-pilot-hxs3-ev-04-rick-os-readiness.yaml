  source_correction: "OPEN CORRECTION in the source (2026-08-26, post-signature, governor review finding — corrected openly with provenance inline, per the server records contract; mtime 05:49:59Z): the §11 sanitization paragraph originally retained a credential-derived value_len metric; it was REMOVED from the evidence (masked-value metrics of the secret do not belong in retained evidence even without the value; it was also inaccurate), and the §11 'no hashes' claim was refined to 'no secrets, secret-derived hashes, tokens, or user data' — distinguishing the intentionally retained PUBLIC SSH host-key fingerprint (by design non-secret, not credential-derived) from secret-derived hashes. Remaining content unchanged. This record's findings_register and declared_purpose are unaffected (they never carried the metric); the sanitization_disclosure note above reflects the corrected text. Hash chain: 0f0cab7a… (first ingestion pass 2026-08-26T05:28Z) → f2f77c4d… (corrected source, re-hashed at close 06:02Z)."
