  id: "DOC-goal-hxs6-storage-provisioning"
  title: "Goal 2026-08-28-hxs6-storage-provisioning — hxs-6 additional-storage provisioning (owner disposition 2026-08-27 #4: reformat the additional drive and make it available, verify-first non-negotiable ordering; DRAFT-held at writing, then EXECUTED COMPLETE — GO row 2, discard ruling + dual gate row 4, phase 2 PASS row 5)"
  type: "goal"
  declared_purpose: "Durable work-state record (Goal ID = the file name 2026-08-28-hxs6-storage-provisioning, KDD-0002; version 1; status line at writing: 'DRAFT — held for owner GO (prepared per the owner's consolidated direction \"prepare a separately controlled storage operation\"; NOT dispatched)'; owner Agent-Zero; created 2026-08-28; agent lanes kimi-k3 (governor), rick (executor), carol (catalog)). Intent: owner disposition 2026-08-27 #4 — the additional drive in hxs-6 is EXPECTED; reformat it and make it available for storage or another approved use; the trigger evidence is rick's baseline wave (2026-08-27), which found a second NVMe (nvme1n1) plus an LVM ubuntu-vg/ubuntu-lv that the 2026-08-13 discovery never recorded. Non-negotiable ordering (the owner's own words): before ANY destructive operation, verify the exact target device and confirm it contains no data that must be retained; the ubuntu-vg name is the Ubuntu installer's default — the verification must PROVE the live root filesystem does not depend on that LVM before anything is wiped. Acceptance: (1) device-map evidence published and reviewed (governor gate) showing zero retainable data; (2) final state recorded — filesystem, mount point, ownership, intended use; (3) the hxs-6 registry + TKV records updated and Carol catalogs. Boundaries: destructive class; a governor gate between verification and execution; no other host, device, or partition in scope; no Docker; the local-model rule for the executor. EXECUTION RECORD (the goal's own completion, appended at cataloging with the goal file unchanged at 'DRAFT — held for owner GO' — see notes.status_mapping): the owner GO landed 2026-08-28T05:36Z (pilot state-log row 2 — 'hxs-6 disk wipe: have Rick do it now.'); phase 1 executed read-only with verdict RETAINABLE-DATA-FOUND (row 3 — the target disk carries a complete FOREIGN lived-in Ubuntu system, not the expected empty drive; the operation STOPPED and escalated per the WO); the owner ruled on the inventory 'Discard — wipe it now' 2026-08-28 (retain/archive foreclosed) and the governor approved the device map — the dual gate satisfied at row 4 (the acceptance item-1 gate did its designed job: it produced the owner's explicit retain/discard decision on evidence); phase 2 executed 06:10-06:15Z with dual identity revalidation PASS (row 5) — final state ext4 hxs-6-data (UUID c9241770-…) mounted at /srv/data live, verified 06:15:24Z (acceptance item 2 met); the registry + TKV records carry the new storage cell (acceptance item 3 — Carol catalogs THIS wave). The goal is COMPLETE at the pilot's row-5 arc close."
  inferred_value: "INFERENCE: the smallest possible destructive-class goal and the clearest demonstration of why the verify-first ordering is non-negotiable — the goal's own acceptance gate ('device-map evidence showing zero retainable data') produced the one answer the operation did not expect (a foreign lived-in system), and the goal's design absorbed it cleanly: STOP, escalate, owner decides, dual-gate release, identity-anchored execution. The goal file staying at 'DRAFT — held for owner GO' through execution is itself the recorded evidence that the GO was a deliberate, later owner act (row 2), not a formality."
