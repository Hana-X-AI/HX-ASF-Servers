notes:
  findings_register: "F-01 (drift, resolved): kernel 7.0.0-28 -> 7.0.0-30 since as-found; host rebooted 2026-08-25 15:09:55Z (site power-outage window, cf. hxs-1 log row 47); driver stack live-proven on -30, DKMS built for -30 and -28. F-02 (note): DKMS not built for 7.0.0-29 (superseded intermediate image; matters only if -29 ever manually booted). F-03 (mechanism): rfkill binary absent on hxs-2 — sysfs state file is the block/unblock mechanism. F-04 (proven semantics): systemd-rfkill save file stores the kernel soft flag (1=blocked), bluetooth control pair proof. F-05 (D-record): TOFU host-key pin — no prior known_hosts pin for 192.168.50.201 existed on hxs-5; first connection accept-new per the owner-authorized work order, identity corroborated vs discovery machine-id/UUID/MAC; ED25519 fingerprint SHA256:b2qlMQz496nUbuZKJu3wwmR0QY/EmN0KQtW4rM2HDcQ recorded in evidence §2 (public by design) — future hxs-2 tasks pin StrictHostKeyChecking=yes; a mismatch must halt the session. F-06 (observation): wpa_supplicant enabled+active with no configured network; rendered moot by the rfkill block; RECOMMENDATION (not executed): formal disablement under a future authorized service change. F-07 (record-only): routine package upgrades pending; no installs authorized."
  sanitization_disclosure: "§12 (profile §11 honesty): one mis-scoped local sed mask printed the credential ONCE into the operator session transcript during credential-file shape verification on hxs-5 — never written to any file, evidence artifact, or the deliverable; contained. Catalog handling per profile §6: no secret value is quoted or stored anywhere in the catalog. Governor records this as the third transcript-class exposure (hxs-2 state log row 4, incl. F-M5-1 + 0600 extractions); rotation recommendation is pending with the owner OUTSIDE the catalog lane."
  voided_element: "The §8 staged ufw ruleset (document-only, never applied) is VOID per the owner no-host-firewall rule 2026-08-26 (hxs-2 state log row 5): hxs-2's M8 endpoint binds to the LAN with the /24 itself as the boundary; blueprint §5 governs. Recorded element-level; the evidence document stands."
  mask_set_divergence: "hxs-2 authorized set masked sleep.target and left hybrid-sleep.target static; the hxs-1 proven set is the inverse on those two members (hxs-2 state log row 6). Alignment (add hybrid-sleep.target on hxs-2) queued to rick's next hxs-2 session; not a readiness blocker."
  second_brain: "In-file evaluation: hxs-1 OS-readiness pattern, second validated use; TKV server records as controlling sources from day one; disposition implemented — checklist, staged designs, and the F-04 persistence semantics become catalog content at handoff (this record)."
