  title: "HX Second Brain Information Guidance and Implementation Framework (hx-second-brain-guidance-001, v1.0.0-draft)"
  type: "other"
  declared_purpose: "Converts the four principles observed by Nate B. Jones across community Second Brain builds into an HX-specific strategy, agent operating guide, onboarding framework, reusable pattern system, tool evaluation rubric, and phased implementation plan. Central decision stated by the document: HX should build a small, tool-neutral knowledge loop first (capture, preserve, classify, connect, retrieve, act, receipt, improve), designing every artifact so agents can maintain, extend, and reuse it later. Declares two decisions required: confirm canonical knowledge root (recommended /opt/tkv-local) and ratify the pilot corpus and first capture interface."
  inferred_value: "INFERENCE: directional blueprint the owner has chosen to retain as context. The live catalog at knowledge/catalog/ already implements its core loop (Carol, records, relations, receipts, CAT-001 golden questions, retrieval packages); treat the document as an alignment reference for future Second Brain work, NOT as tasking. Its Section 5 roadmap, pattern library, tool rubric, and Phase/always-on expansions are unratified proposals."
