document:
  id: "DOC-goal-omniroute-layer1-secure-core"
  title: "Goal 2026-08-27-omniroute-layer1-secure-core — OmniRoute Layer 1 secure core gateway on hxs-8 (native, owner-authorized OD-12; all four backends OD-08 amended; OD-13 secrets; LAN-only OD-07; local-model-only; the Layer-1 gate)"
  type: "goal"
  declared_purpose: "Goal Contract for OmniRoute Layer 1 (Goal ID = file name, KDD-0002; version 1; status in-progress — M0 authorized 2026-08-27, OD-12 owner-authorized + OD-03 readiness acknowledged; owner Agent Zero; lanes kimi-k3 governor, trinity, rick, john, carol; parent program goals/2026-08-27-omniroute-trinity-layer0.md COMPLETE + the Layer-0 control manifest): install and qualify OmniRoute v3.8.51 on hxs-8 as the HX governed model-traffic plane — pinned runtime, encrypted-secrets deployment (OD-13), all four HX backends registered behind it with routing confirmed (OD-08 amended), LAN-only exposure with OmniRoute's own authN/authZ (OD-07), health and backup/rollback proven; native systemd service — never Docker (owner rule, 2026-08-27). Owner parameters (ratified 2026-08-27): OD-04 native Node systemd service, never Docker (runner-cli flavor BLOCKED, compose paths void); OD-08 AMENDED — register ALL FOUR HX backends (Qwen-X hxs-1, Coder-X hxs-2, Meta-X hxs-3, Chat-X hxs-4) behind the gateway from the start, routing confirmation across all four a first-class acceptance test (supersedes the governor's Qwen-X-first recommendation); OD-13 env-provision JWT_SECRET + API_KEY_SECRET (generated locally, provisioned via the service environment, never product defaults) AND set STORAGE_ENCRYPTION_KEY (activates the AES-256-GCM field encryption — the product ships plaintext-passthrough without it); OD-07 LAN bind only (192.168.50.0/24), management endpoints behind OmniRoute's own authN/authZ (its proven proxy.ts pipeline), NO host firewall (owner rule), O1 monitoring tripwire stands; local-model-only everywhere (no cloud providers, no cloud agent features; agent-like surfaces MCP/A2A/ACP/Conductor/copilot/tunnels/cloud agents stay disabled/blocked per the ledger register; skills execution and background jobs get explicit deployment settings — the ledger's not-code-enforced finding); OD-09 backup — plaintext SQLite snapshots to a managed directory plus our own encryption if required (the product's backup encryption is write-only and its cloud upload a dead endpoint, CAP-P8-905/906 — never rely on either). Layer-1 gate (7 acceptance criteria): (1) runtime within engines, systemd service up after reboot with no human action, native; (2) secrets — no plaintext secrets anywhere in the service environment or database (OD-13 verified: env-provisioned values + STORAGE_ENCRYPTION_KEY active, connection-row fields encrypted); (3) routing — all four backends registered with identity evidence + direct-vs-routed parity (known-answer task per backend, response-shape comparison, usage accounting visible); (4) health — the layered health surface answers with the documented auth split; (5) backup/rollback — a snapshot restores to a working state, rollback a documented rehearsed inverse; (6) restart — two service restarts + one cold reboot return to ready with four-backend routing intact; (7) no cloud models, no :cloud tags anywhere (O1 tripwire), no agent-like surfaces enabled. Out of scope: Layer 2+ (route combos, strategy characterization, quotas/budgets/sessions), Layer 3 (intelligence/memory/modalities), Layer 4 (agent/ecosystem surfaces), any Docker/container work, any host other than hxs-8, any cloud provider. AMENDMENTS 2026-08-27 (owner-pasted review batch, OmniRoute state log row 44 fixes 4+5 — matching the deployed L1-M2 reality): OD-08 — Chat-X on hxs-4 is loopback-only by standing security posture; its registration STANDS and its parity check is POSTURE-BLOCKED (an approved posture exception, NOT a failed acceptance test) unless the owner explicitly authorizes a scoped exposure change for hxs-4; all other backends carry full parity requirements; scope of the exception: hxs-8's view of hxs-4 only. OD-13 — approved injection mechanism + prohibited locations: values generated on-host and injected ONLY via a root-only 0640 systemd drop-in, recorded by sha256 never value; PROHIBITED at rest — repository files, world-readable unit files, logs/journals/receipts/artifacts, and the database (secrets namespace must hold 0 plaintext rows; connection fields must be enc:v1: ciphertext); ALLOWED — plaintext in process memory and the service's own runtime environment (inherent to env injection, not a violation); gate criterion 2 reworded to match (source lines 23-24 + 32, VERIFIED PRESENT this run)."
  inferred_value: "INFERENCE: the authorization boundary and acceptance contract for the first mutating work on hxs-8 — it converts the Layer-0 gate's 7 carried conditions plus the owner's row-32 parameter rulings into one gate-checkable document, so every L1 work order (rick's runtime, Trinity's install, the L1-M3 gate) traces its authority and its done-state here."
