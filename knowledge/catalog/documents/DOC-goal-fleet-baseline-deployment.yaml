  title: Goal 2026-08-27-fleet-baseline-deployment — COMPLETE 2026-08-28; 12/12 in-scope hosts reconciled under the two sanctioned mutation classes
  type: goal
  declared_purpose: 'Durable work-state record (Goal ID = file name, KDD-0002; date 2026-08-27; owner directive ''complete the baseline platform deployment'' — GO same day; governor Kimi-K3; executor rick; owner SEQUENCING per OmniRoute pilot state log row 43: this goal FIRST, OmniRoute L1-M3 closure follows its completion). Objective: bring every in-scope fleet host to the declared baseline — verified identity/OS, one timezone (Etc/UTC), one NTP source (time.cloudflare.com), the proven 4-target sleep-mask set, library selftest green — with per-host TKV records refreshed and evidence the owner can audit. Scope: FRESH (7) hxs-6, hxs-9, hxs-10, hxs-12, hxs-13, hxs-14, hxs-15 — full baseline pass (verify, pin, mask, selftest, records); RE-VERIFY (5) hxs-1, hxs-2, hxs-3, hxs-4, hxs-8 — confirm the proven posture holds, drift reported, fixed only within the two sanctioned classes; EXCLUDED — hxs-5 (control plane), hxs-7 (replaced by hxs-20), hxs-20/hxs-21 (provisioning), hxs-11 (owner flag unreachable); hxs-6 Secure Boot ENABLED — record only, owner decision pending (BIOS). Acceptance: (1) every in-scope host carries an evidence-backed verdict (PASS/REPORT/FAIL), REPORT names its closing direction; (2) NTP + mask post-apply re-checks green on every mutated host; (3) /opt/tkv-local/servers/<host>/pre-work-results.md refreshed per fresh host + evidence doc servers/2026-08-27-fleet-baseline-wave.md delivered; (4) zero secret values in any artifact + the catalog wave (Carol) closes the handoff with validate.py 4/4. Boundaries: two sanctioned mutation classes ONLY (NTP pin, sleep-mask align); everything else read-only; any other need stops and escalates to the governor; the local-model rule applies to the executor; no git commits without owner approval per instance.'
  inferred_value: 'INFERENCE: the goal converts the fleet''s ratified posture rules (one timezone, one NTP source, proven mask set, no host firewalls) from per-pilot outcomes into a single acceptance-testable fleet state — and its owner sequencing makes it the gate in front of OmniRoute L1-M3, so the fleet''s baseline truth is proven before the gateway''s closure gate is allowed to run.'
