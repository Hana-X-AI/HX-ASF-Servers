  declared_purpose: "Delegated contract commissioning john / Esme (session john-m5-hxs2-20260826-01) for hxs-2 milestone M5 — functional validation: execute the owner-ratified M5 quality suites against Coder-X's frozen operating profile (hx-qwen3.6-coderx-64k, digest ec9ebe08a824…, ctx 65536, resident Forever) and deliver pass/fail evidence per suite so the M8 sign-off gate has quality grounds (a suite failure is reported, never tuned away). Owner authorizations (owner 2026-08-26, thresholds RATIFIED): coding >=90% passing + mandatory evaluator review (specialist bar; Qwen-X generalist scored 90-100% on the same versioned set — read every solution in full, concur or dissent per task, no hardcoded-answer gaming); tool protocol 100% forbidden/malformed denied AND >=95% schema conformance on valid calls (duplicate-mutation executed exactly once; loop terminates); vision probes evidence-only, NO pass bar (bounded <=6 probes, deterministic synthetic images on-host, owner D8-vision deferral stands); Phase A native sampling, thinking ON, no overrides, no num_predict caps — the acceptance configuration, same as hxs-1 M5/M5b. NOT authorized: baseline changes (drop-in, Modelfile, aliases, units, model store), sampling changes, reboots, recovery drills (M8 scope), endpoint/firewall changes, other models. Boundaries: hxs-5 session, SSH hxsa@192.168.50.201, askpass helper READS the credential from the HX Fleet SSH Access Guide credential-record row at execution time (no extracted copy, helper deleted at task end), hostname + peer IP verified first, sudo -n only, host key pinned (F-05); versioned fixtures only (pilots/PILOT-HX1-OLLAMA-QWEN27B-001/fixtures/ — coding_suite.py, tool_suite.py, fixtures_corpus.py; alias-parameterized with hx-qwen3.6-coderx-64k passed explicitly; copied to /tmp on hxs-2, run on-host against 127.0.0.1:11434; sha256sums.txt verified before use); thinking content never persisted in evidence (counts only), sanitization per profile; one bounded correction p