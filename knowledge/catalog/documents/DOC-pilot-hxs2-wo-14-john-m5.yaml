  inferred_value: "INFERENCE: this is the quality gate that converts Coder-X from a capacity-proven profile into an M8-signable backend — the owner-ratified specialist bar (coding >=90% on the versioned deterministic 10-task v1.0.0 set with human-style evaluator review) plus the zero-forbidden-execution tool-protocol audit give the M8 gate measured grounds, and the evidence-only vision probes bank the D8 deferral decision material without blocking the milestone."
