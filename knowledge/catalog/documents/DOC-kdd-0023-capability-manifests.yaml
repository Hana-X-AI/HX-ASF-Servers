document:
  id: DOC-kdd-0023-capability-manifests
  title: KDD-0023 — Declare capabilities, then verify them (O5 hook manifest + SY-5; O7 skill registry + SY-6)
  type: decision
  declared_purpose: 'Ratified decision (2026-08-30) applying the declare-then-verify shape of KDD-0021 to two capability classes that were declared in prose and verified by nobody. D1: governace/hooks/manifest.yaml declares every hook — event, matcher, advisory-vs-enforcing, shim requirement, min_timeout, sha256 — plus the payload shim''s digest (a broken shim turns all five advisory hooks into silent no-ops without touching any hook) and the content AND digest of secret-boundary.mode, the five-byte file that decides whether the one enforcing hook can block. D2: scripts/hooks_verify.py checks both registration scopes asymmetrically — .claude/settings.json is in Git and its absence is a hard failure, because deleting it unregisters every hook at once; ~/.kimi-code/config.toml is user scope and its absence is reported, never failed, since CI has no such file and must not claim it verified user-scope state. D3: registration is verified structurally, not by substring — a hook path echoed or passed as data is not a hook that runs. D4: the user config holds live provider credentials beside its [[hooks]] blocks, so the parser is a deliberately narrow line scanner and two tests assert no credential can reach any output. D5: AGENTS.md remains the single authority for skill owners and trigger words; skills_registry.py reads and reconciles them rather than duplicating them into frontmatter — this OVERRIDES the source review''s O7 wording, because a second copy of a ratified inventory is a second authority plane. Frontmatter carries only maturity, required_files and smoke. D6: a skill shipping something runnable must smoke it or record why not. D7: enforced as SY-5 and SY-6 inside governance-path; the check count stays 5/5, and smokes run as their own CI step because they execute skill commands. Mechanizes KDD-0020 Amendment 2 item 1, which that amendment left explicitly unmechanized.'
