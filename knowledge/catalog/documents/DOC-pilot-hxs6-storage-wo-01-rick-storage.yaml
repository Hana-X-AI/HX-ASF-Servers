document:
  id: "DOC-pilot-hxs6-storage-wo-01-rick-storage"
  title: "01-work-order-rick-storage.yaml — WO-01-hxs6-storage (hxs-6 additional-storage provisioning, DESTRUCTIVE CLASS: phase-1 read-only verification with complete-topology + exclusive-LVM + stable-identity requirements, the dual gate (owner GO + governor device-map approval), the gated destructive phase, records phase; DISCHARGED — all phases COMPLETE, pilot state log rows 1-5; deliverable DOC-hxs6-storage-device-map-2026-08-28)"
  type: "work-order"
  declared_purpose: "Delegated contract commissioning rick (agents/rick/charter.md + agents/rick/profile.md read FIRST) for hxs-6 additional-storage provisioning (WO-01-hxs6-storage; pilot pilots/PILOT-HXS6-STORAGE-001; goal 00-goal.md; session rick-hxs6-storage-<date>-01 assigned at dispatch; target hxs-6 (192.168.50.205); priority normal — no downstream blocker; prepared DRAFT — held for owner GO per owner disposition 2026-08-27 #4). Controlling sources: owner disposition 2026-08-27 #4 (reformat and make available; verify-first ordering); servers/2026-08-27-fleet-baseline-wave.md (rick's REPORT: nvme1n1 + LVM ubuntu-vg/ubuntu-lv found, not in the 08-13 discovery); servers/SERVER-REGISTRY.md hxs-6 row; /opt/tkv-local/servers/hxs-6/ records. phase_1_verification_read_only: identity (hostname, peer IP, machine-id vs servers/hxs-6/discovery.md); the device map (lsblk -o NAME,SIZE,TYPE,FSTYPE,LABEL,UUID,MOUNTPOINT,SERIAL,WWN; nvme list; nvme id-ctrl on the target disk — serial + wwn recorded verbatim as the STABLE IDENTITY; blkid; pvs/vgs/lvs -o +devices; findmnt / and /boot and /boot/efi; swapon --show); the COMPLETE TARGET-DISK TOPOLOGY requirement (enumerate EVERY partition, PV, VG, LV, filesystem, and mountpoint on the target disk before any erase — any partition, PV, VG, filesystem, or signature not accounted for in the evidence doc = STOP, escalate); the PROVE clause (the active root filesystem AND every mounted/boot-critical source (/, /boot, /boot/efi, active swap) are NOT on the target disk or any child partition of it — findmnt source devices must map outside the target; it is not enough that / is not ubuntu-vg/ubuntu-lv — / could be a plain partition on the target disk; any boot-critical source on the target = STOP, escalate); the signatures scan on the target disk (partition table, filesystems, LVM metadata; any user data — read-only scan: file count, top-level names, newest mtime — NO content reads beyond directory listing); the EXCLUSIVE LVM TOPOLOGY PROOF (required before any erase: vgs/lvs/pvs output must show (a) ubuntu-vg contains ONLY ubuntu-lv — no other logical volumes; (b) every extent of ubuntu-vg maps to the target-disk PV and no other PV (pvs -o pv_name,vg_name,pv_size + lvs -o lv_name,vg_name,devices + pvdisplay -m); (c) the exact PV path intended for pvremove recorded verbatim TOGETHER WITH the disk's stable serial/WWN from nvme id-ctrl — kernel names like /dev/nvme1n1 are NOT stable across re-enumeration; the stable identity is the anchor, the path is its current alias; any extra LV, any extent on another PV, or any ambiguity = STOP, escalate); the verdict: RETAINABLE-DATA-FOUND (stop, escalate) or CLEAR-TO-REFORMAT; the evidence doc servers/hxs-6/2026-08-28-storage-device-map.md carrying the complete topology + stable serial/WWN identity. governor_gate: two recorded approvals are REQUIRED before phase 2 is released, both appended to the pilot state log: (1) the OWNER's explicit GO for the destructive phase (owner disposition 2026-08-27 #4 authorizes the operation's preparation and intent; it is NOT by itself the release), and (2) the GOVERNOR's approval after reviewing rick's phase-1 device map against the two proofs (root-not-on-LVM; zero retainable data); the state-log entry releasing phase 2 must cite BOTH — the owner's GO (timestamp + words) and the governor's gate approval (device-map evidence reference); without both, phase 2 stays locked. phase_2_execution_gated: IDENTITY REVALIDATION immediately before any destructive command (kernel names are not stable — the phase-1 path may now alias a different device: re-read nvme id-ctrl on the current path and lsblk -o SERIAL,WWN; the live serial/WWN must MATCH the phase-1 recorded stable identity; any mismatch = ABORT, record fresh evidence, escalate; the destructive commands use ONLY the path whose live stable identity was just matched, never the stale phase-1 path); deactivate and remove the stale LVM stack (lvchange -an ubuntu-vg; lvremove ubuntu-vg/ubuntu-lv; vgremove ubuntu-vg; pvremove <the identity-validated PV path> — passed explicitly, never a glob or assumed path — ONLY after the phase-1 proof, the dual gate, and a PASSING identity revalidation recorded in the same state-log entry; the release entry cites the exclusive LVM topology evidence + the serial/WWN match alongside the owner GO and governor approval); wipe signatures on the target disk (wipefs -a on the identity-validated path — only after the LVM stack is fully removed, the device map re-verified, and the serial/WWN identity re-matched a second time); new GPT + single partition; mkfs.ext4 -L hxs-6-data; mount point /srv/data (0755, hxsa:hxsa); fstab by UUID with nofail,noatime; mount; write/verify/remove a probe file; record final state (filesystem, mount point, ownership, intended use — 'bulk storage for approved use, TBD by owner'). phase_3_records: servers/hxs-6/configuration.md created (second of its class pattern) or the device-map doc updated with final state; the registry + TKV hxs-6 storage cell updated (append-only, dated); the pilot state-log rows; Carol catalogs. boundaries: read_only_except phase 2, and only after the governor gate; secrets: the askpass pattern, no value in artifacts; failure: a phase-1 anomaly → stop + escalate, never guess; a phase-2 failure mid-way → stop, capture state, escalate (no retry loops on destructive steps); model: local only, no cloud. EXECUTION RECORD (all phases COMPLETE at cataloging — the WO is minted DISCHARGED per the wo-07 variant): the owner GO landed 2026-08-28T05:36Z (state-log row 2); phase 1 executed read-only 05:39-05:52Z with verdict RETAINABLE-DATA-FOUND (row 3 — a complete FOREIGN lived-in Ubuntu system, not the expected empty drive; the operation STOPPED and escalated; zero mutations); the owner ruled 'Discard — wipe it now' and the governor approved the device map — the dual gate satisfied at row 4 (06:07Z); phase 2 executed 06:10-06:15Z with identity revalidations R1 PASS and R2 MATCH (row 5 — incl. the disclosed guard defect, a false ABORT from untrimmed sysfs padding with NO destructive command following it) and zero failures/retries; final state ext4 hxs-6-data @ /srv/data live, verified 06:15:24Z; the records phase completed with servers/hxs-6/configuration.md created, both registry cells updated, and Carol's catalog wave (THIS wave)."
  inferred_value: "INFERENCE: the destructive-class contract in its purest form — every clause of this WO exists because a wrong assumption is fatal and cheap to test, and the WO's own execution proved the point: the 'expected empty drive' was a foreign lived-in system, and the contract's complete-topology requirement is what made that discovery inevitable rather than accidental. The three-layer safety design (complete topology accounting before any erase; the dual recorded approvals (owner GO + governor device-map approval) between verification and destruction; the stable-identity revalidation immediately before every destructive command, with kernel names explicitly distrusted) is the reusable template for any future destructive fleet operation — and the nvme-cli-absent deviation (sysfs as the identical-data substitute, flagged rather than silently substituted) plus the disclosed guard defect (a false ABORT that stopped nothing because no destructive command may follow a guard failure) show the contract failing safe twice in one pilot."
