  title: "11-work-order-john-websearch.yaml — WO-FLEET-JOHN-WS-001 (fleet change: enable Ollama Cloud web search on all four hosts — NO_CLOUD removal; DISCHARGED — complete)"
  type: "work-order"
  declared_purpose: "Delegated contract commissioning john / Esme (session john-ws-20260826-01) for the fleet change 'Enable Ollama Cloud web search on all four hosts' (owner decision 2026-08-26): remove OLLAMA_NO_CLOUD=1 from each host's ollama.service drop-in (versioned one-line change per host), daemon-reload, restart ollama.service ONLY, and re-verify: frozen model identity and residency byte-identical pre/post on hxs-1 (hx-qwen3.8-27b-64k), hxs-2 (hx-qwen3.6-coderx), hxs-3 (hx-muse-glimmer); model list intact on hxs-4 (qwen3.5:9b-q4_K_M); reachability (loopback on all four; LAN from hxs-5 on hxs-1/2/3); journal clean, zero Xid, NRestarts accounted. Enable nothing else: no cloud models, no remote inference, no endpoint changes, no firewall. Confirm the agent web-search flag OLLAMA_AGENT_DISABLE_WEBSEARCH is unset (agent web search allowed). Document for the owner the remaining interactive step: per-host ollama signin (URL flow, his ollama.com account) — web search activates after sign-in; verify and report the pre-signin availability state per host. Owner authorizations: owner decision 2026-08-26 'Enable Ollama Cloud web search' on all four hosts (hxs-3 log row 12; hxs-1 log row 78) — supersedes the ratified NO_CLOUD posture for the web-search class; explicitly NOT authorized: pulling or running any :cloud model, remote inference, endpoint/firewall changes, reboots, any other service changes. Boundaries: hxs-5 session, per host via SSH hxsa@<ip> (192.168.50.200/201/202/203); askpass helper READS the credential from the HX Fleet SSH Access Guide credential-record row at execution time (no extracted copy, helper deleted at task end); hostname + peer IP verified per host; sudo -n only; host keys pinned (hxs-1 known; hxs-2/3 F-05; hxs-4 TOFU-with-corroboration if unpinned); frozen-identity guard per host (any drift = stop and restore that host's drop-in); versioned change (pre/post sha256 + unified diff in evidence); one bounded correction per failed host; stop conditions: service fails to return, identity drift, any Xid. Rollback: restore the OLLAMA_NO_CLOUD=1 line per host drop-in (byte-copies retained in evidence), daemon-reload, service restart. Deliverable: 13-esme-websearch-enable.md. Second Brain evaluation: opportunity identified — uniform bounded fleet change (four hosts, one shape) with identity guards (the SC-07a pattern generalized); disposition implemented."
  inferred_value: "INFERENCE: this is the fleet's first four-host posture change executed as one bounded contract — its real content is the guard discipline (per-host quiescence gates against three parallel ladder sessions, byte-copies before every edit, identity guards pre/post within its own windows), which is what lets a posture supersession land while three ladders were mutating the same hosts' configs."
