  type: "contract"
  declared_purpose: "Owner's corrected mission directive (2026-08-26): retarget the mission to hxs-2 (NOT hxs-1) and provision it as a persistent local coding-inference host using Ollama, with the deployed model registered as an approved backend resource within DeepSeek Harness rather than directly with KK3. Names target model mannix/qwen3.6-27b-a3b-coder:vision-Q4_K_M; six required outcomes (persistent Ollama service; authorized network endpoint reachable from the Harness workspace; Harness backend registration as coding + vision-capable inference; discoverable by the Harness resource/capability layer; available to KK3 and authorized Harness workflows without a direct model-specific KK3 integration; subordinate to Harness governance); architectural boundary (the model is an inference backend, never an autonomous sub-agent; no direct KK3-to-Ollama dependency bypassing the Harness; required chain hxs-2 → Ollama → model → Harness backend registry → authorized presets/workflows → KK3-controlled assignment); 12-item Definition of Done (exact model installed; persistent managed service; persistence policy residency; endpoint reachable from the Harness environment and not beyond the authorized HX boundary; Harness recognizes host/endpoint/identity/capabilities; preset invocation; KK3 discovery and task assignment through the Harness; other authorized workflow use; restart + host-reboot recovery; health/identity/inference/coding/vision/resource tests; final handoff with configuration, evidence, risks, ownership, rollback); KK3 authority clause (KK3 retains complete ownership of planning, decomposition, worker selection, delegation, context routing, task assignment, evidence gates, retry decisions, workflow state — the directive provisions and registers infrastructure only)."
  inferred_value: "INFERENCE: the mission source the goal implements — but two of its premises are resolved elsewhere with higher authority: (1) the DeepSeek Harness registration substrate is verified nonexistent (owner-confirmed easter egg 2026-08-26, KDD-0006; the goal re-scoped the DoD Harness-free per owner D7 with the catalog filling the registry role); (2) its literal …-coder: tag is the sibling checkpoint, deliberately not selected (owner D3 selected CoderX by live registry evidence). The document is preserved unchanged; consumers must read it together with KDD-0006 and the goal file."
