inues): completion, vision, tools, thinking all PRESENT in the frozen artifact; tool calling — the primary mission (RENDERER/PARSER glimmer with the ATEM tool parser PRESENT, source-verified; M6 contract suite); thinking/reasoning controls EXPERIMENTAL (reasoning_strength low/medium/high/xhigh — mapping probes at M5, owner D8 default deferred to M5 evidence); CLIP vision projector 'Muse Glimmer Hf' 1.92B Q4_K_M present (vision qualification at M5/M6). REGISTERED LIMIT: parallel_tool_calling: false — one-call-per-turn, sequential (KDD-0007, first-class capability LIMIT: the model proposes at most one tool call per turn and never authorizes or executes; parallel tooling lives above the model in KK3's orchestration plane, never as a claimed model capability; the harness enforces the limit at two levels (KDD-0007 as amended 2026-08-26, review finding): a model response containing more than one tool call is REJECTED, and accepted calls execute serially with results returned before the next selection; the request-level parallel_tool_calls flag is strictly a compatibility probe (M5/M6), never enforcement). Limits: serialized admission per blueprint (NUM_PARALLEL=1). Runtime profile: ctx 65536 EFFECTIVE per D5 + M7 (operating profile hx-muse-glimmer-64k frozen 2026-08-26 @ 9dffb015db40…, resident 18,376,336,340 B 100% VRAM, Forever; the alias Modelfile num_ctx is the effective contract — /api/ps context_length is the proof — with hx3.conf OLLAMA_CONTEXT_LENGTH=65536 operator-consistency); the pre-ladder ctx 32768 was the Ollama VRAM-based default (NOT baked — F-J2). Owner: Agent-Zero. Status CANDIDATE until the hxs-3 M8 sign-off."
