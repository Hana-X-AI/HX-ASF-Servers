  limit_enforcement_amendment: "MID-RUN AMENDMENT re-validated this run (2026-08-26T06:15Z; governor edit 05:48:44Z, 'Enforcement contract (2026-08-26, review finding)'): the intent section now states the harness enforces the one-call-per-turn limit at two levels — a model response containing more than one tool call is rejected, accepted calls execute serially with results returned before the next selection — and the request-level parallel_tool_calls: false flag is treated strictly as a compatibility probe, never enforcement; the SC-05 row carries the same ENFORCEMENT wording ('invariant proven with ENFORCEMENT…'). The LIMIT registration itself and D1–D8 are unchanged. Hash chain: 0ce2da45… (M0 ingestion 05:05Z) → 31cf8cb6… (this re-validation). Matching KDD-0007 amendment re-validated in DOC-kdd-0007-hxs3-muse-glimmer-tooling-adoption; the Meta-X capability record (DOC-backend-meta-x) carries the amended semantics."
