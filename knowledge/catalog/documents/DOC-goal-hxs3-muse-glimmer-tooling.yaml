  title: "Goal 2026-08-26-hxs3-muse-glimmer-tooling — provision the hxs-3 tooling-inference backend (Muse Glimmer 30B via Ollama, mutating pilot)"
  type: "goal"
  declared_purpose: "Durable work-state record (Goal ID = file name, KDD-0002): intent (provision hxs-3 as a persistent local tooling-inference backend with the exact Ollama artifact muse-glimmer:30b — official library tag, ~18 GB, LM 27.9B Q4_K_M + 1.92B CLIP projector, Apache-2.0 — qualified end to end, exposed fleet-scoped (LAN, no host firewall — owner rule), and registered in the Second Brain catalog as the discoverable capability of record: the factory's primary tool agent for the RAG pipeline, a sequential one-tool-call-per-turn specialist — parallel tooling happens above the model in KK3's orchestration plane, never as a claimed model capability; the model proposes at most one tool call per turn and never authorizes or executes; KK3 retains orchestration, acceptance, and evidence), scope and target (hxs-3 192.168.50.202, registry role Agent intelligence; baseline from records — M1 re-verifies: i7-5960X 8c/16t, 66 GB RAM, 2x RTX 5060 Ti 16,311 MiB, driver 580.173.02 validated 2026-08-12, Ubuntu 24.04.4, NVMe root, no Ollama, Secure Boot disabled; in scope incl. OS readiness per the blueprint mask set, Ollama install/pin, exact-tag pull + FULL identity freeze (LM + projector digests, manifest, template/renderer, license), native Phase A baseline, system-policy preservation, prompt/reasoning compatibility + reasoning_strength mapping probes, tool contract suite + one-call-per-turn invariant + ATEM normalization gate, multimodal probes, context ladder 32K/64K/128K, persistence + reboot recovery, scoped endpoint + boundary proof, catalog registration, consumer-proof task; out of scope: DeepSeek Harness (verified nonexistent), a llama.cpp serving plane UNLESS the M4/M5 compatibility gate fires the drafted escape hatch, parallel tool calling (registered limit parallel_tool_calling: false), gpt-oss changes (retained as task-shaped control), LightRAG integration (consumer unbuilt), exposure beyond the LAN), owner decisions D1-D8 (D1 model store root ext4; D2 fleet 192.168.50.0/24 + no host firewall; D3 muse-glimmer:30b exact — manifest prefix de878ce33ad8 cross-check only, local full digest = frozen identity at M4; D4 Wi-Fi rfkill soft block boot-persisted; D5 operating context 65,536 (64K), ladder validates 32K/64K/128K first; D6 M8 cold reboots pre-approved per-cycle; D7 registration to the Second Brain catalog (Harness-free, KDD-0006 convention); D8 operating reasoning_strength default deferred to M5 mapping evidence — reasoning cannot be disabled, recorded; all ratified via plan approval), success conditions SC-01..SC-08 with evidence contracts and KK3 gates (SC-08 registration + process verified by Agent-Zero), execution controls (1 initial specialist run + 1 bounded correction per failed correctable gate; stop conditions incl. Ollama-Muse incompatibility with the drafted llama.cpp escape hatch; smallest-layer rollback; HITL checkpoints M0/Gate 0/each cold reboot/threshold confirmations/final sign-off; commits only with per-instance owner approval — Alert 2), notes and links. Status in file: in-progress — M0 authorized 2026-08-26 (plan approved; D-items ratified; M1 commissioned). Plan: session plan patriot-miles-morales-us-agent.md (approved 2026-08-26 — referenced, not supplied, not cataloged); authoritative source pilot v1.1 (Harness-free mapping per KDD-0006 convention)."
