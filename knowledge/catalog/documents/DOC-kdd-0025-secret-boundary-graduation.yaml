document:
  id: DOC-kdd-0025-secret-boundary-graduation
  title: KDD-0025 — Secret-boundary graduation evidence; the warn→block flip stays an owner decision (O6)
  type: decision
  declared_purpose: 'Ratified evidence record (2026-08-30) for O6, the secret-boundary warn->block graduation authorized by owner decision UD4 on 2026-08-25 and never exercised because the regression suite it depends on did not exist. Establishes: (F1) the hook and validate.py were written separately and disagreed on four of five rules, with validate.py the broader AND the already-blocking one, which is why all three recorded false positives came from it; (F2) the hook''s sanitizing-word allowance was nearly dead code because it filtered the grep -Eo matched fragment rather than the line, so a reference to the ratified askpass mechanism was a hit; (F3) the corpus cannot be stored in plain text without tripping the scanners it tests, so cases are base64 with plain-language descriptions and a test asserts the corpus file itself yields zero hits. Decisions: the 14-case corpus at governace/secret-boundary-corpus.yaml is the contract; both implementations run against it in CI including a parity assertion; a password value counts only if it carries a digit or punctuation or is at least 16 characters, with the allowance tested against the whole line; safety proven by a repo-wide differential over 1384 files in which the narrowing loses exactly two hits, both comments inside the scanners describing the false-positive class, with zero hits remaining. THE FLIP IS NOT TAKEN — secret-boundary.mode still reads warn and a test asserts it; the decision delivers the evidence UD4 asked for without consuming the authorization, because graduation lets one hook halt a write mid-session and that is an owner decision made against evidence. Recommendation recorded: flip after one more week of warn with the corpus green in CI. Governance cost of record: two false positives forced append-only records to be edited in place (DSH state-log row 5, PILOT-OMNIROUTE-LAYER0-001 row 40), and row 5 states the original cannot be restored because it would re-trip the scanner.'
