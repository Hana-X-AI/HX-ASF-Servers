  type: "plan"
  declared_purpose: "Owner-updated authoritative pilot document (front matter: document_id doc:hx:pilot:hxs-3:muse-glimmer-30b, version 1.1, created 2026-08-25, updated 2026-08-26, status 'owner-selected primary tooling candidate; implementation and qualification pending', decision statement 'Begin the hxs-3 tooling pilot with Ollama muse-glimmer:30b' — authority Agent Zero, effective 2026-08-25; purpose 'Install, qualify, persist, and register Muse Glimmer 30B as a local tool-use inference capability available to KK3 through the DeepSeek Harness'; scope host hxs-3, environment development-staging, runtime Ollama, role general-agentic-tooling-specialist, orchestration authority KK3). Executive verdict (§1): Muse Glimmer 30B is the strongest current candidate for the HX general tooling specialist role — explicitly trained for long-horizon agentic task completion, schema-based tool use, failure recovery, multimodal input, scaffold compatibility; four facts must remain visible: 'runs on a single GPU' is conditional (Meta targets 24 GB; the ~18 GB package cannot fit a 16 GB GPU with runtime/KV), the model is dense (~29.6B participate), Muse is a sequential tool caller (one tool call per model turn, no parallel calls — a binding capability limit, not an evaluation question), and the model proposes actions but never authorizes or executes them (KK3 sole orchestrator). Content: mission + Definition of Done (§2); source/artifact record with the official prompting and inference contract table (§3 — chat template, system-prompt-first, private reasoning turn, reasoning_strength low/medium/high/xhigh default high, native ATEM tool format, one-call-per-turn, image sentinel, long-reasoning headroom, history accounting, native sampler T=1/top-k=64/top-p=0.95, EOS never <|eom|>; llama.cpp support from commit 62bf73d25 / release b10353 = diagnostic compatibility floors, not a second serving plane); HX placement and binding authority rules (§4); target-host qualification with all facts [TO BE CONFIRMED] (§5); implementation phases 0-10 (§6 — change control/baseline, pull + identity, HX pilot alias hx/muse-glimmer-30b:hxs3-pilot-20260825, native Phase A baseline + prompt/reasoning compatibility, system-policy preservation canary, tool contract suite A-F incl. the Ollama ATEM parser-normalization gate, multimodal suite, failure recovery/loop control, 32K/64K/128K context ladder, GPU/performance strategy, persistence/reboot recovery); DeepSeek Harness registration semantic contract + lifecycle (§7); comparative role boundaries (§8); monitoring + redacted replay envelope (§9); risk register MG-001..MG-018 (§10); rollback/quarantine (§11); deliverables by agent (§12); acceptance checklist (§13); final recommendation (§14 — proceed with muse-glimmer:30b, gates in order: host capacity/artifact identity, system policy/authorization, tool contracts/failure recovery); references + verification gaps (§15)."
  inferred_value: "INFERENCE: the pilot's controlling plan and measurement basis — the goal names it the authoritative source pilot, and its phases/gates map onto the goal's SC-01..SC-08 evidence contracts and milestone structure. Its Harness-era framing (§7 registration contract, front-matter 'registered_in system:deepseek-harness', 'Neo' owner rows, §2.3 'Neo registers the backend') describes a substrate verified nonexistent (KDD-0006; mapping restated in KDD-0007): the registration intent maps onto the Second Brain catalog capability record, and the Neo role is covered by KK3 + john/Esme. All performance/capability claims remain vendor-reported until proven on the exact local digest (§3.3: use the scores to justify the pilot, never as the HX acceptance report)."
