  type: "work-order"
  declared_purpose: "Delegated contract commissioning john / Esme (session john-m7-20260826-01) for hxs-3 milestone M7 — run the hxs-1-shaped capacity ladder on Meta-X's exact frozen artifact (de878ce33ad8…): BEFORE creating any rung, verify that hx-muse-glimmer:latest references the expected frozen digest and frozen layers (ollama show + manifest-layer comparison — the governor's pre-execution FROM-verification amendment, review batch 11), then create rung Modelfiles with FROM set to that alias (or the complete local blob path from ollama show --modelfile — resolvable either way, never a bare digest), num_ctx the ONLY changed parameter, model/projector/template/parser/baked parameters otherwise preserved (32768 current VRAM-default baseline, 65536 operating per D5, 131072 extended — the artifact's own max context); prove each rung (resident 100% VRAM, per-GPU split, KV growth f16 measured linear, needle at ~95% depth found with done_reason=stop, D8-quality spot flat vs baseline, no OOM/CPU fallback/Xid, link speed under load captured); then freeze the three aliases hx-muse-glimmer-32k / -64k / -128k with per-rung digest equality, repoint preload + drop-in to hx-muse-glimmer-64k, re-prove residency (ctx 65536 effective, Forever), and leave the source tag and both other aliases in-store (tags only). Owner authorizations: owner 2026-08-26 'complete each ladder and profile entries so they appear the same way hxs-1's did — identical pattern, same blueprint'; D5 ratified (operating context 65,536 after the ladder — ladder validates 32K then 64K then 128K on the exact digest); NOT authorized: sampling changes, context beyond 131072, other models, reboots, model-store deletions, endpoint changes, a second serving plane. Boundaries: hxs-5 session, SSH hxsa@192.168.50.202, askpass helper READS the credential from the HX Fleet SSH Access Guide credential-record row at execution time (no extracted copy, helper deleted at task end), hostname + peer IP verified first, sudo -n only, host key pinned (F-05); identity guard — every rung Modelfile starts FROM the frozen digest artifact with num_ctx the ONLY changed parameter, baked params otherwise preserved (temperature 1, top_k 64, top_p 0.95), the embedded Muse template never modified; fixtures versioned needle_probe.py (alias-parameterized — rung alias + required model arg), copied to the target /tmp and run locally on hxs-3 against 127.0.0.1:11434; dense-model VRAM watch (17.8 GB weights + 1.92B projector + KV — measured per rung); stop conditions OOM, unapproved CPU fallback, any Xid, needle miss at 32K or 64K (128K miss = extended-fail, fall back to two profiles and report — do not force it). Rollback: preload + drop-in repointed back to hx-muse-glimmer (one-line versioned edits), aliases removed via ollama rm (tags only), pre-state hashes recorded. Deliverable: 09-esme-m7-ladder-profiles.md (per-rung capacity + KV + needle + quality table, alias digests with equality proofs, repoint diffs + hashes, final residency proof at -64k, link-speed under load, sanitized command log, Task May Proceed receipt). Second Brain evaluation in-file (hxs-1 ladder/profile pattern — third validated use, uniformity claim on the dense model; disposition implemented — rung evidence and the three aliases become Meta-X's catalog context profile at handoff)."
  inferred_value: "INFERENCE: this is the capacity gate the D5 64K operating decision stands on — the dense ~29.6B model on x8-wired links is the blueprint's hardest capacity case so far, so its ladder numbers must be measured here and never transferred from another host; the pre-execution FROM-verification clause is the fleet's guardrail against rung-identity drift (no rung may silently rebind to a moved tag)."
