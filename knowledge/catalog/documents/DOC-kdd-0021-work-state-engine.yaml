  type: decision
  declared_purpose: "Ratified decision (2026-08-30) establishing a single machine-readable work-state block per goal (governace/goals/work-state.schema.yaml) and one engine that reads it (scripts/work_state.py), replacing prose-grep status derivation in the work-status and goal-decompose skills. Implements O1 of the Codex process-optimization review and the goal-decompose half of its F6. Records that conflicts between a goal file and downstream evidence are surfaced via a required reconcile field rather than auto-resolved, because declaring a goal complete is a governor determination. Enforced as validate.py sub-check SY-4; check count stays 5/5."
