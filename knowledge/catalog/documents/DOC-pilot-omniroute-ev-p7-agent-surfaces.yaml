  inferred_value: "INFERENCE: P7 is the partition that matters most to HX's own architecture — it maps every surface where OmniRoute's agent features would collide with the factory's control plane (KK3 orchestration, this catalog, owner authority), and its BLOCKED-by-owner-rules set is pre-adjudicated: those six entries are decided already, no Layer-1 debate needed."
