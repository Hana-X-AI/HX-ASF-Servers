  type: plan
  declared_purpose: Server implementation plan for replacing Meta-X (muse-glimmer:30b / hx-muse-glimmer-64k) with OAI-X (gpt-oss:20b) on hxs-3 via native Ollama. Covers registry availability check, digest/size recording, deterministic 64K-context feasibility probe (num_ctx 65536, stream false, prompt_eval_count >= TARGET_CTX), OIDC-free local lane, preload-pin ordering before any ollama rm, pre-deletion manifest+blob digest capture, and full rollback path. Executes the goal 2026-08-29-oai-x-replace-meta-x under the KDD-0013 lane model; Meta-X retained until all replacement gates pass (owner word required).
