  declared_purpose: "Delegated contract commissioning rick (agents/rick/charter.md + profile.md read FIRST) for milestone BASELINE-1 of goals/2026-08-27-fleet-baseline-deployment.md — commissioned 2026-08-27T19:40Z by governor Kimi-K3 on owner GO; session rick-fleet-baseline-20260827-01; priority high (owner sequencing: this wave gates OmniRoute L1-M3 closure). Controlling sources: scripts/fleet/fleet-standard.yaml (standards-as-data v0.1 — the declared expected state), scripts/fleet/README.md, servers/SERVER-REGISTRY.md (host truth), /opt/tkv-local/servers/<host>/ (per-host historical as-found evidence — cross-check, never current truth), servers/2026-08-26-fleet-time-and-mask-pass.md (the proven pattern + command-log shape). Hosts: fresh_7 hxs-6/hxs-9/hxs-10/hxs-12/hxs-13/hxs-14/hxs-15; reverify_5 hxs-1/hxs-2/hxs-3/hxs-4/hxs-8; excluded — hxs-5 (control plane, owner word), hxs-7 (replaced by hxs-20, provisioning), hxs-11 (owner flag unreachable — SKIP, do not probe repeatedly), hxs-20/hxs-21 (provisioning). Tasks per fresh host: identity + OS + kernel + uptime recorded against TKV discovery (drift = REPORT, both values kept); fleet-verify-baseline.sh; NTP check then fleet-ntp-pin.sh --apply where drifted (SANCTIONED MUTATION class 1 — mktemp staging, diff review, timesyncd restart only); sleep-target check then fleet-sleepmasks.sh align where drifted (SANCTIONED MUTATION class 2); fleet-selftest.sh green; refresh /opt/tkv-local/servers/<host>/pre-work-results.md (dated re-verification section, drift notes where found); hxs-6 ONLY — record Secure Boot state (expected ENABLED per owner flag — RECORD, never change; BIOS is an owner decision). Tasks per re-verify host: quick sweep — identity, NTP sync vs standard, mask state, selftest — confirm green; drift = REPORT (no mutation unless in a sanctioned class, then fix + record). Boundaries: read-only everything except the two sanctioned classes; stop-and-escalate on any other mutation need, any credential anomaly, or any host showing active production workload a restart could disturb (record + skip, verdict REPORT); secrets — askpass pattern from the credential record (awk on the SSH-password row), helper 0700 deleted at end, NO secret value in any artifact/log/receipt/model context, sudo -n where prepared else record; failure — per-host failure records FAIL/REPORT and CONTINUES the wave, systemic failure (library defect, auth failure on 2+ hosts) STOPS and escalates; transient_retry 1/1 per operation; model local only (Qwen-X), failure escalates, no cloud fallback. Deliverables: servers/2026-08-27-fleet-baseline-wave.md (evidence + per-host verdicts + full command log, shape of the 08-26 pass doc), refreshed TKV pre-work records per fresh host, pilot state-log rows for the governor handoff. Acceptance: every in-scope host carries a verdict (PASS / REPORT with declared direction / FAIL with evidence); both sanctioned mutation classes verified post-apply (re-check green); zero secret values in any artifact; handoff to the governor with a receipt-style summary."
  inferred_value: "INFERENCE: the first fleet-wide execution of the standards-as-data contract the library codified — the WO's two-sanctioned-classes boundary is exactly the library's mutation surface (ntp-pin + sleepmasks), so the wave doubles as the library's first production proving run beyond the five proven hosts; the per-host-failure-CONTINUES vs systemic-failure-STOP split is the reusable shape for fleet waves."
