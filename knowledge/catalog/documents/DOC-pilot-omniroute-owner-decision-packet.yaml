  title: "PILOT-OMNIROUTE-LAYER0-001 11-owner-decision-packet.md — owner decision packet (3 decided-for-record, 8 open Layer-1 decisions with recommendations, 2 later-layer, 7 deliberate non-decisions; Wave 0C)"
  type: "contract"
  declared_purpose: "The Wave-0C owner decision packet for the OmniRoute program (governor Kimi-K3 to Agent Zero, 2026-08-27; basis: goal-contract OD register, the 367-entry capability ledger, hxs-8 readiness, the week's governance evidence): every item carries the exact decision needed, the governor's recommendation, and what it blocks — 'Nothing here is decided for you.' DECIDED for the record (no action): OD-01 target host hxs-8 (owner selection; online; readiness evidence delivered); OD-02 Trinity ratification O1 adopt-as-corrected (active; her first commission produced the ledger); OD-13 secrets at rest RATIFIED 2026-08-27 — env-provision JWT_SECRET + API_KEY_SECRET and set STORAGE_ENCRYPTION_KEY at install, never accept defaults (the ledger proved plaintext-default persistence and a stale encrypted-store doc claim). OPEN — needed for Layer 1 (8): OD-03 acknowledge hxs-8 readiness evidence (04-rick-hxs8-readiness.md, SUITABLE-WITH-FINDINGS — memory resolved 32+16 GB both channels non-ECC, ports free, Node absent; blocks any host-dependent work); OD-04 deployment mode — recommendation native Node systemd service on hxs-8 (clean host, fewer moving parts; the runner-cli container flavor is BLOCKED, compose stays LAB-ONLY; blocks install shape); OD-05 FQDN + internal DNS — recommendation omniroute.hx.local.arpa via the fleet DNS, rick's plane at Layer 1 (blocks naming); OD-06 TLS termination — host TLS via a small reverse proxy or OmniRoute's own TLS, management and inference paths separated (P4 evidence shows the split exists; blocks transport security); OD-07 allowed clients/exposure — recommendation LAN bind only (192.168.50.0/24), management endpoints behind OmniRoute's own authN/authZ (the proven proxy.ts pipeline), no host firewall (owner rule), the O1 monitoring tripwire stands (blocks exposure); OD-08 initial backend(s) — recommendation exactly one local backend first: Qwen-X (ACTIVE, M8-signed, loopback-proven LAN health) — the Secure Core shape, Coder-X/Meta-X join at Layer 2 after their own M8s (blocks routing start); OD-09 backup/retention/RPO/RTO — plaintext SQLite snapshots to a managed dir + our own encryption if required (the product's backup encryption is write-only and its cloud upload a dead endpoint, CAP-P8-905/906; retention 20 snapshots matches its default; blocks data safety); OD-12 Layer 1 authorization — authorize after reviewing this packet + 18-independent-verification-report.md + the KK3 gate decision (blocks the install itself). OPEN — later layers (2): OD-10 Qdrant/memory disposition (Layer 3); OD-11 production-version policy (program-level — upgrade cadence from the pinned snapshot). DELIBERATE NON-DECISIONS recorded so they stay closed (7): no DeepSeek Harness anything (never existed, KDD-0006); no /opt/tkv-local/omniroute knowledge root (corpus + catalog stand); no host firewalls (the LAN plus OmniRoute authN/authZ is the boundary); no cloud models or remote inference anywhere in the program (local-model-first rule); no activation of OmniRoute agent-like surfaces (MCP/A2A/ACP/Conductor/copilot/tunnels/cloud agents — disabled-by-default, 8 BLOCKED entries, the copilot driver and Conductor hub the two highest-risk surfaces and stay off); no backup-encryption or cloud-upload reliance (proven nonfunctional); no ATEM routing assumption for Meta-X (no adapter exists)."
  inferred_value: "INFERENCE: the Layer-1 gate instrument — OD-12 is the only door to installation (the KK3 gate decision: 'Layer 0 completion does not authorize Layer 1'), so this packet is what the owner's word acts on; the recommendation column is governor recommendation, the decided column is owner record, and the seven non-decisions keep foreclosed options from being re-litigated."
