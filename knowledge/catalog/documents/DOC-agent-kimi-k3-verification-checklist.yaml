  triage_block_ratification: "T-micro pilot-1 re-validation (2026-08-26T02:01Z): drift traced to the governor's appended 'Triage after the gate (owner-ratified 2026-08-26, p7-lite)' section — verified present: the mandatory gate always runs first (triage never skips a step, reduces evidence, or changes acceptance); tier table 0 auto-approved / 1 deferred / 2 active review / 3 immediate escalation with item classes and handling; escalation triggers (accuracy < 95% for the task type, critical class security/governance/infrastructure/deployment, anomaly or partial evidence, novel task type, contradiction of approved state, incident-pattern correlation, producer-flagged uncertainty — any one moves the item to Tier 2/3); one triage line per state-log row (triage: tier=<0-3> status=<auto_approved|deferred|escalated|immediate> agent=<id> task=<type> score=<accuracy|n/a> flags=<list|none>), appended never a replacement; accuracy scores from knowledge/agent-performance.md; tier boundaries reviewed at every milestone close. Ratified by owner 2026-08-26 (governor Option A). Legitimate governor edit. Re-hashed b2cbbcb6… -> 8accdfad…. references edge to DOC-knowledge-agent-performance added this run (triage-line accuracy source). Declared_purpose unchanged — it describes the ten-step gate, which the triage block explicitly does not modify."
