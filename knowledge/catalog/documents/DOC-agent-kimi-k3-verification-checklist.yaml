document:
  id: "DOC-agent-kimi-k3-verification-checklist"
  title: "governace/process/governor-verification-checklist.md — governor evidence-verification checklist (receipt-check, ratified UD5/U7; relocated from agents/kimi-k3/ 2026-08-30)"
  type: "runbook"
  declared_purpose: "The governor's receipt-check for every producer deliverable (ratified 2026-08-25, owner decision UD5 approving U7 authoring; state log row 60), run BEFORE any acceptance is logged. A deliverable that fails any step goes back with one bounded correction or escalates per the approval discipline — never accepted around a failed step. Ten steps: (1) artifact exists, non-empty, at the work-order path, timestamped inside the session window; (2) receipt line present exactly once ('Task May Proceed: YES/NO' or the profile's PASS marker, producer's own completion language); (3) token context check — every FAIL/BLOCKED/NOT RUN token read in context (benign summaries acceptable; a real failure token stops acceptance); (4) secret sweep — grep -F the protected credential string plus generic patterns (PEM blocks, bearer tokens, password[:=] assignments), zero hits, no exceptions; (5) governor-artifact integrity — work order and context packet still hash to the state-log proof values; (6) claims vs live state — material current-state claims spot-verified read-only against the live target (the document is never sole evidence); (7) boundary conformance — mutation disclosure matches the work-order allowlist; (8) completeness — every evidence requirement from the context packet present; (9) honest limitations disclosed in the deliverable itself; (10) handoff rule — deliverable to Carol, handoff OPEN until her catalog receipt is cited in the state log, only then the acceptance row and goal-status update. Escalation: producer defect -> one bounded correction with the finding stated exactly; authority/safety/identity problem -> stop and escalate to the owner; repeated failure class -> lessons-learned entry plus a deterministic guard (test, check, or hook), not a memo."
  inferred_value: "INFERENCE: step 4's literal-credential grep -F is the governor-side manual gate that validate.py deliberately excludes — the checklist and the validator are complementary halves of the verification surface (judgment + literal sweep here; mechanized checks there)."
