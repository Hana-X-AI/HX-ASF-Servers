  declared_purpose: "Session-binding packet for the john/Esme M5 dispatch (goal binding GOAL-HXS2-CODERX-001 v1; work order WO-HXS2-JOHN-M5-001; role producer — Ollama specialist): objective — deliver Coder-X's quality evidence against the owner-ratified bars (coding >=90% + evaluator review on the versioned set; tool protocol 100% denied / >=95% conformance; vision evidence-only; API readiness re-proof) on the frozen operating profile hx-qwen3.6-coderx-64k. Current state: hxs-2 (192.168.50.201, Ubuntu 24.04.4, kernel 7.0.0-30, driver 580.173.02, Ollama 0.32.15); resident hx-qwen3.6-coderx-64k:latest (digest ec9ebe08a824…, 100% VRAM both 5060 Ti, ctx 65536 effective, Forever — verify live before first suite and at close); frozen artifact mannix/qwen3.6-27b-a3b-coderx:vision-Q4_K_M digest ca661423d6b51ebeaca999f22cfc0f30c0851b2a6f328b2737bd8cb6eb90c1df (26.2B MoE top-8/184, CLIP 446.57M F16 projector — the vision path under probe); aliases in store hx-qwen3.6-coderx (1d297a6a093f…), -32k (== bare alias digest), -64k (ec9ebe08a824…), -128k (86a55171dc03…) — use ONLY -64k for the suites; endpoint LAN-scoped OLLAMA_HOST=0.0.0.0, loopback preserved, no firewall (owner rule), web search ACTIVE (owner signin 2026-08-26 — irrelevant to these suites, do not exercise it); watch — F-M6-0 Xid-31 single-event defect class armed (ANY Xid = immediate stop + escalate; journal checks at close). Owner decisions: M5 thresholds ratified 2026-08-26 (coding >=90% specialist bar; tools 100%/>=95%; vision no-bar); Phase A native sampling always; a failure is a finding, not a re-roll. Constraints: only the M5 suites in scope (no ladder/profile/preload/config changes, no reboots, no recovery drills or security-boundary drills — M8, no other models); fixtures alias-parameterized, verified against sha256sums.txt before first use, run on-host in /tmp; thinking content never persisted (counts only); no secrets in artifacts; askpass discipline per the work order. Evidence requirements: coding per