  declared_purpose: "Delegated contract commissioning rick (session rick-m1-20260826-01) to verify hxs-2 is ready to host the CoderX backend: re-prove the driver/DKMS stack, execute the 13-point baseline checklist, stage (NOT enable) the ufw boundary ruleset for the D2 endpoint scope, formalize the Wi-Fi rfkill soft block per owner D4, and record the kernel/storage/Secure-Boot posture. Exactly two authorized mutations: the four sleep-target masks (sleep/suspend/hibernate/suspend-then-hibernate) and the rfkill soft block (with systemd-rfkill persistence check); everything else read-only. NOT authorized: ufw enablement or any firewall change (design only), package installs/upgrades, kernel changes, driver changes, service changes, reboots. Boundaries: hxs-5 session, SSH hxsa@192.168.50.201, askpass helper reads the credential-record table row at execution time (no extracted copy, helper deleted at task end), sudo -n only, password-failure = STOP, one bounded correction per failed correctable check, stop conditions (driver/GPU fault, unexpected exposure, any Xid, identity mismatch). Deliverable: 04-rick-hxs2-os-readiness.md (completed PASS — 13/13; cataloged this run). Second Brain evaluation recorded in-file (hxs-1 OS-readiness pattern, second validated use; disposition implemented)."
