document:
  id: "DOC-scripts-hooks"
  title: "scripts/hooks/ — Kimi Code hook script system (secret-boundary U5/UD4 pilot; validate-changed U3/UD3 advisory; README placement convention)"
  type: "runbook"
  declared_purpose: "Repo home of the factory's Kimi Code hook scripts (owner decisions UD3/UD4 2026-08-25, state log row 60; README is the placement convention answering assessment question Q-C). Convention: hook SCRIPTS live here, repo-versioned and reviewed like any code; hook REGISTRATIONS live in the user-scope ~/.kimi-code/config.toml [[hooks]] array — personal config, never committed, NOT repo content (external registration; see notes). Registered hooks: (1) secret-boundary.sh — PreToolUse, matcher Write|Edit|Bash, mode from secret-boundary.mode ('warn' for the pilot week, then 'block' after measured pilot and owner graduation); intercepts secret-shaped content before it lands in a file or command via THREE detection layers: generic credential patterns (PEM blocks, cloud/chat tokens, live-looking password assignments; explicit REDACTED/withheld allowance), the literal credential READ AT EXECUTION from the protected source's credential-record table row (awk; never printed, logged, stored, or copied — askpass discipline; unreadable file = layer skipped silently, fail-open), and protected-source copy-verb references (cat|cp|dd|tee|scp|rsync|tar + ssh-info.md — read-at-execution patterns awk/sed/grep/head explicitly allowed). (2) validate-changed.sh — PostToolUse, matcher Write|Edit, advisory only (exit 0 always): runs scripts/validate.py --changed <edited file> and surfaces failures into context with the reproduction command (the U3 pilot). Rules for every hook: repo-reviewed, stdlib/POSIX, no network, no host access, no sudo, no MCP; never reads protected credential files except the documented execution-time read in secret-boundary.sh; fail-open philosophy (hook errors must never break work — interception layers, not sole barriers); blocking (exit 2) only after a measured warn-mode pilot and owner graduation; the validation hook calls the single validator command — hooks never reimplement checks."
  inferred_value: "INFERENCE: layer 2 makes this the first pre-hoc consumer of the protected credential resource — it strengthens the boundary but, being fail-open by design, can never be cited as the sole barrier; CAT-05, the protected-resource convention, and owner attestation remain the secret boundary (carried forward from the O1 narrowed guarantee and the assessments-wave follow-up)."
