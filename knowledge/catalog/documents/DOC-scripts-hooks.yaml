document:
  id: DOC-scripts-hooks
  title: scripts/hooks/ — repo hook script system (6 registered hooks + payload shim; declared in governace/hooks/manifest.yaml, verified by validate.py SY-5)
  type: runbook
  declared_purpose: 'Repo home of the factory''s Kimi Code hook scripts (owner decisions UD3/UD4 2026-08-25, state log row 60; README is the placement convention answering assessment question Q-C). Convention: hook SCRIPTS live here, repo-versioned and reviewed like any code; hook REGISTRATIONS live in TWO scopes: .claude/settings.json (in Git, deterministic, verified in CI) and the user-scope ~/.kimi-code/config.toml [[hooks]] array (personal config, never committed). Both are now compared against a single declaration — governace/hooks/manifest.yaml, added 2026-08-30 (O5) — by scripts/hooks_verify.py, run as validate.py sub-check SY-5. The manifest declares per hook the event, matcher, advisory-vs-enforcing class, shim requirement, minimum timeout and sha256, plus the digest of claude-payload-shim.sh and the content AND digest of secret-boundary.mode (the enforcement switch, previously group-writable and ungoverned). Before SY-5 nothing compared any declaration to the live registrations, and three prose tables that claimed to list the hooks all disagreed. The in-Git scope failing to exist is a hard failure; the user scope is advisory because CI has no such file and must never claim it verified user-scope state. hooks_verify.py reads [[hooks]] entries ONLY from the user config, which also holds live provider credentials. Registered hooks: (1) secret-boundary.sh — PreToolUse, matcher Write|Edit|Bash, mode from secret-boundary.mode (''warn'' for the pilot week, then ''block'' after measured pilot and owner graduation); intercepts secret-shaped content before it lands in a file or command via THREE detection layers: generic credential patterns (PEM blocks, cloud/chat tokens, live-looking password assignments; explicit REDACTED/withheld allowance), the literal credential READ AT EXECUTION from the protected source''s credential-record table row (awk; never printed, logged, stored, or copied — askpass discipline; unreadable file = layer skipped silently, fail-open), and protected-source copy-verb references (cat|cp|dd|tee|scp|rsync|tar + ssh-info.md — read-at-execution patterns awk/sed/grep/head explicitly allowed). (2) validate-changed.sh — PostToolUse, matcher Write|Edit, advisory only (exit 0 always): runs scripts/validate.py --changed <edited file> and surfaces failures into context with the reproduction command (the U3 pilot). Rules for every hook: repo-reviewed, stdlib/POSIX, no network, no host access, no sudo, no MCP; never reads protected credential files except the documented execution-time read in secret-boundary.sh; fail-open philosophy (hook errors must never break work — interception layers, not sole barriers); blocking (exit 2) only after a measured warn-mode pilot and owner graduation; the validation hook calls the single validator command — hooks never reimplement checks. FULL REGISTERED SET (6, reconciled 2026-08-30 against .claude/settings.json and the manifest): secret-boundary.sh (PreToolUse Write|Edit|Bash — the ONLY enforcing hook, exit 2 when the mode file reads ''block''; never shimmed, it greps the raw payload); and five advisory PostToolUse Write|Edit hooks that always exit 0 — validate-changed.sh, agent-creation-check.sh, render-sync.sh, test-log-append.sh, governor-gate.sh. claude-payload-shim.sh is NOT a hook: it is a payload translator the Claude registrations wrap the five advisory hooks in, because Claude Code sends tool_input.file_path where the hooks read the Kimi key ''path'' — unshimmed they match nothing and exit 0, a silent no-op. Its digest is governed in the manifest for that reason: a broken shim disables all five without touching any hook.'
  inferred_value: 'INFERENCE: layer 2 makes this the first pre-hoc consumer of the protected credential resource — it strengthens the boundary but, being fail-open by design, can never be cited as the sole barrier; CAT-05, the protected-resource convention, and owner attestation remain the secret boundary (carried forward from the O1 narrowed guarantee and the assessments-wave follow-up).'
