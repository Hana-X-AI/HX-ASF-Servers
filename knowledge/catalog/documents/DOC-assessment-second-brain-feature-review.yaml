  title: '2026-08-27-second-brain-feature-review.md — Second Brain feature review: assessed-continuously answer, 12 implemented feature-classes, deferred register, gap dispositions, cadence recommendation (Kimi-K3, owner-question review)'
  type: evidence
  declared_purpose: 'Owner-question review (2026-08-27 UTC, author Kimi-K3 governor; the owner''s three questions: ''Were Second Brain features/capabilities assessed for this run? Outcome? How many have we actually implemented to date?''; method: every line carries a live checkable pointer — file, record, or receipt; counting rule: a feature counts as implemented only if live in production with evidence — ratified-but-not-built does not count; truth-state FACT live evidence / AUTHORITY ratified decisions / INFERENCE labeled). §1 answer: assessed CONTINUOUSLY on three tracks — (1) the formal assessments (2026-08-25 capability read-only O1–O10, unified capability recommendations U1–U7 with UD decisions, hx-second-brain-guidance-001 review, KDD-0005 canonical split: Second Brain lives in this repo, /opt/tkv-local is source corpus); (2) the standing directive''s mandatory 4-point evaluation, present in 73 artifacts across the repo (counted 2026-08-27), baked into pilots/_templates/; (3) per-decision gates (KDD-0006 through KDD-0008, the goal contracts). §2 outcome: 12 feature-classes IMPLEMENTED and live — canonical catalog core (254 records at writing, validator 4/4 PASS), standing directive, catalog schema + steward profile (U1), catalog validator (U2, 4 checks + --ci portable mode), local validation hooks (U3/U5 pilots -> live, shellcheck-clean, CI-gated), verification checklist + triage tiers (U7), p7-lite agent-performance ledger, Carol run-tier system (T-micro/T-standard/T-full + carry-forward window + ratified bundle calibration), dual-format wiki publishing (Q2, 42 documents rendered, --check drift gate), backend-capability records (the KDD-0006 capability-registry role), adoption-gate pattern (Trinity: candidate -> reconciliation -> charter/profile/KDD -> owner ratification -> catalog -> roster; KDD-0008, validated reusable), fleet standards-as-data (scripts/fleet/ fleet-standard.yaml + fleet-verify-baseline.sh, landed 2026-08-27, formally evaluated in §4); the CI/CD pipeline''s review-and-gate machinery recorded separately as a defensible thirteenth Second Brain-class capability, not folded into the 12. §3 deferred register — none silently dropped: CI run receipts -> catalog evidence (revisit after a month of run history, docs/cicd-pipeline.md §Second Brain), executable custom agents .kimi-code/agents/ (phase-transition KDD required), Ollama MCP server (ratified loopback-era posture; the OmniRoute program is the traffic-plane gate), memory/Qdrant-side features (OD-10, OmniRoute Layer 3 territory), the unified doc''s deferred-capability list (carried, untouched). §4 gap dispositions closed by this review: the fleet library''s after-the-fact 4-point evaluation (opportunity yes — standards-as-data verification is a Second Brain pattern; capability catalog-adjacent verification evidence; disposition IMPLEMENTED, hxs-2 log row 47, matrix green on 5 hosts; reasoning: converts repeated admin judgment into declared checkable data, the same pattern class as validate.py), the CI-receipts deferral lifted from pipeline-doc-only into the review-level register, and this artifact established as the single place answering ''what''s implemented''. §5 cadence recommendation (for owner ratification or amendment): refresh this review''s implemented count and deferred register at every milestone close and every feature-wave close in one pass (the pattern the catalog''s living-document rule already uses) — cost minutes per milestone, the answer always one file deep. §6 provenance: the three 2026-08-25 assessments, KDD-0005/0006/0008, 73 evaluated artifacts (grep count 2026-08-27), the week''s state logs (hxs-1/hxs-2/hxs-3/OmniRoute pilots), live catalog state (254 records, validator 4/4); no secrets, all pointers checkable.'
  inferred_value: 'INFERENCE: this artifact is the natural refresh target for the catalog''s own living-document pattern — if the owner ratifies the §5 cadence, each refresh changes this record''s hash on a predictable trigger (milestone/feature-wave close), making it the cheapest freshness signal in the assessment class; the 12-class count is defensible under the printed counting rule, and whether the CI/CD pipeline machinery counts as a thirteenth class is an owner framing call, not a catalog one.'
