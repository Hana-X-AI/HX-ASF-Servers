  declared_purpose: "Rick's execution evidence for commission rick-fleet-baseline-20260828-01 (governor Kimi-K3 session commission on owner word 2026-08-28 — 'hxs-11, hxs-20 and hxs-21 are online and ready for Rick'; same scope as servers/2026-08-27-fleet-baseline-wave.md — FULL baseline; OmniRoute state log row 54 dispatch): targets hxs-11 .210 (returned from maintenance), hxs-20 (NEW, replaces hxs-7's role) live .220, hxs-21 (NEW, provisioning to eventually replace the hxs-5 machine) live .21; executor hxs-5; window 2026-08-28T01:09Z–01:23Z; result PASS — TASK COMPLETE (3/3 hosts carry verdicts: 1 PASS, 2 REPORT with declared closing directions, 0 FAIL). §1 knowledge review receipt (refs-ubuntu-24.04 noble-pinned set; TWO contradictions resolved with evidence, both values kept: (a) the WO's IPs for hxs-20/hxs-21 (.219/.220 per the 199+N pattern) vs live (.220/.21) — the owner-supplied discovery addresses proven real; (b) the WO's 'all three hosts absent from fleet-standard.yaml host_classes' — hxs-11 IS present (server-default since the 08-27 amendment); only hxs-20/hxs-21 are absent (F-2); Task May Proceed YES; local-model-first: not model-required, deterministic fleet administration, no cloud contact). §2 authority + ADDRESSING RESOLUTION — the fleet .199+N pattern does NOT hold: .219 no ping response; .220 answers as hostname hx-20 (= hxs-20 per the owner-supplied discovery — recorded prompt hx-20, recorded eno1 .220, boot 00:23:48Z consistent with the owner session 00:21-00:24Z); .21 answers as hostname hxs-21 (MATCH the discovery's recorded prompt + eno1); hxs-21's .21 sits OUTSIDE the fleet .200-.214 block (its discovery already flagged registration verification); both values kept everywhere. Identity verified live 01:14Z: hxs-11 machine-id 159714e4… MATCH the 08-12 discovery; hxs-20 7b5cd0b8… and hxs-21 773a4517… — FIRST LIVE readings (the owner-supplied discoveries carried none), recorded in the new TKV pre-work files. Host-key ceremonies (StrictHostKeyChecking=yes on every connection): hxs-11 PINNED-NEW-VERIFIED (fleet-hostkey-pin.sh vs the owner pre-work console record SHA256:l/PvbuOeocV2GGUscDKS/VuyGZGfOgu2FKhdavZimUo — EXACT MATCH, strict re-verify passed); hxs-20 TOFU-with-corroboration D-record (no fingerprint exists in any HX record — precedent rick F-05; presented ED25519 SHA256:ZUEHfcFL+1Ru070e163g0uJDT7eOwlQh3MW8NZF3Mco pinned, identity immediately corroborated vs the discovery); hxs-21 TOFU-with-corroboration D-record (presented ED25519 SHA256:3ygj6lZMictGTCBZuq1R04VbnECUN4XS0Lq2Pr3gYk8 pinned, corroborated). Credential handling: askpass helper (0700) read at execution time only, sudo -S passthrough, passwordless-sudo confirmed ×3, value never printed/logged/stored/argv, helpers deleted at end. §3 test plan recorded before first mutation (T-ID-1, T-ADDR-1 real addressing, T-LIB-1 both gates, T-VER-1, T-NTP-1, T-MASK-1, T-REG-1, T-SB-1 posture recorded never changed) with exact inverses. §4 baseline: all 3 Ubuntu 24.04.4 LTS kernel 7.0.0-30-generic; Etc/UTC ×3; ufw ENABLED=no ×3; 0 failed units ×3; ollama absent ×3; passwordless sudo ×3; verify-baseline at baseline — hxs-11 (official standard, server-default) 3 PASS + 5 FAIL (the 5 FAILs exactly the two sanctioned classes), hxs-20/hxs-21 SKIP (no class declared — F-2); hardware corroboration (hxs-11 i5-7500 2×16 GB Samsung MATCH discovery; hxs-20 i5-7500 2×16 GB Samsung M471A2K43DB1-CTD + M471A2K43CB1-CTD; hxs-21 i5-7500 2×16 GB Hynix HMA82GS6DJR8N-XN + -VK mixed revisions; all single NVMe 238.5G, p1 vfat /boot/efi + p2 ext4 /). §5 changes — exactly two mutation classes, one host at a time, hxs-11 first (its key verifiable against an owner record — lowest-risk first): identical staged two-line NTP diff ×3 (stock -> NTP=time.cloudflare.com, FallbackNTP= explicitly empty) — hxs-11 01:15:38Z, hxs-20 01:16:51Z, hxs-21 01:17:26Z (each ~0 s server contact + NTPSynchronized=yes); mask align — hxs-11 01:15:39Z, hxs-20 01:16:52Z, hxs-21 01:17:27Z (exactly four /dev/null symlinks per host, no service restarts). §6 post-change verification: the OFFICIAL fleet-standard.yaml (sha256 4c298ea6… unchanged since the 08-27 amendment) — hxs-11 8 PASS 0 FAIL; hxs-20 + hxs-21 SKIP (no class declared, recorded; governor adds them); the SESSION run-standard (official + exactly two host_classes lines — hxs-20/hxs-21 as server-default, zero rule changes, diff verified exactly 2 lines, sha256 d53b7b3a…) — hxs-11 8/8, hxs-20 8/8, hxs-21 8/8, OVERALL hosts=3 hosts-with-FAIL=0; masks ALIGNED ×3; timesyncd.conf sha256 e2b94d4b… on all 3 hosts — the fleet-wide file-level one-source proof now extends to 15 in-scope hosts (12 from the 08-27 wave + these 3); 0 failed units ×3; fleet-selftest.sh 43/43 PASS at session start AND end. §7 findings: F-1 addressing/identity drift on the new hosts (REPORT — hxs-20 = .220 hostname hx-20, hxs-21 = .21 outside the block; closes via the governor's registry/standard updates — LANDED this wave); F-2 standards coverage (hxs-11 IS declared; hxs-20/hxs-21 absent — governor lane, FIXED this wave); F-3 Secure Boot ENABLED on hxs-11 and hxs-21 (record-only, the hxs-6 class — owner BIOS decision, never changed; hxs-20 disabled, compliant); F-4 hxs-21 update-state drift (REPORT — 44 updates recorded at 00:20:51Z vs 0 upgradable live at 01:17Z after the 00:43:18Z reboot; mechanism not established from read-only evidence; owner maintenance lane); F-5 hxs-11 5 upgradable packages (maintenance lane); F-6 new TKV files (/opt/tkv-local/servers/hxs-20/ and hxs-21/ created with pre-work-results.md carrying the wave's re-verification, first-live machine-ids, and the TOFU fingerprints — D-records); hxs-7 untouched (role replaced by hxs-20 per owner advisory; not in this commission). §8 sanitized sequential command log (25 seq; literal-credential sweep of all produced artifacts 0 matches). §9 validation summary: what changed (the two classes + 3 pinned host keys on the executor), what did not (packages, firewall, SSH/network/PAM/sudo