  title: "07-work-order-rick-node.yaml — WO-L1-RICK-NODE-001 (L1-M1: engines-compliant pinned Node runtime on hxs-8 + the pending one-source NTP pin; DISCHARGED — L1-M1 COMPLETE, state log row 34; deliverable DOC-pilot-omniroute-ev-01-rick-l1-node-runtime)"
  type: "work-order"
  declared_purpose: "Delegated contract commissioning rick (Ubuntu OS plane) for L1-M1 of GOAL-OMNIROUTE-L1-SECURE-CORE (goal_file goals/2026-08-27-omniroute-layer1-secure-core.md): give hxs-8 an engines-compliant Node.js runtime for OmniRoute (required >=22.22.2 <23 || >=24.0.0 <27, verified against the v3.8.51 package.json) as a clean, pinned, native installation — no snap, no Docker, no containers — with the install path chosen on evidence (a: official nodejs.org binary tarball; b: NodeSource apt repo 22 LTS; c: snap REJECTED out-of-lane) and recorded for repeatability; and close the pending fleet item by pinning hxs-8's NTP source to time.cloudflare.com with FallbackNTP empty (the owner's one-source rule; scripts/fleet/fleet-ntp-pin.sh --apply authorized, or the manual staged pattern; daemon-reload + restart systemd-timesyncd only; verify current server + synchronized). owner_authorizations: OD-12 Layer 1 authorized 2026-08-27 + OD-03 readiness acknowledged; OD-04 native systemd, never Docker (owner rule); the hxs-8 NTP one-source pin (standing fleet rule, the F-2 carry from the fleet pass); NOT authorized — Docker/containers/snap, package installs beyond the Node toolchain + documented prerequisites, firewall changes, any OmniRoute installation/start (Trinity's separate work order), any backend changes. Boundaries: execution from hxs-5 via SSH hxsa@192.168.50.207 with the askpass credential discipline (read at execution time, never printed/logged/stored, helper deleted at task end); identity verified first against servers/hxs-8/discovery.md (hostname + peer IP + machine-id) with the host key pinned (rick's readiness-run ceremony); exact version pin recorded within the engines range; everything versioned and reversible (pre-state captures, exact steps with hashes, documented inverse per change). Deliverable: 01-rick-l1-node-runtime.md — install-path decision with evidence, exact versions + pin mechanism, engines-range verification vs package.json, runtime smoke, pre/post hashes, NTP pin evidence, documented inverse, sanitized sequential command log, Task May Proceed receipt. Budgets: sessions 1, transient_retry 1. Stop conditions: no clean native path within engines range (escalate, do not force snap/docker); unexpected host state vs the readiness baseline; any requirement to exceed scope. Rollback/containment: documented inverse for every change; pre-state hashes recorded. second_brain_evaluation: opportunity yes — the engines-compliant runtime as a versioned, repeatable recipe becomes the fleet pattern for future service runtimes; disposition implemented (catalog content at handoff)."
  inferred_value: "INFERENCE: the first work order of the owner-authorized Layer 1 — small by design (one runtime + one pending fleet pin) so the layer opens with a fully authenticated, fully reversible mutation and a closed carry (F-2) rather than new risk; its evidence-on-path-decision requirement (tarball vs apt vs snap) sets the comparison pattern later runtime work reuses."
