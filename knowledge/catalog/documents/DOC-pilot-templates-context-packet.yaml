document:
  id: DOC-pilot-templates-context-packet
  title: pilots/_templates/context-packet.yaml — ratified context-packet template (UD5/U6; consulted_records + Carol handoff rule)
  type: contract
  declared_purpose: 'Ratified context-packet template (2026-08-25, owner decision UD5 approving U6 authoring; state log row 60). Pairs with work-order.yaml in the same directory; ''everything the producer needs and nothing it does not''. Fixes the packet contract: goal/work-order/session identity, role (producer lane + call sign), restated objective, current_state (host with OS/kernel verified at packet time, key identities to preserve, relevant config with evidence dates, unit/service states that must hold at completion), owner_decisions with dates and state-log rows, constraints (loopback-only / read-only scope / no-secret rules / frozen-evidence rules, stop conditions, bounded-correction budget), evidence_requirements (pre/post hashes, diffs, outputs, journal excerpts, verification runs, budget/arithmetic tables where the milestone defines them), consulted_records (DOC ids / retrieval packages the governor consulted at dispatch per the AGENTS.md documentation-governance amendment, or ''none required''), and the two-stage handoff rule (execution_accepted on evidence plus deterministic gate pass — the next work order may dispatch then; catalog_pending/catalog_complete tracked independently and never gating routine closure; Carol''s receipt required but not blocking; synchronous only for authority, security, schema, agent-identity and reusable-platform-knowledge changes, and for any class that is unclear). The second_brain_evaluation is answered in the governing work order — the packet does not re-decide it. Rewritten 2026-08-30 (O4, KDD-0024). The retired blocking wording is preserved in Git history and quoted in KDD-0024; hash_history here records the digest transition and the reason for it, not the superseded text.'
  inferred_value: 'INFERENCE: the consulted_records field is the structural hook that makes ''Kimi-K3 consults the catalog before assigning work'' auditable per dispatch — the amendment''s cite-what-you-consulted rule becomes a required field, not a ritual.'
