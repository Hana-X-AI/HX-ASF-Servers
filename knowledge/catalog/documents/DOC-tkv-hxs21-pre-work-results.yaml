  declared_purpose: "First agent re-verification record for hxs-21 (file created 2026-08-28 by rick's fleet baseline wave, session rick-fleet-baseline-20260828-01 — NO human pre-discovery preparation record exists for this host; the file opens with the agent re-verification section): verdict REPORT — baseline green (8/8 PASS post-change vs the server-default rules) with addressing drift + Secure Boot ENABLED recorded (owner/governor close them). Addressing (FACT, supersedes the work-order IP, both values kept): the WO carried hxs-21 = 192.168.50.220 per the fleet .199+N pattern; live — .220 answers as hx-20 (hxs-20); the owner-supplied servers/hxs-21/discovery.md records eno1 = 192.168.50.21 and .21 answers with hostname hxs-21; the discovery address is the real one — the fleet pattern does NOT hold for hxs-21, and .21 is also OUTSIDE the fleet .200-.214 block (the discovery already flagged 'must be verified before fleet registration'). Identity/OS (FACT, verified live against the owner-supplied discovery): the host-key ceremony 2026-08-28T01:14Z — TOFU-with-corroboration (D-record): no fingerprint exists in any HX record for this host (precedent rick F-05, owner-authorized), the live ED25519 key pinned ONLY on immediate corroboration vs the discovery (hostname hxs-21 MATCH the recorded prompt, eno1 .21 MATCH), StrictHostKeyChecking=yes on every connection; the presented host key ED25519 SHA256:3ygj6lZMictGTCBZuq1R04VbnECUN4XS0Lq2Pr3gYk8 recorded so future hxs-21 tasks pin strict — a mismatch must halt the session. Live hostname hxs-21 (MATCH); machine-id 773a45171ba5413fa70d4b3215c43f97 (FIRST LIVE reading — the discovery had none); Ubuntu 24.04.4 LTS kernel 7.0.0-30-generic MATCH; uptime since 2026-08-28 00:43:18 UTC (the host rebooted after the owner's 00:20:51Z evidence session); CPU i5-7500 4c/4t; memory 32 GB (2×16 GB Hynix DDR4 @ 2400 MT/s — DIMM1 HMA82GS6DJR8N-XN + DIMM3 HMA82GS6DJR8N-VK, mixed part revisions) via sudo -n dmidecode; single NVMe 238.5G (p1 vfat /boot/efi, p2 ext4 /) — all FIRST LIVE readings; passwordless sudo CONFIRMED LIVE (the owner-prepared /etc/sudoers.d/90-hx-admin works); Secure Boot ENABLED — RECORDED ONLY (same class as hxs-6/hxs-11; BIOS remediation is an owner decision, NOT changed); ufw ENABLED=no; failed units 0; ollama absent (expected). Mutations applied (the two sanctioned classes only): NTP pin 01:17:26Z (stock -> NTP=time.cloudflare.com, FallbackNTP=; ~0 s server contact 162.159.200.1, NTPSynchronized=yes, conf sha256 e2b94d4b… fleet-identical) + sleep-mask align 01:17:27Z (4 symlinks -> /dev/null, ALIGNED with the proven 4-target set); post-apply re-check 8/8 PASS vs the server-default rule set, 0 failed units — hxs-21 was NOT declared in the official fleet-standard.yaml host_classes at execution (script verdict SKIP, recorded; the matrix ran against the session run-standard = official + exactly 2 class lines; the governor added the host to the official file the same wave). Drift notes vs servers/hxs-21/discovery.md (REPORT, both values kept — discovery preserved unchanged): updates pending — the discovery (evidence 00:20:51Z) records 44 updates immediately available incl. 1 security update; live at 01:17Z reads 0 upgradable from current apt lists (the host rebooted 00:43:18Z between the two readings — the updates were applied in that window, mechanism not established from read-only evidence); all other supplied facts corroborated live (Ubuntu 24.04.4 / 7.0.0-30, eno1 .21, SSH on 22, ufw inactive+disabled, the sudo drop-in functional); the previously-unavailable facts (machine-id, CPU, DIMMs, storage topology, Secure Boot) are now established."
