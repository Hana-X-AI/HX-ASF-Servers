ment (KK3 sole orchestrator; the candidate's DeepSeek Harness void — never existed, KDD-0006; Coder-X per-task verification before every delegated task; Qwen-X independent; Agent Zero holds intent/risk/placement/ratification; OmniRoute never acquires orchestration, memory-governance, or agent authority). §3 lane scope (owns/does-not-own per the charter; cross-lane needs are escalations). §4 knowledge discipline (canonical corpus + catalog; /opt/tkv-local/omniroute REJECTED; commit 42a13fedef8b… CANDIDATE-claimed, unverified — identity from package metadata, content-sensitive hashing, live evidence; Carol owns catalog mutations; standing be-great survey directive). §5 evidence and sanitization discipline (truth-state labels FACT/AUTHORITY/CANDIDATE/INFERENCE; corrected truth order: owner directive -> ratified governance -> live host evidence -> pinned corpus -> upstream docs matching the pinned release -> historical/community -> model memory; artifact-class distinction; secrets never stored or quoted — identifier/owner/retrieval-mechanism only, SEV-1 on suspected exposure; sanitize all raw evidence; zero secrets in any artifact or model context is a p11 hard gate). §6 startup protocol (validate the work order; knowledge review; establish identity — read-only only in Layer 0; risk and rollback receipt — no rollback proof, no mutation; [TRINITY KNOWLEDGE REVIEW COMPLETE] receipt; [TASK PAUSED — ESCALATION TO KK3] on any NO). §7 work-order protocol (corrected schema; change classes low/medium/high/critical with controls; bounded support only by escalation to KK3 — the five specialist cells not adopted). §8 session budgets and convergence (default retry budget 2; exhausted budget is an escalation; Coder-X verification failure is a stop condition). §9 stop conditions (authority collision; unknown provenance; exposed credential; route-guard bypass; rollback not proven; semantic protocol drift; unbounded retry; Coder-X/Qwen-X unestablished; any cloud or target substitution; mutation beyond the authorized layer; high/critical risk). §10 handoff and escalation (final handoff contents; incident severity SEV-1..SEV-4 retained; safety and evidence preservation outrank continued traffic). §11 network and exposure rule corrected (no host firewalls — owner rule 2026-08-26; LAN 192.168.50.0/24 is the boundary per BLUEPRINT §5; exposure expressed as LAN-interface binding + OmniRoute authn/authz + TLS path + owner-approved client scope OD-07; candidate firewall controls void). §12 corrections applied provenance appendix (C1-C7 table with candidate claim, correction, authority). §13 activation: rewritten ACTIVE with the inert condition preserved as labeled history (batch-16 rewrite, 2026-08-27; see notes.source_remnants); the lane is ACTIVE per the header and KDD-0008. [labeled correction 2026-08-27 (rr-47 wave): the trailing clause previously read 'Layer 1 remains gated on OD-12 + OD-03' — HISTORICAL, preserved source history: both conditions were completed 2026-08-27 (OD-12 owner authorization + OD-03 readiness acknowledgement, per the source's own line-35 open correction and notes.review_batch_20260827); the current truth state is ACTIVE + Layer 1 AUTHORIZED — the first mutating commission (WO-L1-TRINITY-INSTALL-001) is already DISCHARGED.]"
