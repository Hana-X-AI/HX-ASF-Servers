  declared_purpose: "Codex-authored execution-grade installation, qualification, and handoff plan for the EARLIER hxs-3 candidate (front matter: document_id doc:hx:pilot:hxs-3:gpt-oss-regular, version 1.0, created 2026-08-25, status 'conditional-pilot-approved; production-adoption-not-approved'; purpose 'Install, qualify, and conditionally register mashriram/gpt-oss-Regular:latest on hxs-3 as an Ollama inference capability governed by KK3 through the DeepSeek Harness'; scope host hxs-3, development-staging, candidate mashriram/gpt-oss-Regular:latest, control gpt-oss:20b). Three decisions deliberately separated: installation authorized as a reversible pilot, qualification mandatory before real agent work, adoption conditional on a same-basis comparison with official gpt-oss:20b. Content: executive outcome + the most important correction ('built-in tools removed' is not 'unfettered weights' — the community template appears to omit caller-supplied .System, a governance blocker until cleared or corrected); mission/DoD/non-goals; claim audit (proposed rationale vs defensible position — 'unfettered' treated as marketing, system-override stripping BLOCKED for trusted use until the canary passes, num_gpu 99 folklore rejected, hardware facts [TO BE CONFIRMED]); artifact identity and supply-chain rules (community candidate digest prefix 7e0c17b5b7de, MXFP4 ~20.9B, 128K declared; official control gpt-oss:20b ~21B MoE, 3.6B active, Harmony, text-only, Apache-2.0); hxs-3 discovery contract; HX architecture and mandatory authority separation; implementation phases 0-11 (change record, pull candidate + official control, pinned alias hx/gpt-oss-regular-20b:hxs3-pilot-20260825, native baseline, system-instruction preservation gate — the candidate's critical gate, corrected-template path only if justified, LangGraph parallel-tool qualification, sampling comparison, context ladder, GPU placement, persistence/boot recovery, DeepSeek Harness registration); evaluation matrix; monitoring + redacted replay envelope; risk register R-001..R-015; rollback/quarantine; agent handoff package; final acceptance checklist; recommendation (install and test the community candidate but make official gpt-oss:20b the default control and likely fallback; reject the candidate if it fails the policy canary or does not materially outperform the official model); references + known gaps."
  inferred_value: "INFERENCE: retained-control context for the active Muse pilot — the v1.1 supersedes it in the primary-candidate role while explicitly retaining GPT-OSS 20B (and Qwen CoderX) as task-shaped controls rather than forcing one universal model (v1.1 §3.3, §8 'Lightweight control/fallback'; KDD-0007: 'gpt-oss is retained as task-shaped control, not displaced'; goal out-of-scope: 'gpt-oss changes (retained as task-shaped control)'). Its qualification machinery (system-canary gate, same-basis A/B, supply-chain digest rules) remains the standing contract IF the gpt-oss control or the community candidate is ever changed; under the active pilot no gpt-oss changes are in scope. Its Harness-era registration phase (Phase 11) maps to the catalog per KDD-0006/0007 exactly as the v1.1's §7."
