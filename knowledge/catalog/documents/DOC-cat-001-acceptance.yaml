  title: "CAT-001 — Catalog acceptance battery (governor-owned verification suite for knowledge/catalog/)"
  type: "contract"
  declared_purpose: "Verifies that the catalog is alive: mechanical checks CAT-01..08 (schema conformance, checksum integrity, index consistency, relation integrity, secret boundary, receipt completeness, path resolution, relation-target hygiene), known-answer retrieval set CAT-10..15 (hostname/IP, Phase A hash and supersession, driver posture, Wi-Fi state, baseline tag and approver, PCIe topology caveat), and judgment checks CAT-20..22 (freshness audit, conflict preservation, retrieval-package economy). Run after every major ingestion; results logged to the governing log."
  inferred_value: "INFERENCE: the standing proof surface for the second brain; CAT-22 is the token-economy measurement the retrieval packages are measured against."
