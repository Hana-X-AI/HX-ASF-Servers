  title: scripts/skills_sync.py — canonical skill tree + tool-scope mirror sync (SY-3)
  type: runbook
  declared_purpose: "Deterministic, stdlib-only tool that owns the canonical skill tree at .agents/skills/ and its two tool-scope mirrors (.kimi-code/skills/ for Kimi Code, .claude/skills/ for Claude Code). --check compares every mirror byte-for-byte and names each drifted path; --write rebuilds the mirrors from canonical. Mirrors are real copies, not symlinks, because this repository has a recorded flattened-symlink failure class. archify is mirrored as a pointer stub only — it is a Node CLI invoked by path, not a prompt skill. validate.py calls plan() as sub-check SY-3 rather than reimplementing the comparison."
