  title: docs/cicd-pipeline.md — CI/CD pipeline human-facing documentation (p8, owner-ratified 2026-08-26; step list, lifecycle, review-fix loop, conventions, setup, deviations D1–D4)
  type: runbook
  declared_purpose: 'Human-facing documentation of the p8 CI/CD pipeline for HX-ASF-Servers (owner-ratified 2026-08-26, plan argent-groot-ant-man): the 20-step list across the gates / coderabbit-review / pr-manage jobs (reconciled 2026-08-30: the PyYAML install and the work-state engine suite (O1) are now documented gates steps, and the list renumbered accordingly); the lifecycle (Mermaid flowchart: push -> gates + review + pr-manage -> required checks -> auto-merge squash into main); the review-fix loop (CodeRabbit detects on the PUSHED RANGE BEFORE..HEAD per KDD-0022, falling back to the branch diff vs origin/main only when BEFORE is unusable; the fixing agent the governor dispatches under a work order — the body no longer names "Kimi-K3 / john" (applied 2026-08-29 addendum; governor is James per the 2026-08-30 persona rename) — fixes and re-pushes, <=2 review passes per CodeRabbit guidance, remaining nits ignored deliberately; a run with no complete event fails the gate loudly); conventions (branch prefixes feature/ fix/ chore/; main is the factory''s working branch — protection requires the two checks for PRs only, governor-on-main preserved; bot/CI commits carry no co-author; notifications via PR comments + check statuses); one-time setup (owner web steps for the CodeRabbit organization + Agentic API key + CODERABBIT_API_KEY repo secret + optional GitHub App; bootstrap already executed via API — allow_auto_merge, Actions workflow permissions, main branch protection); a credential note (the fine-grained PAT in the local credential store returned 401 on 2026-08-26 — revoke/replace; the classic PAT works); deviations from the p8 letter ratified with the plan — D1 factory agent commits fixes (CodeRabbit CLI does not commit), D2 <10 min happy path holds for main pushes only (branch review gate 7–30+ min), D3 approve-and-merge = green review check + platform auto-merge, D4 gitleaks as the security scan (no dependency manifests — Dependabot N/A; CodeQL stays available as a later addition); and the standing-directive Second Brain evaluation (CI run receipts as catalogable governance-signal evidence — recommended for a future iteration, deliberately not implemented now to avoid scope expansion beyond the ratified plan).'
  inferred_value: 'INFERENCE: this is the operator/owner surface for the pipeline — the setup checklist (secret activation, optional App) and the D1–D4 ratified deviations are what a future session needs to avoid re-deriving the plan-vs-implementation deltas; the Second Brain deferral is recorded with its reasoning, so a later CI-evidence cataloging wave has an explicit, dated starting point.'
