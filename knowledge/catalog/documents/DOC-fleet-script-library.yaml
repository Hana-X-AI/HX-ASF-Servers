  record_class: "One record for the library as a whole (governor's brief). Type judgment per the brief's contract-or-runbook option: RUNBOOK — the library is living operational tooling plus its usage contract (README + self-verifying scripts + standards-as-data), not a negotiated delegated contract (the work-order class) and not a point-in-time execution record (the evidence class, which the verification file carries separately). The brief's required notes carried: v0.1 Meta-X-verified 9/9; v0.1.1 batch-17 H1-H4 hardened with 42-check selftest; shellcheck clean; mutators default non-mutating — all VERIFIED against README.md, fleet-standard.yaml, the evidence file + its Addendum A, and hxs-2 log rows 47-53 this run (proof execution itself — shellcheck/selftest runs — is rick's/governor's evidence as recorded; Carol does not execute repo tooling)."
