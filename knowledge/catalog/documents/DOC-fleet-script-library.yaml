t superseded (the L1-M1 pin 16:05:59Z + the owner's baseline GO recorded with the evidence pointer); the server-default class gained ntp_enabled + ntp_synchronized enforce + the 4-target mask set enforce; ntp_server lifted report -> enforce; Secure Boot + firewall remain report-only by absence of rules (hxs-6 SB owner-pending). Governor re-verification vs the amended standard (independent run): llm-host 10/10 ×4, server-default 8/8 ×8, OVERALL hosts=12 hosts-with-FAIL=0 (row 3)."
  mid_run_chain: "MINT-TIME STABILIZATION (this wave): review batch 18 was executed live during this ingestion — fleet-selftest.sh moved through FOUR states between 06:36Z and 06:40:13Z (0a0b822b… -> ae552128… -> a4955b64… -> c051bfd5…; the batch-18 F6 eval-removal + F7 refusal-matrix corrections, hxs-2 log row 53, 06:45Z) and the evidence file gained its Addendum A at 06:44:57Z. Minting was held until the file was quiet (stable c051bfd5… from 06:40:13Z, verified unchanged at 06:47Z and 06:50Z); the transient selftest digests and the intermediate manifest digests cc9c9e1f…/a4955b64-era never entered the catalog as validated states (living-log precedent). Record minted at v0.1.2 content."
  credential_hygiene: "The library's credential boundary is architectural (README §'Credential boundary'): no password reads, no credential paths, no secret storage, nothing in argv; transport via FLEET_SSH/default ssh; mutators use remote sudo -S with stdin passthrough or passwordless sudo. No credential value appears in any library file or in this record (profile §6)."
  known_limits: "README field notes (carried for future revisions): firewall.ufw_conf is the authoritative firewall switch (ufw.service unit state informational — hxs-1 boot-enabled with firewall OFF, no owner-rule conflict); secure_boot degrades to unknown -> NOT-ESTABLISHED without mokutil; timedatectl queried single-property only (systemd 255 comma-join quirk); verify-baseline keys classes on fleet names (transport address mapping is the caller's); evidence-pull verifies counts, not per-file content equality with the remote. Batch-18 residual documented in the ntp-pin header: between diff-review and apply only the transport user or root can touch the staged file."
