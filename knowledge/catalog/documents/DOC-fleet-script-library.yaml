document:
  id: "DOC-fleet-script-library"
  title: "scripts/fleet — HX fleet script library (README + seven scripts + fleet-standard.yaml; v0.1.2: Meta-X-verified 9/9 at v0.1, batch-17 H1-H4 hardened, batch-18 selftest corrections; shellcheck clean; mutators default non-mutating)"
  type: "runbook"
  declared_purpose: "Owner directive 2026-08-27 ('it would be a great idea for rick to script much of the repetitive work… a class library that can be called when needed… base verification rick can execute now across the fleet'; hxs-2 state log row 44). Codifies the proven patterns from servers/2026-08-26-fleet-time-and-mask-pass.md (audit, staged fail-closed change, verify, final sweep) and pilots/PILOT-OMNIROUTE-LAYER0-001/04-rick-hxs8-readiness.md (readiness inventory). Bash + native Ubuntu commands only; no new packages anywhere; no Python/pyyaml — the standards file is parsed with awk. Files: fleet-inventory.sh (READ-ONLY per-host inventory -> JSON/--human/--kv), fleet-verify-baseline.sh (READ-ONLY actual-vs-declared matrix against fleet-standard.yaml — the owner's 'base verification'), fleet-ntp-pin.sh (MUTATING with --apply; staged fail-closed NTP=time.cloudflare.com pin with FallbackNTP empty; --dry-run default; mktemp staging contract H3; already-compliant exit 0 H4), fleet-sleepmasks.sh (verify READ-ONLY default; apply MUTATING; the proven 4-target sleep-mask set), fleet-evidence-pull.sh (READ-ONLY remote default; timestamped tar-over-SSH pull + sha256 manifest; --prune the library's only destructive option — protected-roots refusal H2 before any network activity, verified-pull gate, %q-quoted remote path H1), fleet-hostkey-pin.sh (executor known_hosts only; NEVER accept-new, NEVER disables checking; pin only on exact fingerprint match), fleet-selftest.sh (offline 42-check self-test: syntax, --help, fixtures PASS/FAIL/REPORT/SKIP, fingerprint extraction, %q quoting contract, prune-guard refusal matrix, mock-transport pull/prune + ntp-pin stage/empty-diff replays), fleet-standard.yaml (data: host->class map hxs-1..4 llm-host / hxs-5 workstation / hxs-6..15 server-default + per-class rules eq/ne/contains/in, enforce/report — llm-host: Etc/UTC, NTP enabled+synchronized+time.cloudflare.com, 4 masks, ufw_conf in no,not-installed, secure_boot disabled). Credential boundary (hard rule): scripts NEVER handle credentials — no password reads, no credential paths, no secret storage, nothing in argv; SSH transport is the caller's (FLEET_SSH env or default ssh). Mutator work-order rule: --apply/apply run ONLY under an explicit work order naming the target host; both mutators default to non-mutating mode and print their exact rollback inverse in --help."
  inferred_value: "INFERENCE: the fleet's first reusable operations tooling layer — it converts three individually-proven procedures into a callable, self-testing class library with a standards-as-data file, so fleet verification becomes re-runnable instead of re-constructed; its hardening history (Meta-X 9/9 -> batch-17 H1-H4 -> batch-18 F6/F7) is the fleet's reference example of the verify-then-harden loop closing with deterministic proofs."
