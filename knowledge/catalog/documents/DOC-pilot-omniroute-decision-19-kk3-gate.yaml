  decision_convention: "Typed decision per the KDD/decision-class convention (cf. DOC-pilot-hx1-decision-36-m8-acceptance): a gate decision by the governor with the evidence basis and exact acceptance-criteria validation recorded in the artifact. Unlike the hxs-1 M8 package this decision needs no owner signature — the KK3 gate is the governor's own; the PENDING owner gate is OD-12 (separate, tracked in DOC-pilot-omniroute-owner-decision-packet). status active: the decision is operative and its 7 carried conditions bind all later-layer work; no status flip is pending — an owner OD-12 grant would be a NEW decision event with its own record and receipt, not a flip of this record."
  carried_conditions: "The 7 carried conditions (boundaries, not failures): (1) OD-13 hard Layer-1 secrets requirement (env-provision JWT_SECRET + API_KEY_SECRET + STORAGE_ENCRYPTION_KEY, never accept plaintext defaults); (2) backup encryption/cloud upload treated as nonexistent; (3) agent-like surfaces stay disabled (8 BLOCKED entries stand absent explicit owner reversal); (4) skills execution + background jobs need explicit Layer-1 deployment settings (disabled-by-default not code-enforced); (5) no ATEM assumption for Meta-X; (6) OD-03 owner ack required before hxs-8 host-dependent work; (7) Coder-X candidate until its M8 — per-task identity/health verification mandatory on every use."
