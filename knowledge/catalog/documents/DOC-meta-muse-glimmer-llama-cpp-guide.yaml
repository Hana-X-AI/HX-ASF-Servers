  title: "doc-1.md — Meta 'Deploy with llama.cpp' guide for Muse Glimmer (upstream capture, agent-zero-docs/pilots/hxs-3/meta/)"
  type: "runbook"
  declared_purpose: "Meta's official deployment guide (front matter: title 'Deploy with llama.cpp', description 'Run Muse Glimmer locally with llama.cpp for CPU, mixed, and GPU inference', cms alias /model-api/docs/muse-glimmer/llama-cpp): run Muse Glimmer with llama.cpp across CPU, Metal, CUDA, ROCm, and Vulkan, serving the published GGUF checkpoints with no conversion. Content: upstream-is-source-of-truth notice — Muse Glimmer support landed in commit 62bf73d25 (PR #26841), adding the muse-glimmer architecture, the vision projector, the ATEM tool-call parser, and DFlash speculative decoding; checkpoint download (meta-models/Muse-Glimmer-30B-GGUF: KQuant 17 GB Q4_K_M text model — 'use this one', dynamic K-quant Q4_K_XL ~20 GB, mmproj vision projector Q4_K_M ~1.4 GB, optional DFlash draft ~1.6 GB; full-precision not published as GGUF); build floor b10353 (b10344 and older refuse the architecture with 'unknown model architecture: muse-glimmer'; prebuilt or source build, Web UI off, arch registration check via LLM_ARCH_MUSE_GLIMMER); server startup (-a muse-glimmer, -ngl 99, -c 131072, --jinja, --chat-template-kwargs reasoning_strength, --api-key guards inference endpoints only; embedded-template rule — never --chat-template-file, the GGUF template is byte-identical to the published chat_template.jinja and selects the ATEM parser); context-per-slot semantics (n_ctx_slot bounds a single generation; exhaustion yields no answer and no error; scale -c with -np; GQA 2 KV heads + sliding window on 3 of 4 layers); reasoning-length control (reasoning_strength low/medium/high/xhigh default high, server-wide or per request; reasoning_effort NOT implemented; reasoning cannot be turned off — reasoning_strength: low spends fewer tokens, --reasoning-budget N hard-caps; reasoning tokens count against max_tokens, ceiling mid-thought returns empty content with finish_reason 'length'); vision via image_url (URL, data URI, local path — billed as prompt tokens); CLI binaries (llama-cli -st, llama-mtmd-cli for images; --jinja required; CLIs do not separate reasoning); tool-calling verification (server-side ATEM parsing returns finish_reason 'tool_calls' + structured tool_calls array — any OpenAI-compatible harness needs no ATEM-specific handling); stop tokens (eos = <|end_of_text|> + <|eot|>; never stop on <|eom|>); next steps (speculative decoding, quantization, other runtimes)."
  inferred_value: "INFERENCE: the diagnostic compatibility floor and the drafted escape hatch for the hxs-3 pilot — HX deploys Ollama, not a separate llama.cpp server, so b10353/commit 62bf73d25 are floors the installed Ollama build must match in behavior (v1.1 §3.4); KDD-0007 rejected this path as primary (breaks blueprint-uniform operations) and retains it as the drafted escape hatch if the M4/M5 Ollama compatibility gate fails. Its context-per-slot and truncation failure modes are the exact behaviors the goal's context-ladder and SC-05 truncation checks must reproduce under Ollama. Vendor documentation: verify against the live runtime before converting any flag into configuration (upstream-reference; never HX-established fact)."
