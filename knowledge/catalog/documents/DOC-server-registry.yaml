  inferred_value: "INFERENCE: cataloging the REPO copy closes the asymmetry where only the TKV mirror had a record while the repo copy is the one the governor actually amends (both 2026-08-27 amendment sets landed here and were then mirrored to TKV) — this record is now the catalog's first resolve target for fleet role/workload truth, with the mirror's record carrying the TKV-side lineage."
