  corrections_20260826: "Re-validation after the governor's post-review-batch-8 wave — all changes verified at source, legitimate governor edits: (1) render.py list engine rewritten with the _emit_list helper (verified present, render.py:76) fixing continuation-line, nested-list, and wrapped-bold rendering defects; (2) scripts/wiki/test_render.py added — 12-test regression suite covering exactly those three defect classes plus unchanged surfaces (heading anchors, tables, code fences, Mermaid); executed read-only this run: 12/12 OK; (3) manifest.txt extended 29 → 32 lines adding the three 2026-08-25 assessments. declared_purpose and the governs-relation count updated 29 → 31 unique."
  manifest_duplicate: "FLAG F-DUP-1 (2026-08-26): manifest.txt carries knowledge/assessments/2026-08-25-hx-second-brain-guidance-001-review.md TWICE (lines 29 and 34) — 32 entry lines but 31 unique documents. Effect benign (re-renders the same sibling .html twice; --check unaffected) but the 32-count overstates the document set by one. Source artifact is outside Carol's write bounds — flagged to Kimi-K3 for a one-line fix, NOT fixed here."
  derived_artifacts_rule: "Sibling .html files are derived renderings of cataloged (or routine) Markdown sources. They are never separately cataloged and never hand-edited; synchronization is guarded by render.py --check (stamped source sha256 vs current source, exit 1 on drift). First wave rendered 2026-08-25; --check 29/29 OK at state log row 56."
  usage: "render.py (render all manifest entries) | render.py FILE.md [FILE.md..] (specific files) | render.py --check (verify hash sync). Regression suite: python3 scripts/wiki/test_render.py (12 tests)."
