document:
  id: "DOC-scripts-wiki-dual-format-render"
  title: "scripts/wiki/render.py + scripts/wiki/manifest.txt — dual-format Markdown-to-HTML rendering system (ratified convention Q2, implemented 2026-08-25)"
  type: "runbook"
  declared_purpose: "Implementation of the owner-ratified dual-format documentation convention (AGENTS.md Documentation conventions, owner answer Q2 2026-08-25, state log row 55: 'start generating web versions — docs will eventually make their way into HX-Wiki, build with that in mind'). render.py is a stdlib-only, deterministic Markdown renderer producing semantic, self-contained single-file HTML (inline CSS, heading anchors, real tables, code blocks, Mermaid carried as <pre class=\"mermaid\"> plus the mermaid.js initializer with source-visible offline fallback), structured for eventual HX-Wiki import. Each generated .html stamps the source path, full sha256, and render timestamp in a footer and an HTML comment; render.py --check verifies every stamped hash against the current source and exits 1 on drift (hash-sync guard). manifest.txt lists the repo's 29 major documents (AGENTS.md, READMEs, agent charters/profiles, goals, knowledge docs, KDD-0001..0005, the Second Brain assessment, catalog README, plan, A01, decision-23); each gets a sibling .html. Markdown stays the source of truth; HTML is never hand-edited; logs, notes, receipts, evidence files, work orders, and routine records stay Markdown-only by convention."
  inferred_value: "INFERENCE: the --check hash-sync guard makes the derived HTML wave verifiable without cataloging it — drift between a Markdown source and its rendering is mechanically detectable, so the catalog needs exactly one disposition record (this one) for the whole dual-format system."
