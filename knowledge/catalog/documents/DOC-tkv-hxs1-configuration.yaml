  declared_purpose: "Phase-2 server configuration record per the /opt/tkv-local server records contract — 'What did HX configure this server to become'. Records hxs-1's assigned role (Deep reasoning & synthesis) and primary workload (Qwen 3.8 27B GGUF Q4_K_M non-MLX via Ollama) copied from SERVER-REGISTRY.md (the record does not assign them; fulfills the registry's reserved slot); approved by Agent Zero (KDD-0004 baseline adoption; M0 authorization 2026-08-24). Captures the final configuration: Ubuntu 24.04.4 LTS kernel 7.0.0-30-generic (DKMS covers -28/-30), nvidia-driver-580-server-open 580.173.02 (retain-and-validate, owner D3); static 192.168.50.200, SSH-only exposure, Ollama API loopback-only 127.0.0.1:11434 with remote refusal proven, CORS localhost-only, OLLAMA_NO_CLOUD=1, Wi-Fi rfkill soft-blocked and boot-persisted (x4 incl. one unplanned site power loss); root ext4 on 3.6 TB NVMe with model store on root (owner D1), two further disks unallocated; both RTX 4070 Ti SUPER fully resident for the model (100% VRAM; layer-split compute alternation expected, equal utilization a non-goal; PCIe x4/x16 asymmetry recorded since 2026-08-11; Hailo-8 present driverless unused); three ratified profile aliases (hx-qwen3.8-27b-32k db2c6206… recovery baseline, -64k 766cd9469fb4… operating default resident, -128k 94b83a1e… qualified extended explicitly selected; bare alias retired tags-only with deterministic inverse); preload script + ollama-preload.service drop-in (TimeoutStartSec=600, <=538 s worst case) and hx1.conf (ctx 65536); services ollama.service + ollama-preload.service + systemd-rfkill units all enabled/active. Validation checklist all boxes ticked with milestone citations; full Material Change Record (install/pin through A01 rebuild, three-profile ratification, rfkill, kernel -30, preload-budget fix, unplanned power cut) each with validation and rollback; Sources cite the pilot package (evidence 03-35, M8 reconciliation 36, state log rows 1-63) and the Carol catalog. Closes catalog flag F8 (configured state previously lived only in the pilot corpus)."
  inferred_value: "INFERENCE: this is now the first-stop answer to 'what is hxs-1 supposed to be' — the fleet-level complement to the pilot's evidence corpus, and the record future work orders on hxs-1 should cite for configured-state truth (verified live 2026-08-26 per its Sources). Its rollback column (one-line versioned inverses, GRUB previous entry, byte-copies retained) makes it the cheapest rollback reference as well. Freshness risk: it is a point-in-time M8 snapshot — any post-M8 host change must grow its Material Change Record or this record goes stale."
