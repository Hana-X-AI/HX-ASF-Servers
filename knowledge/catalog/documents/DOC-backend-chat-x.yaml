notes:
  record_class: 'backend capability (typed registry per judgment — see DOC-backend-qwen-x notes.record_class for the class rationale): one catalog registry entry per fleet call-sign; consumers resolve endpoint + profile + limits here per blueprint §8. Fourth materialization of the class — closes receipt flag F-CHATX-1 (0608Z run); the §8 every-server-carries-a-record rule is now 4/4 materialized.'
  callsign_convention: 'Fleet capability call-signs (owner, 2026-08-26): capability-level alias resolved through this record — never a bare Ollama tag; the X is ALWAYS capital. Deviation from the fleet convention, recorded plainly: Chat-X is ACTIVE WITHOUT the host''s M8 sign-off — the ''status candidate until M8'' convention does not apply because hxs-4 is not on a pilot track (owner provisioning, per dispatch).'
  status_mapping: 'catalog status active = blueprint §8 ''ACTIVE'' for Chat-X by OWNER PROVISIONING (governor brief 2026-08-26): the backend is working now; NOT pilot-track — no factory qualification (no M0–M8 chain, no M5/M6 qualification suites; the 2026-08-26 L1 work order was a bounded alignment + capacity-ladder commission, not a qualification chain). owner-provisioned and working 2026-08-26; blueprint alignment items: version pin 0.32.15 ACTIVATED by the owner ladders+profiles order 2026-08-26 and discharged (0.32.9 → 0.32.15, WO-HXS4-JOHN-L1-001); preload/persistence, LAN posture, qualification remain PARKED — owner decision when the role grows (untouched by L1 per the owner boundary). Distinct from Qwen-X''s ACTIVE-via-M8 (ratified-governance): same status word, different basis — recorded here so no reader infers qualification.'
  authority_basis: 'authority_level owner-directive per dispatch: the capability exists by owner provisioning — not by ratified pilot governance (Qwen-X), agent evidence (Coder-X), or a delegated contract (Meta-X); the live facts are governor live-verified 2026-08-26 and the registration itself is the owner call-sign directive (produced_by edge). If a future owner decision puts hxs-4 through blueprint qualification, authority matures per the pilot chain.'
  checksum_method: 'sha256 = servers/BLUEPRINT-llm-server.md at registration-close (chain: 51825990… at the 0608Z close → ce0cabf0… at 2026-08-26T06:26Z after the governor''s post-0608Z §8 edit adding the ''Catalog record'' record-ID column and the Chat-X queued-record cell — this record''s own §8 row unchanged in content → 5062b208… at 2026-08-26T07:47Z after the governor''s 06:46Z-era §8 edits: record-ID column completion (the Chat-X cell resolved to DOC-backend-chat-x; intermediate state 88c1b85a… per the meta-x chain), the Meta-X cell update to the frozen alias, and the batch-11 Provenance ''registered'' line — this record''s own §8 row content unchanged at each step) → df59d340… at 2026-08-26T10:00Z after the governor''s §8 alias-table profile entries (the Chat-X row now reads ''hx-qwen3.5-9b-64k default reference; -32k baseline (**A-1: needle-proven to 89.5% — thinking-model headroom, not ~95%**); -128k extended (frozen 2026-08-26)'' — VERIFIED PRESENT at source line 87) — the §8 alias-table row is the registration locus of this catalog-native record; per-host capability facts are governor live-verified and, since WO-HXS4-JOHN-L1-001 (2026-08-26), evidenced by DOC-pilot-hxs2-ev-10-esme-chatx-ladder-profiles (relations). Re-hash on blueprint drift (T-micro re-validation).'
  profile_set_l1: '2026-08-26 — L1 (WO-HXS4-JOHN-L1-001, 10-esme-chatx-ladder-profiles.md rev 2 PASS, governor live-verified hxs-2 state log row 22): the three-profile set is FROZEN — hx-qwen3.5-9b-32k 3ef4f2846872a96ec1a8c3321b18ee0ab39e8ac7814374dd94bd7de601279b80 (baseline), hx-qwen3.5-9b-64k 5936a390c6c22594ce49e8c77187fc92f4a81126fd04a4eabad7c000b30447d2 (DEFAULT usage reference — matches the commissioned OLLAMA_CONTEXT_LENGTH=65536), hx-qwen3.5-9b-128k 09faff0fd4d3a5793c4bb99222e865cb9d210cb582319a77bf20d52c5330bf37 (extended); digest equality proven ×3 (deterministic rebuild + manifest-layer equality; weights+license shared with the base, params-blob-only delta); KV f16 exactly linear 32,768 B/token (8 KV layers, hybrid-attention; supersedes the ~33,554 estimate); all rungs 100% VRAM post-O2. A-1 (Chat-X qualification fact, carried to every deep-context consumer of the 32k profile): the 32k needle is needle-proven stop+found to 89.5% (and 86.3%); at ~95% (95.3%/91.5%) the thinking model''s reasoning exhausts the remaining context (done_reason=length) — a thinking-headroom limit at small context, NOT a capacity/KV/residency failure (all passed); 64k 94.8% and 128k 94.7% met ~95% cleanly. O2 (owner decision 2026-08-26, row 21): usable VRAM 7.5 → 23.0 GiB across BOTH GPUs (RTX 5060 Ti 15.5 + RTX 5060 7.5) — versioned one-line hx-commissioning.conf amendment (f78de229… → 9d1d024c…; chain commissioning 9d90a991… → web-search f78de229… → O2 9d1d024c…), every other setting preserved (Vulkan-disabled, ctx 65536, NUM_PARALLEL=1, MAX_LOADED_MODELS=1). Loopback-only endpoint UNCHANGED; parked items (preload/persistence, LAN posture, firewall) untouched; tags only, none resident (on-demand posture restored). The blueprint §8 Chat-X row carries the frozen entries + the A-1 note (verified this run, source line 87).'
