  title: Backend-capability record — Chat-X (hxs-4, 192.168.50.203; qwen3.5:9b-q4_K_M; Ollama 0.32.15; three-profile set frozen 2026-08-26; loopback-only endpoint; status ACTIVE, owner-provisioned)
  type: registry
  declared_purpose: 'Fleet backend-capability registration per servers/BLUEPRINT-llm-server.md §8 (registration schema: endpoint, exact tag + digest, capabilities, runtime profile, health/evidence contracts, owner). call_sign ''Chat-X'' (owner fleet call-sign directive 2026-08-26; the X in a call-sign is ALWAYS capital) = hxs-4 (192.168.50.203), the fleet basic chat utility (Qwen 3.5 9B). OWNER-PROVISIONED and working 2026-08-26 — NOT pilot-track: no factory qualification, no M0–M8 chain; status ACTIVE by owner directive (authority owner-directive — see notes.status_mapping). Endpoint LOOPBACK-only on hxs-4 (loopback bind; LAN refused — governor live-verified from hxs-5 2026-08-26; LAN posture is a parked blueprint-alignment item). Model qwen3.5:9b-q4_K_M, 6,594,474,711 B (live /api/tags authoritative; the registration''s earlier 6,594,474,111 B was a transposition, corrected openly per the Chat-X L1 evidence §2.1), digest 6488c96fa5faab64… (governor live-verified 2026-08-26). Three-profile set FROZEN 2026-08-26 (WO-HXS4-JOHN-L1-001, 10-esme-chatx-ladder-profiles.md rev 2, governor live-verified hxs-2 state log row 22): hx-qwen3.5-9b-32k 3ef4f2846872… (baseline — A-1: needle-proven stop+found to 89.5%; ~95% truncates thinking-model output — a thinking-headroom qualification fact, NOT a capacity failure), hx-qwen3.5-9b-64k 5936a390c6c2… (DEFAULT usage reference — matches the commissioned 65536 default), hx-qwen3.5-9b-128k 09faff0fd4d3… (extended, needle 94.7% stop+found); digest equality proven ×3 (deterministic rebuild + manifest-layer equality; params-blob-only delta); KV f16 exactly linear 32,768 B/token; model reference is alias-only per blueprint §8 (the alias-convention alignment item is discharged). Capabilities: basic chat completion as provisioned; tool calling / vision NOT registered (unprobed — no factory qualification). Runtime profile: ctx 65536 (drop-in OLLAMA_CONTEXT_LENGTH=65536 — no num_ctx baked in the tag); resident-on-demand — 100% VRAM when loaded (post-O2 both GPUs usable: 23.0 GiB = 15.5 + 7.5; pre-O2 the model split 28%/72% CPU/GPU under the 7.5 GiB isolation), idle-unloads (no preload service, no persistence contract). Runtime: Ollama 0.32.15 (pinned from 0.32.9 2026-08-26 — installer byte-identical to the TKV-reviewed baseline, binary == server; the version-pin alignment item ACTIVATED by the owner ladders+profiles order and discharged). O2 isolation relaxation (owner decision 2026-08-26, hxs-2 state log row 21): usable VRAM 7.5 → 23.0 GiB across BOTH GPUs — versioned one-line amendment to hx-commissioning.conf (sha256 f78de229… → 9d1d024c…; chain: commissioning 9d90a991… → web-search f78de229… → O2 9d1d024c…), every other setting preserved, loopback-only endpoint UNCHANGED. Health/evidence contracts: none (no preload unit, no qualification evidence chain) — the owner-provisioned working state is the registration basis. Owner: Agent-Zero. Blueprint alignment items parked (UNCHANGED): preload/persistence, LAN posture, qualification — owner decision when the role grows.'
  inferred_value: 'INFERENCE: Chat-X is the fleet''s only loopback-only backend and its only ACTIVE registration without a qualification chain — consumers off hxs-4 cannot resolve it today (LAN refused), so its practical consumer set is hxs-4-local tooling until the owner rules on the LAN posture; any hardening expectation (pin, preload, persistence, qualification) must come from a future owner decision, never assumed from blueprint conformance.'
