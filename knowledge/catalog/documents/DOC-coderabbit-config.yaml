document:
  id: DOC-coderabbit-config
  title: .coderabbit.yaml — CodeRabbit review configuration (p8, owner-ratified 2026-08-26; keys verified against the live official schema.v2)
  type: contract
  declared_purpose: 'CodeRabbit configuration for HX-ASF-Servers (p8, owner-ratified 2026-08-26), consumed by the CodeRabbit CLI review in the ci-cd workflow and governing the GitHub App if installed later. Keys verified 2026-08-26 against the live official schema (coderabbit.ai/integrations/schema.v2.json; configuration reference dated 2026-08-24). Policy content: language en-US, early_access false; reviews.profile chill (balanced feedback — assertive rejected as too noisy for a governance repo); request_changes_workflow true; path_filters exclude rendered HTML (artifact — Markdown is the source of truth) and __pycache__; path_instructions encode three repo rules for the reviewer — scripts/** is stdlib-only Python (flag any third-party import), pilots/**/fixtures/** are versioned and alias-parameterized (flag hard-coded model tags, missing alias recording, persisted thinking content), **/*.md governance records are append-only (flag silent rewrites of history — corrections must be open and labeled); auto_review enabled with auto_incremental_review on base branch main; finishing_touches.autofix enabled (inert — requires the GitHub App plus a Pro plan); tool integrations matched to the repo''s actual content: ruff, shellcheck, yamllint, actionlint, gitleaks; chat.auto_reply true.'
  inferred_value: 'INFERENCE: this is the review-policy half of the p8 gate — the workflow decides WHEN review runs and what blocks a merge (critical/major), this file decides WHAT the reviewer looks for, and its path_instructions convert three standing repo rules (stdlib-only, fixture versioning, append-only governance) into enforced review criteria; the HTML exclusion keeps the dual-format artifact surface out of review scope per the Q2 convention.'
