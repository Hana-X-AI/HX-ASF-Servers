notes:
  header_verification: "Verified at ingestion: KDD header fields read Date 2026-08-26, Status ratified, Decider Agent-Zero. Record status/authority follow the established KDD record convention (KDD-0001..0006: status active, authority_level ratified-governance — 'ratified' is not a schema status enum value); the header's ratified state and decider are preserved verbatim in declared_purpose (same treatment as DOC-kdd-0005/DOC-kdd-0006 notes.header_verification)."
  capability_limit_convention: "NEW CATALOG CONVENTION (per dispatch, recorded in the KDD decision text and the goal's Second Brain evaluation): a capability LIMIT is registered as first-class registry content — parallel_tool_calling: false for muse-glimmer:30b — so every future dispatch retrieves the limit alongside capabilities. Prior registrations carried capabilities/limits inside Harness-era registry sketches (v1.1 §7) or prose; from KDD-0007 forward the limit is a decides-edge and, at the registration milestone (SC-08), a field of the catalog capability record."
  escape_hatch: "Option 2 (Meta native llama.cpp server, doc-1 path) is retained as the DRAFTED ESCAPE HATCH, not a standing second serving plane: it fires only if the Ollama compatibility gate fails at M4/M5; llama.cpp floor b10353 (commit 62bf73d25) is diagnostic-only for the installed Ollama build (state log row 1)."
  limit_enforcement_amendment: "MID-RUN AMENDMENT re-validated this run (2026-08-26T06:15Z; governor edit 05:48:44Z, 'review finding 2026-08-26'): the Decision's LIMIT sentence now carries the two-level enforcement contract — 'responses containing more than one tool call are rejected, and accepted calls execute serially with results returned before the next selection (the request-level parallel_tool_calls flag is a compatibility probe only, never enforcement)'. The registered LIMIT itself (parallel_tool_calling: false, one call per model turn, proposed never authorized) is unchanged; the amendment sharpens HOW the harness enforces it. Hash chain: caa8de2c… (M0 ingestion 05:05Z) → b9640414… (06:15Z re-validation) → b9640414… UNCHANGED at the 2026-08-26T07:47Z batch-11 re-validation (source md untouched since the amendment). The matching goal-file amendment (intent + SC-05 row) is re-validated in DOC-goal-hxs3-muse-glimmer-tooling. Historical, RESOLVED: the derived .html sibling was stale post-edit (wiki-sync DRIFT — governor-lane re-render, receipt flag F-WIKI-3); VERIFIED CURRENT this run — KDD-0007 is in scripts/wiki/manifest.txt (line 41), the KDD-0007.html sibling carries the amended two-level enforcement text verbatim, and render.py --check reports OK (in sync with the source md; html sha256 c0d6a479e861733711bde3365a1342e3b1c0f34d112a497ae0733afe597ef458). The Meta-X capability record (DOC-backend-meta-x) carries the amended semantics."
  wiki_rendering: "At ingestion (2026-08-26T05:05Z) KDD-0007 was not listed in scripts/wiki/manifest.txt and had no .html sibling — flagged as a follow-up (same as KDD-0006, DOC-kdd-0006 notes.wiki_rendering). RESOLVED governor-side the same day (the manifest-completion follow-up recorded at hxs-3 state log row 6): KDD-0007 is manifest line 41 and the .html sibling renders in sync (render.py --check OK, verified 2026-08-26T07:47Z). Dual-format manifest membership and rendering remain the governor's lane (AGENTS.md documentation conventions)."
