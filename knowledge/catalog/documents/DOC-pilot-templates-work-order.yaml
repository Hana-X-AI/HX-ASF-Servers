document:
  id: DOC-pilot-templates-work-order
  title: pilots/_templates/work-order.yaml — ratified work-order template (UD5/U6; mandatory second_brain_evaluation block)
  type: contract
  declared_purpose: 'Ratified work-order template (2026-08-25, owner decision UD5 approving U6 authoring; state log row 60). Copied per milestone with section order kept; every field required unless marked optional. Fixes the work-order contract: task_id/parent_goal/milestone/assigned_agent identity, objective with single-line acceptance statement, explicit owner_authorizations (including NOT-authorized items), boundaries (files/systems allowlist; versioned-change pre/post sha256 + diff rule; execution path — session on hxs-5, SSH hxsa@<ip>, askpass helper READS the credential at execution time per the ratified pattern, no extracted secret copy, helper deleted at task end, verify hostname and peer IP before any mutation, sudo -n only; one bounded correction per failed correctable gate with explicit stop conditions), rollback (smallest affected layer + deterministic inverse), controlling_sources (context packet, plan/goal sections, /opt/tkv-local/servers/<host>/ as historical cross-check only, role TKV path per the AGENTS.md knowledge gate, knowledge/catalog retrieval cited by the governor packet), and deliverable contents (hashes, diffs, outputs, journal, receipt, Task May Proceed line). Carries the MANDATORY second_brain_evaluation block per the standing directive (owner 2026-08-25, AGENTS.md ''Second Brain roadmap integration''): opportunity_identified, roadmap_capability_or_pattern, disposition (implemented | recommended-for-future-iteration | deliberately-deferred), evidence_and_reasoning — all four required in every material work order.'
  inferred_value: 'INFERENCE: this template converts two standing directives from memory into structure — the Second Brain evaluation is now un-omittable, and the askpass read-at-execution boundary is boilerplate the author must strike deliberately rather than forget.'
