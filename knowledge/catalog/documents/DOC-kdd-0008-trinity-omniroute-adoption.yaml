  title: "KDD-0008 — Adopt Trinity as OmniRoute lifecycle engineer — RATIFIED 2026-08-27 (owner decision O1, adopt-as-corrected; OD-02 closed)"
  type: "decision"
  declared_purpose: "Ratified decision record (header: Date 2026-08-27, Status ratified 2026-08-27 — owner decision O1 adopt-as-corrected, Trinity's lane ACTIVE, Layer 1 still requires OD-12 + OD-03; Decider Agent-Zero; related goal 2026-08-27-omniroute-trinity-layer0; drafted Wave 0A as PROPOSED, ratified mid-wave per state log row 5; truth-state: roster/governance/correction claims AUTHORITY, candidate documents CANDIDATE preserved unchanged, option trade-offs INFERENCE labeled). Context: p11 commissioned Layer 0 with Wave 0A producing the Trinity adoption packet; the candidate material is a 1,229-line operating profile plus phased plan (1,268) and control manifest (443) prepared by codex 2026-08-26 against the OmniRoute v3.8.51 corpus; the roster before ratification was kimi-k3, rick, john, carol — Trinity absent (agents/README.md, verified at the M0 gate, state log row 1); the OmniRoute lane was empty and the surface is large (13,098 corpus files, 102 API domains per DOC-tkv-corpus-omniroute). Governor verification found seven candidate-vs-authority conflicts; the reconciliation register (assessment §3, C1-C7) is applied to the drafts, not re-litigated: C1 knowledge root /opt/tkv-local/omniroute rejected — corpus DOC-tkv-corpus-omniroute, catalog canonical (KDD-0005), Carol owns mutations; C2 DeepSeek Harness never existed — KK3-orchestrated subagent sessions (KDD-0006); C3 Cipher/Independent QA map to the p11 verifier contract (deterministic -> Qwen-X ACTIVE M8-signed -> owner); C4 no host firewalls (owner rule 2026-08-26) — LAN 192.168.50.0/24 boundary (BLUEPRINT §5); C5 target host hxs-8 selected by the owner (OD-01; readiness ack OD-03); C6 lane = OmniRoute lifecycle engineering only with explicit exclusions; C7 Coder-X primary execution backend (per-task identity/health verification, stop-and-escalate, no cloud substitution ever) + Qwen-X independent verifier. Honesty limit riding with the adoption: the pinned upstream commit is CANDIDATE-claimed provenance — the corpus is not a git checkout and upstream commit identity is unavailable; the drafts carry it unverified. Options considered: (1) adopt-as-corrected SELECTED — ratify the charter/profile drafts as produced, add trinity to the roster (vertical), record this KDD ratified; (2) adopt-with-changes-specified; (3) defer; (4) reject. Decision: RATIFIED 2026-08-27 — owner decision O1 (the §Decision body preserves the as-presented decision menu; the header records the outcome; state log row 5: owner 'if so I ratify as corrected (O1). You may proceed.'; gate executed — roster row added vertical/active, charter + profile flipped active, KDD flipped ratified, all re-rendered). Ratification activates the LANE ONLY — Layer 1 (any installation or host mutation) still requires separate owner authorization (OD-12) and hxs-8 readiness acknowledgement (OD-03). Consequences — enables: an accountable bounded engineering lane for the traffic plane; Layer 1 design under work orders once authorized; the adoption-gate pattern validated as reusable; the Coder-X execution + Qwen-X verification contract exercised on a standing lane. Forecloses: /opt/tkv-local/omniroute and any duplicate catalog; any DeepSeek Harness dependency; Trinity-instantiated subordinate agents or specialist cells as roster entities; Trinity self-acceptance; unapproved agent-like/memory/workflow/process-spawning feature enablement; cloud-model substitution for Coder-X. Rollback: adoption is reversible — remove agents/trinity/, revert the roster row, flip this KDD superseded or rejected, Carol records the disposition; documentation-only. Revisit if: the owner changes traffic-plane scope, the verifier contract, or the execution-backend designation; OmniRoute agent-like features are proposed (separate decision required); or the corpus identity changes (re-hash per DOC-tkv-corpus-omniroute review_due 2026-09-24)."
