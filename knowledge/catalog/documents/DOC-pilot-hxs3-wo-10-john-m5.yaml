  title: "10-work-order-john-m5.yaml — WO-HXS3-JOHN-M5-001 (hxs-3 M5: tool protocol + one-call-per-turn invariant per KDD-0007, structured output, system-policy, denial, reasoning_strength probe-only; DISCHARGED — milestone complete)"
  type: "work-order"
  declared_purpose: "Delegated contract commissioning john / Esme (session john-m5-hxs3-20260826-01) for hxs-3 milestone M5 — functional validation: execute the owner-ratified M5 quality suites against Meta-X's frozen operating profile (hx-muse-glimmer-64k, digest 9dffb015db40…, ctx 65536, resident Forever) and deliver pass/fail evidence per suite so the M8 sign-off gate has quality grounds (a suite failure is reported, never tuned away). Owner authorizations (owner 2026-08-26, thresholds RATIFIED): tool protocol 100% forbidden/malformed denied AND >=95% schema conformance on valid calls; one-call-per-turn invariant 100% ENFORCED (multi-call responses rejected, ZERO extra executions, accepted calls executed serially — KDD-0007 enforcement contract governs: maximum one tool call per model response, the host-side harness plays orchestrator, the parallel_tool_calls request flag is a compatibility probe only, never enforcement); structured output >=95% schema conformance; system-policy preservation 100%; denial suite 100% denied; reasoning_strength mapping PROBE-ONLY (report what Ollama 0.32.15 actually does — think levels / reasoning parameters, Meta documents low/medium/high/xhigh — measured, never assumed; no bar, no tuning); Phase A native baseline — the model's own defaults, no sampling overrides, no num_predict caps. NOT authorized: baseline changes (drop-in, Modelfile, aliases, units, model store), sampling changes, reboots, recovery drills (M8 scope), endpoint/firewall changes, other models. Boundaries: hxs-5 session, SSH hxsa@192.168.50.202, askpass helper READS the credential from the HX Fleet SSH Access Guide credential-record row at execution time (no extracted copy, helper deleted at task end), hostname + peer IP verified first, sudo -n only, host key pinned (F-05); hxs-3 evidence timestamps are America/Panama (EST, -05:00) — labeled as such; versioned fixtures only (tool_suite.py, fixtures_corpus.py; alias-parameterized with hx-muse-glimmer-64k; /tmp on hxs-3 against 127.0.0.1:11434; sha256sums.txt verified before use); ATEM-format cases per the Meta tooling contract in /opt/tkv-local/agent-zero-docs/pilots/hxs-3/meta/; one-call-per-turn bait cases (multi-need prompts, parallel-bait phrasing — any leaked second call is a FAIL); system-policy adversarial pressure cases (drop/rewrite the tool rules incl. the one-call rule — 100% preserved); thinking content never persisted (counts only), sanitization per profile; one bounded correction per failed correctable case. Rollback: fails closed — evidence preserved, resident model untouched (/api/ps identity guard at close). Deliverable: 12-esme-m5-validation.md — AC-mapped suite report with ratified pass rules, tool-protocol audit totals incl. the one-call-per-turn enforcement table (multi-call baits, rejections, serial-execution proof, zero leaks), structured-output conformance table, system-policy case table, denial totals, reasoning_strength mapping report (labeled probe-only), API readiness re-proof, final /api/ps identity guard, sanitized sequential command log, Task May Proceed receipt. Second Brain evaluation: opportunity identified — tooling-contract validation (the KDD-0007 enforcement class measured on its first backend; feeds the RAG-pipeline tool-agent role); disposition implemented — suite results become Meta-X's quality record at handoff, citable by M8 and by the KK3 orchestration contract."
  inferred_value: "INFERENCE: this is the first measurement of the KDD-0007 enforcement class on a live backend — the one-call-per-turn invariant is an enforcement contract, not a soft metric, so this run proves the harness enforcement (rejections, serial execution, zero leaks) rather than the model's manners; the reasoning_strength probe-only mapping banks the D8 decision material for Meta-X the same way the vision probes bank it for Coder-X."
