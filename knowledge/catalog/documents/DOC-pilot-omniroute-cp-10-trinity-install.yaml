the L1-M3 gate work order (parity ×4 deep, restart ×2, cold reboot, backup+restore drill, rollback drill, configuration.md, owner sign-off package) follows the install landing. second_brain_evaluation: per the work order — first traffic plane, first secrets-design deployment."
