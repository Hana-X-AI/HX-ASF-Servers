document:
  id: "DOC-kdd-0006-hxs2-coderx-backend-adoption"
  title: "KDD-0006 — Adopt the hxs-2 CoderX coding-inference backend pilot (PILOT-HXS2-CODERX-BACKEND-001)"
  type: "decision"
  declared_purpose: "Ratified decision (header: Date 2026-08-26, Status ratified, Decider Agent-Zero; related goal 2026-08-26-hxs2-qwen36-coderx-backend): adopt PILOT-HXS2-CODERX-BACKEND-001 — provision hxs-2 with mannix/qwen3.6-27b-a3b-coderx:vision-Q4_K_M (exact tag + full local digest as identity), validated per the hxs-1 playbook (closed PASS at M8 2026-08-26 — pattern source, second validated use), exposed via a LAN-scoped endpoint (192.168.50.0/24 allowlist, D2), and registered in the Second Brain catalog as the discoverable backend-capability of record. Closes the DeepSeek Harness premise as verified-nonexistent (verification found no deployed Harness anywhere; owner confirmed 2026-08-26 it has never existed — the directive premise was an easter egg; any future Harness-era registration out of scope). Resolves the model-identity question: the directive's literal …-coder: tag and the supplied knowledge reference's …-coderx family exist as DIFFERENT checkpoints (Coder sibling top-10, pure expert-selection prune; CoderX top-8, REAP/DERN redistribution prune) — owner selected CoderX (D3). Options: (1) proceed Harness-free with the Second Brain catalog as capability registry (selected — maps to KDD-0005's canonical catalog, zero new infrastructure); (2) provision-only with no registration (rejected — undiscoverable backend, consumer-proof unproven); (3) defer until a Harness exists (rejected — not on any approved near-term roadmap). Consequences: enables second validated inference host + catalog backend-capability record class (Second Brain 'act' stage); forecloses Harness dependency, the Coder sibling for this pilot, exposure beyond LAN, cross-model quality transfer (CX-R13). Revisit if a real DeepSeek Harness is ever commissioned or the owner changes the exposure boundary. Owner decisions D1-D8 are recorded in the goal file."
