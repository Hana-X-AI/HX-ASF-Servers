  title: "KDD-0005 — Second Brain canonical home is the HX-ASF-Servers repository"
  type: "decision"
  declared_purpose: "Ratified decision (header: Status ratified, Date 2026-08-25, Decider Agent-Zero; state log row 56, recommendation R1 of the Second Brain guidance assessment): the canonical Second Brain home is knowledge/catalog/ in the HX-ASF-Servers repository — versioned, review-gated, backed up to GitHub. /opt/tkv-local remains referenced source corpus (server records, knowledge trees) that the catalog points to, never the catalog's home. Answers the guidance document's open decision G-01 adapted: its /opt/tkv-local recommendation is rejected in favor of the as-built repo home. Forecloses any catalog migration to /opt/tkv-local and any second catalog root (the guidance document's own 'never both' rule). Revisit only if the repository's own role changes."
