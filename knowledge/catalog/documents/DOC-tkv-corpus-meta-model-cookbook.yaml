document:
  id: "DOC-tkv-corpus-meta-model-cookbook"
  title: "/opt/tkv-local/meta-model-cookbook-main — Meta Model API cookbook snapshot (official Meta model cookbook; 434 files)"
  type: "corpus"
  declared_purpose: "Upstream snapshot of the official Meta model cookbook per its README ('Meta Model API cookbook — Recipes for building agents and coding tools on the Meta Model API, covering API fundamentals, agent patterns, and end-to-end use cases'): Meta Model API is drop-in compatible with the OpenAI SDK, the Anthropic SDK, and agent CLIs like OpenCode and Claude Code; each recipe is a self-contained, copy-paste starting point that proves a capability; the cookbook's default model is Muse Spark (muse-spark-1.1, 1,048,576-token context). Four sections: 01_api_fundamentals (chat completions, streaming, tool/function calling, structured output, …), 02_agent_patterns (loop basics, interleaved reasoning, context management, validated edits, alert fatigue), 03_use_cases (end-to-end), 04_muse_code (the muse_code series — append-only audit log, deterministic replay, staged approvals, contained execution, immutable guardrails, subagent fanout, goal tracking, bundled skills, loop and cron, side chats)."
  inferred_value: "INFERENCE: the worked-implementations complement to the three Meta doc captures — where tooling.md states the contract, these notebooks show the contract in running code (tool-calling loop in 01, agent-loop patterns in 02, and the muse_code agent-architecture series in 04, whose audit-log/staged-approvals/immutable-guardrails patterns are directly relevant to the factory's own agent governance design). Content targets the hosted API; against the local Ollama artifact every recipe is a pattern to adapt, never a configuration to copy."
