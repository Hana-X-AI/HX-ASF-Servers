abled:false (the code default is TRUE — the sharpest default found), skillsEnabled:false, mcpEnabled:false, a2aEnabled:false, memoryEnabled:false, tailscaleEnabled:false — plus OMNIROUTE_DISABLE_BACKGROUND_SERVICES=true in the unit env; behavioral probes (MCP 503, A2A disabled-error, plugins/skills empty, embedded services not_installed, no tunnel binaries, conductor unset, background jobs absent from the boot-B journal); O1 tripwire :cloud sweep zero (the boot-A 'Synced … to cloud' line proven cosmetic — CLOUD_URL unset early-return, zero egress, boot B clean). §9 backup (OD-09): plaintext SQLite snapshots via better-sqlite3 online backup API + integrity_check hard gate + single-file journal_mode=DELETE + prune keep-20, on a versioned systemd timer (daily 03:17 UTC, Persistent) — the in-process scheduler is collateral of the background-services kill switch (instrumentation-node.ts:588), so the schedule moved to the native HX shape; product --cloud/encryption treated as nonexistent; drill 2 snapshots PASS, timer enabled. §10 L1-gate evidence: direct-vs-routed parity BYTE-IDENTICAL ×3 (Qwen-X/Coder-X/Meta-X — same shape/finish/content/usage, content 42 stop; usage_history holds exactly the 3 routed calls with token/latency/api-key attribution); layered health surface verified; service-restart routing-intact (restart ~17:21Z, active, healthz 200 within 12 s, 4 connections, routed Qwen-X identical, posture effective); cold reboot deferred to L1-M3 (the gate's own acceptance test — unit enabled + ordering + READY semantics established here). §11 pre/post hashes + documented one-command-class inverses for every change (no rollback needed; make/g++ installed anticipating node-gyp, proved unnecessary, REMOVED 17:26Z — host package state restored). §12 observations: stateless management JWTs (logout client-side only — recorded for the owner), Chat-X test_status display quirk (upstream SEV-4), env-validator inconsistency, build tree retained as L1-M3 evidence/cache, residual