  id: "DOC-blueprint-llm-server"
  title: "servers/BLUEPRINT-llm-server.md — LLM Server Configuration blueprint (hxs-1 proven; hxs-2 at its M8; owner standing instruction 2026-08-26)"
  type: "contract"
  declared_purpose: "Standing configuration blueprint for every HX LLM-server deployment, ratified as durable governance by owner standing instruction 2026-08-26 ('Going forward you have a blueprint hxs-1 and soon hxs-2 as it pertains to LLM server configuration; some LLM server configuration will have a direct impact on how other ecosystem components are configured during deployment' — hxs-2 state log row 3): deployments follow it instead of re-deriving configuration. Seven planes: §1 identity (registry assigns role; model identity = exact tag + full digest frozen at acceptance; hx-<model>-<ctx>k alias naming; native-defaults baseline sampling per the A01 rule), §2 OS (Ubuntu 24.04 HWE, driver 580.173.02 retain-and-validate with DKMS, suspend targets masked, Secure Boot disabled standing, Wi-Fi rfkill soft block with systemd-rfkill persistence, model store root ext4), §3 service (Ollama pinned; ollama.service + ollama-preload.service; preload contract 208 s probes + --max-time 300 single-attempt load + 30 s assertion = 538 s worst case < TimeoutStartSec=600 < 900 s D5; OLLAMA_NO_CLOUD=1; NUM_PARALLEL=1, MAX_LOADED_MODELS=1), §4 context (ladder on the exact digest; /api/ps context_length is the proof), §5 exposure AS AMENDED 2026-08-26 (fleet-scoped LAN: OLLAMA_HOST=0.0.0.0 with loopback preserved; the private LAN 192.168.50.0/24 itself is the boundary — NO host firewalls anywhere on HX hosts per the owner rule; supersedes the original loopback-only posture and the brief same-day ufw enablement, reverted), §6 recovery (D5 SLO detect <= 2 min / recover <= 15 min; smallest-layer rollback), §7 validation (alias-parameterized fixtures; restart + 3 cold reboots). §8 DOWNSTREAM-CONSUMER CONTRACT (deployment-shaping): ecosystem components (gateways, routers, agent presets, clients) MUST configure from §8 and the live catalog record — endpoint http://<host-ip>:11434 reachable only from the /24 with no service-layer auth, alias-only model reference (never upstream tags, never :latest), clients do NOT send num_ctx, never send keep_alive:0, timeouts connect 5 s / read 900 s / first-content 240 s for extended profiles, serialized concurrency, thinking ON default, vision only where qualified, and registration of every LLM server as a backend-capability record in the Second Brain catalog (the catalog is the capability registry, KDD-0005/0006). §9 change management: blueprint-level changes are versioned work orders; the blueprint updates at each LLM-host sign-off (hxs-2 at its M8) and per consumer-integration lesson. Governor-maintained."
  inferred_value: "INFERENCE: this is the factory's first cross-host configuration standard — the point where the hxs-1 pilot's proven state stops being pilot evidence and becomes fleet governance; its §8 makes the catalog a load-bearing runtime dependency for consumers (endpoint resolution from catalog records), which raises the catalog's freshness requirements for every registered backend."
