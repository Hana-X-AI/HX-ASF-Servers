notes:
  typing_rationale: "Typed contract (dispatch brief allowed runbook-or-contract by judgment): the blueprint binds future deployments and downstream consumers ('MUST configure from this section', §8 is itself named a contract) and is ratified as durable governance — same class as the server records contract (DOC-tkv-servers-records-contract), distinct from a how-to runbook such as DOC-hxs2-coderx-knowledge-reference. status active (standing), authority_level ratified-governance per the owner standing instruction (dispatch F-AUTH-1 convention confirmed for goals at hxs-2 state log row 6)."
  amendment_history: "Born amended: §5 carries the 2026-08-26 owner-rule amendment in the initial cataloged revision — fleet-scoped LAN boundary, no host firewalls; the original loopback-only posture (hxs-1 SC-07) and the brief same-day ufw enablement (hxs-1 log rows 72-73) are recorded as superseded/reverted inside the source itself. SECOND amendment (this run): the governor added the §8 'Fleet capability call-signs' block + alias table with the owner conventions 'capability-level call-sign resolved through its Second Brain backend-capability record — never a bare Ollama tag', 'status candidate until the host's M8 sign-off', and 'the X in a call-sign is always capital' — VERIFIED PRESENT at re-hash (afa46a2c… → 1c22749a…; hxs-2 state log row 10 + hxs-3 state log row 4 record the owner directive; applies_to.hosts extended to hxs-3 accordingly). THIRD amendment (mid-run, governor edit 2026-08-26T05:47Z): the §8 table gained a FOURTH row — Chat-X = hxs-4 (192.168.50.203), basic chat utility, qwen3.5:9b-q4_K_M (digest 6488c96f…, Ollama 0.32.9), loopback-only today, owner-provisioned and working 2026-08-26, blueprint-alignment items (0.32.15 pin, preload/persistence, LAN posture, qualification) deferred to a future owner decision; the Provenance line was reworded in the same edit — re-hashed again (1c22749a… → 51825990…). The three dispatched call-sign records are cataloged this run (DOC-backend-qwen-x / DOC-backend-coder-x / DOC-backend-meta-x) and referenced above; the Chat-X row's own record is NOT in this run's dispatch scope — flagged for a follow-up registration wave (receipt flag F-CHATX-1; the §8 every-server-carries-a-record rule is 3/4 materialized). FOURTH amendment (post-0608Z, governor edit — re-validated 2026-08-26T06:31Z T-micro): the §8 alias table gained the 'Catalog record' record-ID column — the Qwen-X / Coder-X / Meta-X rows now carry their DOC-backend-qwen-x / DOC-backend-coder-x / DOC-backend-meta-x ids, and the Chat-X row's record cell reads 'record queued (governor brief — owner-provisioned, not pilot-track)' — VERIFIED PRESENT at re-hash (51825990… → ce0cabf0…). The queued Chat-X record is registered in the same T-micro run as DOC-backend-chat-x (status ACTIVE by owner provisioning, authority owner-directive, NOT pilot-track) — F-CHATX-1 CLOSED; the §8 every-server-carries-a-record rule is now 4/4 materialized. FIFTH amendment (post-0637Z, governor edit — re-validated 2026-08-26T06:46Z this run): the §8 Chat-X record cell advanced from 'record queued' to the live id 'DOC-backend-chat-x (active — owner-provisioned, not pilot-track)' — VERIFIED PRESENT at re-hash (ce0cabf0… → 88c1b85a…); the §8 'Catalog record' column is now fully live 4/4. NOTED in the same re-hash: the Meta-X row's alias cell still reads 'hx-muse-glimmer (planned at M4)' though hxs-3 M4 completed 2026-08-26 (state log row 10) — governor-side blueprint edit flagged in this run's receipt (originals are sacred; no Carol edit). SIXTH amendment (governor edit — re-validated 2026-08-26T10:00Z this run, T-standard ladders/profiles wave): the §8 alias table now carries the FROZEN PROFILE ENTRIES on every row — Coder-X 'hx-qwen3.6-coderx-64k operating (resident); -32k baseline; -128k extended (all frozen 2026-08-26, needle-proven)' (source line 85), Meta-X 'hx-muse-glimmer-64k operating (resident); -32k baseline; -128k extended (all frozen 2026-08-26, needle-proven)' (line 86), Chat-X 'hx-qwen3.5-9b-64k default reference; -32k baseline (**A-1: needle-proven to 89.5% — thinking-model headroom, not ~95%**); -128k extended (frozen 2026-08-26)' (line 87) — VERIFIED PRESENT at re-hash (5062b208… → df59d340…; the Qwen-X row already carried its M6b profile set). Closes receipt flag F-B11-1 (the queued blueprint re-hash); the four backend records are re-hashed/updated in the same run. SEVENTH amendment (governor edit — review batch 12, hxs-2 state log row 23, 2026-08-26T09:55Z; re-validated 2026-08-26T10:38Z this run after live drift mid-execution): §5 gained the 'Web search vs cloud models — the honest enforcement shape' block (source lines 58–76 — VERIFIED PRESENT): web search enabled fleet-wide (owner decision; NO_CLOUD removed), disable_ollama_cloud server.json surface VERIFIED ABSENT live (standing rule: inspected at every future cloud-state change, any modification needs owner authorization + rollback documentation), NO config-level flag exists that permits web search while denying cloud-model remote inference (NO_CLOUD is the only class switch — envconfig/config.go:330; :cloud gating is name-suffix filtering), enforcement = (1) store policy (any :cloud tag in a store/record/list = automatic finding + escalation) + (2) process (any cloud pull/run needs an explicit owner-directed work order, journaled) + the named residual (the LAN-open API incl. /api/pull has no caller authz — monitoring is the tripwire until an authenticating gateway, owner decision). Re-hash df59d340… → 51ec3d53…; the §3/§7 'OLLAMA_NO_CLOUD=1' mentions remain in the source text with §5 carrying the web-search-class supersession (verified, provenance preserved — originals are never rewritten by the catalog lane). The §8 profile-entry rows (sixth amendment) verified UNCHANGED at this re-hash (lines 85–87). EIGHTH amendment (governor edit — ACCEPT wave per the owner verdict 'Meta-X is accepted into production', hxs-3 state log row 26, 2026-08-27T02:31Z; re-validated 2026-08-27T03:20Z this run): the §8 Meta-X row's catalog-record cell flipped to 'DOC-backend-meta-x (**ACTIVE**, M8-signed 2026-08-27)' (source line 106 — VERIFIED PRESENT); the row's host/role/endpoint/alias cells unchanged. Re-hash 51ec3d53… → e11110d1…. The governor re-rendered the HTML sibling in the same wave (render --check in sync at this run's validate.py close)."
  callsign_convention: "Fleet capability call-signs (owner, 2026-08-26, blueprint §8): every LLM backend carries a capability-level call-sign resolved through its Second Brain backend-capability record — never a bare Ollama tag (the hxs-1 bare-alias ambiguity lesson). The X in a call-sign is ALWAYS capital. Consumers address backends by call-sign and resolve endpoint + profile + limits from the catalog record behind it (§8: 'Consumers address backends by call-sign and resolve endpoint + profile + limits from the catalog record behind it.')."
  downstream_consumer_contract: "§8 noted per dispatch: it is the deployment-shaping surface for gateways/routers/agent presets/clients; consumers resolve endpoints from catalog backend-capability records — the catalog-as-registry role (KDD-0005/0006) makes this document's freshness operationally significant. Re-validation 2026-08-26T06:05Z: the registration line ('every LLM server carries a backend-capability record in the Second Brain catalog… the catalog is the capability registry') is materialized for the three dispatched fleet backends (the three DOC-backend-* records registered this run, referenced above); the fourth §8 row (Chat-X, hxs-4 — added mid-run at the 0608Z wave) is registered 2026-08-26T06:31Z as DOC-backend-chat-x (T-micro) — F-CHATX-1 closed, 4/4 materialized. Re-validation 2026-08-26T06:31Z: the §8 'Catalog record' record-ID column VERIFIED PRESENT — the three fleet rows carry their DOC-backend-* ids and the Chat-X cell reads 'record queued' (resolved by this registration). Re-validation 2026-08-26T06:46Z (this run): the Chat-X cell now carries the live id DOC-backend-chat-x (VERIFIED PRESENT at re-hash ce0cabf0… → 88c1b85a…) — the §8 record-ID column is fully live 4/4."
  cloud_enforcement_o1: "OWNER DECISION 2026-08-26 (review batch 12, hxs-2 state log row 23 — the receipt-1045Z flag F-LP-5 enforcement-depth question DECIDED: O1 monitor + process): the fleet cloud-model enforcement model is (1) STORE POLICY — no :cloud tag is ever pulled, created, or aliased; any :cloud appearance in a store, a catalog backend record, or ollama list output is an AUTOMATIC FINDING with escalation; (2) PROCESS — pulling or running any :cloud model is an operator-level action requiring an explicit owner-directed work order, journaled at the host; (3) NAMED RESIDUAL — the LAN-open Ollama API (including /api/pull) has no caller authorization, so a LAN client could attempt a cloud pull; the monitoring rule is the tripwire and NO authenticating gateway is commissioned (O2 not taken; O3 explicit allow-both not taken). Embodied in blueprint §5 'Web search vs cloud models — the honest enforcement shape' (VERIFIED PRESENT this run, source lines 58–76); web-search queries themselves leave the LAN to Ollama's cloud by owner acceptance. Catalog-lane consequence: every DOC-backend-* capability record carries the no-:cloud invariant — any future catalog record citing a :cloud tag trips the automatic finding + escalation rule."
