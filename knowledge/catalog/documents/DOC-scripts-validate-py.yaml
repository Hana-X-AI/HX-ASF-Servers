document:
  id: DOC-scripts-validate-py
  title: scripts/validate.py — single local validation command (ratified UD1 validation contract; UD2 bounded implementation)
  type: runbook
  declared_purpose: 'The ratified single read-only repo-root validation command (owner decisions UD1/UD2 2026-08-25, state log row 60; unified recommendations U1/U2). One command runs every mechanized check the factory has ratified and honestly labels the checks that remain human judgment as MANUAL GATE lines. Consolidates four check families: wiki-sync (render.py --check hash synchronization), fixture-suite (pilot fixtures regression tests + sha256 manifest verify), catalog-mechanical (CAT-01/03/04/07/08 per knowledge/catalog/tests/cat-001-acceptance.md), and secret-boundary (generic high-signal secret patterns, tuned so prose does not match). MANUAL GATE lines (noted, never graded): CAT-10..15 golden questions, CAT-20..22 judgment checks, CB-01 write-set audit, and the literal-credential sweep against the protected ssh-info file (governor-only; the command NEVER reads protected credential material). Read-only contract: never writes/formats/renders/catalogs; child Python runs with -B and PYTHONDONTWRITEBYTECODE=1; sha256sum -c verify-only; catalog/YAML opened read-only. Exit codes: 0 all mechanized PASS, 1 any FAIL, 2 usage error. Usage: validate.py (full repo) | validate.py --changed PATH [PATH..] (scoped: wiki manifest member -> wiki-sync; fixtures file -> fixture-suite; knowledge/catalog/** -> catalog-mechanical; anything else -> secret sweep on that file). Hook rule: hooks (U3 advisory, U5 secret-boundary, any future gate) MUST call this command rather than reimplementing checks. Deterministic: same tree, same result. Sub-checks added 2026-08-30 inside governance-path, keeping the top-level count at 5/5: SY-5 hook manifest vs live registrations (KDD-0023), SY-6 skill registry and AGENTS.md inventory reconciliation, SY-7 work-order schema and addressability (O2), and SY-8 catalog freshness — each record''s recorded sha256 compared to its live source. SY-8 closes a gap that had made 5/5 misleading: catalog-mechanical verified schema, index 1:1, relations and location existence but never compared a record to its source, so 40 in-repo records had drifted from their files while the validator reported PASS. SY-8 fails on new drift and carries the 35 pre-existing ones as a declared, shrink-only backlog in governace/catalog-freshness-baseline.yaml, because re-minting all of them at once would refresh hashes without checking that each record''s prose still describes its file. SY-9 (O8) added the same day: capability lifecycle enforcement over governace/capabilities/registry.yaml, which keeps installed / service_active / advertised_to_agents / approved_for_use as four separate fields rather than one status. It fails on invariants inside the registry (a held capability advertised, a service active without being installed, an approval without a completed security review) and REPORTS contradictions with records outside it — an MCP hold that an owning agent''s charter never mentions, an owning agent with no registration — because choosing between two ratified records is a governor act, not a mechanical one. Secret patterns reconciled 2026-08-30 (O6) with scripts/hooks/secret-boundary.sh, which they had diverged from on four of five rules. This implementation was the broader one, is already blocking in CI, and produced ALL THREE recorded false positives — twice forcing an append-only state log to be edited in place to clear the gate (DSH row 5, OMNIROUTE row 40). Two narrowings, both proven against governace/secret-boundary-corpus.yaml: the Slack rule now requires a token body rather than matching the bare xox prefix, and the password rule is a separate check that judges the VALUE — a live-looking value carries a digit or punctuation or is at least 16 characters — with the sanitizing-word allowance tested against the VALUE ONLY. The allowance was briefly applied to the whole line during this change, which meant a real credential sharing a line with the word REDACTED went unreported — an allowance is a way to mark a value sanitized, never a way to exempt a line, and corpus case `live-password-beside-an-allowance-term` pins that. Repo-wide differential over 1384 files: the narrowing loses exactly two hits, both of them comments inside the two scanners describing the false-positive class, and the new scanner reports zero hits. Stated bound: an all-lowercase passphrase under 16 characters with no digit or punctuation is not caught by the generic net.'
  inferred_value: 'INFERENCE: this command is now the cheapest complete mechanical self-check for a Carol run (catalog-mechanical + secret-boundary cover CAT-01/03/04/07/08 and the generic half of CAT-05); the literal-credential half of CAT-05 and the CB-01 write-set audit stay governor judgment by design — the catalog cannot self-certify those.'
