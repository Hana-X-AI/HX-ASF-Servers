document:
  id: "DOC-scripts-validate-py"
  title: "scripts/validate.py — single local validation command (ratified UD1 validation contract; UD2 bounded implementation)"
  type: "runbook"
  declared_purpose: "The ratified single read-only repo-root validation command (owner decisions UD1/UD2 2026-08-25, state log row 60; unified recommendations U1/U2). One command runs every mechanized check the factory has ratified and honestly labels the checks that remain human judgment as MANUAL GATE lines. Consolidates four check families: wiki-sync (render.py --check hash synchronization), fixture-suite (pilot fixtures regression tests + sha256 manifest verify), catalog-mechanical (CAT-01/03/04/07/08 per knowledge/catalog/tests/cat-001-acceptance.md), and secret-boundary (generic high-signal secret patterns, tuned so prose does not match). MANUAL GATE lines (noted, never graded): CAT-10..15 golden questions, CAT-20..22 judgment checks, CB-01 write-set audit, and the literal-credential sweep against the protected ssh-info file (governor-only; the command NEVER reads protected credential material). Read-only contract: never writes/formats/renders/catalogs; child Python runs with -B and PYTHONDONTWRITEBYTECODE=1; sha256sum -c verify-only; catalog/YAML opened read-only. Exit codes: 0 all mechanized PASS, 1 any FAIL, 2 usage error. Usage: validate.py (full repo) | validate.py --changed PATH [PATH..] (scoped: wiki manifest member -> wiki-sync; fixtures file -> fixture-suite; knowledge/catalog/** -> catalog-mechanical; anything else -> secret sweep on that file). Hook rule: hooks (U3 advisory, U5 secret-boundary, any future gate) MUST call this command rather than reimplementing checks. Deterministic: same tree, same result."
  inferred_value: "INFERENCE: this command is now the cheapest complete mechanical self-check for a Carol run (catalog-mechanical + secret-boundary cover CAT-01/03/04/07/08 and the generic half of CAT-05); the literal-credential half of CAT-05 and the CB-01 write-set audit stay governor judgment by design — the catalog cannot self-certify those."
