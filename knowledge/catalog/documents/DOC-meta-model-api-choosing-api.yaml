document:
  id: "DOC-meta-model-api-choosing-api"
  title: "api.md — Meta Model API 'Choosing an API' (Responses vs Chat Completions vs Messages; upstream capture, agent-zero-docs/pilots/hxs-3/meta/)"
  type: "runbook"
  declared_purpose: "Meta's official API-selection doc (front matter: title 'Choosing an API — Meta Model API', description 'Compare the Responses, Chat Completions, and Messages formats on Meta Model API — same models, same auth, same cost — and pick the one your code already speaks', cms alias /model-api/docs/protocols): Model API speaks three request formats over the same models, the same bearer-token auth, and the same per-token cost. Responses API (POST /v1/responses) — the recommended default for new work: OpenAI-compatible, full feature set, cross-turn reasoning replay (stateless encrypted items or server-managed previous_response_id), search grounding, tool search, background execution, file inputs; reach for it for agentic/coding workloads where reasoning continuity across tool turns matters. Chat Completions (POST /v1/chat/completions) — the classic OpenAI messages-array endpoint; simplest drop-in; does NOT carry reasoning across turns for external keys; search grounding runs on Responses only; function-tool calling fully supported. Messages API (POST /v1/messages) — an Anthropic Messages-compatible wire format over the same inference pipeline; for Claude-oriented tools and the Anthropic SDK (base host https://api.meta.ai — the SDK appends /v1/messages); stateless, replay history client-side. Selection guidance: agent or coding workflow → Responses; existing OpenAI chat.completions code → Chat Completions, move to Responses when reasoning replay or grounding is needed; Claude Code / Anthropic SDK → Messages."
  inferred_value: "INFERENCE: for the hxs-3 pilot this is the format-map that tells the M5/M6 contract-suite designers which upstream behaviors are format-dependent (cross-turn reasoning continuity is a Responses-API feature; Chat Completions does not carry reasoning across turns) — which of these contracts the local Ollama artifact reproduces is an M5/M6 probe question, never assumed (state log row 3 nuance registration)."
