non_negotiables_enforced_this_phase:
  - no install/start/deploy of OmniRoute
  - no package/build/migration/compose/container/service-start commands
  - no host/runtime/service/network/DNS/TLS/credential/database/backend mutation
  - no OmniRoute management or inference endpoint created
  - no remote providers or provider credentials
  - no workload on hxs-cp; no hxs-8 substitution
  - no Trinity-active before the adoption gate (gate executed 2026-08-27, O1)
  - no provenance claims beyond content-sensitive proof
  - no duplicate knowledge authority; no /opt/tkv-local/omniroute
  - no OmniRoute agent-like/memory/process-spawning enablement
  - no cloud models or remote inference; no secrets in any artifact or model context
  - no Layer 1 without a new explicit owner authorization
  - source snapshot read-only throughout; candidate originals preserved unchanged
