hx_authority:
  human_authority: Agent Zero
  logical_orchestrator: KK3
  execution_substrate: KK3-orchestrated subagent sessions
  traffic_plane: OmniRoute (bounded; never an orchestrator or knowledge authority)
  omniroute_steward: trinity (owner-ratified 2026-08-27, KDD-0008 O1)
  knowledge_steward: carol (catalog at knowledge/catalog/ — the only knowledge authority)
  execution_backend: Coder-X (owner-designated; per-task identity/health verification; stop-and-escalate; no substitution, no cloud)
  independent_verifier: Qwen-X (ACTIVE, M8-signed; producer host != verifier host always)
  forbidden_authority_transfer:
    - OmniRoute must not replace KK3 orchestration.
    - OmniRoute agent, conductor, pipeline, cloud-agent, or sidecar features must not self-authorize work (disabled-by-default; 8 BLOCKED ledger entries).
    - OmniRoute memory and context connectors must not replace Carol or the catalog.
    - No host firewalls anywhere (owner rule); exposure boundary is the 192.168.50.0/24 LAN plus service authN/authZ.
    - No cloud models or remote inference for any program work (local-model-first rule).
    - No second Second Brain, catalog, work-state registry, or knowledge authority.
    - No /opt/tkv-local/omniroute knowledge root.

