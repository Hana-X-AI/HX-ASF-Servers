  scope_read_only_validate:
    - "Driver health (D3): nvidia-smi, NVRM/Xid scan in kernel journal, dkms status, driver package origin and holds"
    - "Acceleration branch (R-003): confirm no ROCm or conflicting acceleration stack is present"
    - "PCIe topology/link width-speed and per-GPU power/thermal baseline (plan 5.2, R-017)"
    - "GPU device nodes (/dev/nvidia*) permissions and the render/video group model, as the basis for the future ollama service-user access check (R-014); the ollama user is created by Esme's installer at M4 — do not create users"
    - "Time sync, DNS, storage mount ordering, network-online behavior, firewall state and persistence (plan 7.1 item 7)"
    - "CPU governor, memory/swap, hugepage, memlock, and swappiness baselines (plan 7.2: measure and report only)"
    - "Model volume (D1, R-013): root ext4 capacity; default Ollama model path /usr/share/ollama/.ollama/models — expected ownership and capacity posture; no storage changes"
    - "Current ulimits / file-descriptor posture for the future service (plan 7.2; no change)"
  scope_authorized_change_exactly_one:
    - "Disable suspend/hibernate per plan 7.1 item 6 (approved via D4): systemctl mask suspend.target hibernate.target hybrid-sleep.target suspend-then-hibernate.target. Capture before/after state, unified-diff-equivalent evidence, validation that all sleep targets are masked, and the exact inverse procedure (unmask). Reversible; no reboot required."
  prohibited_actions:
    - "any reboot (each reboot is individually owner-approved; none in M2)"
    - "driver, kernel, DKMS, or bootloader changes"
    - "storage, partition, filesystem, or mount changes"
    - "package installs, removals, or upgrades"
    - "sysctl, hugepages, memlock, swappiness, CPU governor, or NVIDIA persistence-mode changes (baseline and RECOMMENDATION only)"
    - "firewall rule changes (state validation only)"
    - "enabling Secure Boot (standing directive D2)"
    - "ROCm installation or any second acceleration stack"
    - "user/group creation or permission mutation (analysis only)"
    - "anything outside this work order — use profile section 14 escalation"
  sudo_note: "Prefer unprivileged probes. sudo is permitted only where a read-only probe requires it and for the authorized mask change; if sudo prompts for a password, use the askpass pattern (sudo -A) — the secret is never printed, logged, or stored. If sudo cannot be used under these constraints, do not improvise: record the exact proposed commands in the handoff as PROPOSED and continue read-only."
