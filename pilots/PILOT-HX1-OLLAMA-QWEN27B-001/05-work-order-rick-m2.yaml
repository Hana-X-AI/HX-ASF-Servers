    - "D2: Secure Boot stays disabled, now and always (standing directive in AGENTS.md); record state, never enable"
    - "D3: retain-and-validate NVIDIA driver 580.173.02; no driver change"
    - "D4: M2 approved — proceed under this work order"
  authoritative_inputs:
