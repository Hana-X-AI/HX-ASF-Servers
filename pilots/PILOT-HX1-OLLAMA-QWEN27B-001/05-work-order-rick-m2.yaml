    - "08-rick-risk-handoff.md — signed risk-categorized handoff to Esme per plan 7.1 item 10: values, files, commands, evidence paths, risks, rollback; dispositions for R-002, R-003, R-004, R-005, R-013, R-014, R-015, R-016, R-017 and any new risks found"
