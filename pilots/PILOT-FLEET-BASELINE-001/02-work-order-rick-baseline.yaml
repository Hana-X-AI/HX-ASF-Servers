tasks_per_fresh_host:
  - identity + OS (Ubuntu 24.04) + kernel + uptime; record against TKV discovery (drift = REPORT, both values kept)
  - scripts/fleet/fleet-verify-baseline.sh <host> (standards-as-data verdicts)
  - NTP: check; where drifted from the standard (Etc/UTC + time.cloudflare.com) apply scripts/fleet/fleet-ntp-pin.sh <host> --apply (SANCTIONED MUTATION class 1; mktemp staging, diff review, timesyncd restart only)
  - sleep targets: check 4-target mask set; align via scripts/fleet/fleet-sleepmasks.sh where drifted (SANCTIONED MUTATION class 2)
  - scripts/fleet/fleet-selftest.sh run (library self-check stays green)
  - refresh /opt/tkv-local/servers/<host>/pre-work-results.md (dated re-verification section; discovery.md drift notes where found)
  - hxs-6 ONLY: record Secure Boot state (expected ENABLED per owner flag) — RECORD, never change; BIOS is an owner decision

tasks_per_reverify_host:
  - quick sweep: identity, NTP sync state vs standard, mask state, selftest — confirm green; drift = REPORT (no mutation unless the drift is in a sanctioned class, then fix + record)

boundaries:
  read_only: everything except the two sanctioned mutation classes
  stop_and_escalate: any other mutation need; any credential anomaly; any host showing signs of active production workload that a mask/NTP restart could disturb (record + skip that mutation, verdict REPORT)
  secrets: askpass pattern from the credential record (awk on the SSH-password row); helper 0700, deleted at end; NO secret value in any artifact/log/receipt/model context; sudo -n where prepared, else record
  failure: per-host failure → record FAIL/REPORT for that host, CONTINUE the wave; systemic failure (library defect, auth failure on 2+ hosts) → STOP, escalate to governor
  transient_retry: 1/1 per operation
  model: local only (Qwen-X); failure → escalate to governor, no cloud fallback

deliverables:
  - servers/2026-08-27-fleet-baseline-wave.md — evidence + per-host verdicts + full command log (shape of the 08-26 pass doc)
  - refreshed /opt/tkv-local/servers/<host>/pre-work-results.md per fresh host
  - pilot state-log rows for governor handoff (summary verdicts per host)

acceptance:
  - every in-scope host carries a verdict: PASS / REPORT (with declared direction) / FAIL (with evidence)
  - both sanctioned mutation classes verified post-apply (re-check green)
  - zero secret values in any artifact
  - handoff to governor with receipt-style summary
