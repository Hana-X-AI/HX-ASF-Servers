# catalog-freshness-baseline.yaml — the drift that already existed (SY-8)
#
# SY-8 compares each catalog record's recorded sha256 to its live source. On the
# day the check was written, 35 in-repo records had already drifted while
# `validate.py` reported 5/5 PASS — the catalog check had never compared a
# record to its source.
#
# Failing all 35 at once would have made the validator red until someone
# re-minted every one of them, and a re-mint updates the hash WITHOUT reviewing
# whether the record's prose still describes the file. That would produce
# records that look current and are not, which is worse than the drift.
#
# So the check binds immediately on NEW drift and carries these as a declared
# backlog. The list only shrinks: removing an id means the record was genuinely
# reconciled. Adding one is a visible diff that has to be argued for.
#
# To clear an entry: read the record against its source, correct the prose if it
# has gone stale, `carol-mint re-mint <id>`, then delete the line here.

baseline_date: 2026-08-30
count: 35
grading: >-
  Records listed here are REPORTED by SY-8, not failed. Any in-repo drift NOT
