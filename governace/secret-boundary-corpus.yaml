# secret-boundary-corpus.yaml — the cases the scanners must and must not flag (O6)
#
# WHY THIS EXISTS
# Graduating scripts/hooks/secret-boundary.mode from `warn` to `block` makes one
# hook able to stop a write mid-session. That is only safe with evidence about
# its false-positive rate, and no such evidence existed — the mode file said
# "pilot week; then block" since 2026-08-25 and nothing measured anything.
#
# THREE FALSE POSITIVES ARE ON RECORD, ALL FROM PROSE ABOUT CREDENTIALS
#   1. servers/hxs-3/configuration.md:107 — password-assignment prose. Turned CI
#      red four times (DSH state-log row 5).
#   2. gordon/phase-a/gordon_util.py:75 — a comment describing the scanner's own
#      password-assignment family (DSH rows 16, 20). Owner approved a reword.
#   3. PILOT-OMNIROUTE-LAYER0-001 state-log row 40 — an owner directive clause in
#      assignment-style prose.
#
# The third is the one that matters most: an APPEND-ONLY state log had to be
# edited in place to clear the gate. DSH row 5 records the same outcome and says
# why restoring the original is not possible — "it would re-trip the gate". A
# scanner false positive forced a governance violation twice.
#
# WHY THE TRIGGER TEXT IS BASE64
# A corpus of things that look like credentials is itself full of things that
# look like credentials. Stored as plain text this file would trip both scanners
# on every run, and the only fixes would be to exempt it — which is how a scanner
# stops being trusted — or to weaken the patterns. Each case therefore stores its
# text base64-encoded and a plain-language `description` a reader can use without
# decoding. scripts/test_secret_boundary.py decodes at run time.
#
# NONE OF THESE ARE REAL CREDENTIALS. The `must_flag` values are syntactically
# valid but non-existent: an AWS key id from the AWS documentation's own example
# range, a GitHub PAT of the right shape with no account behind it, and a
# self-signed throwaway PEM header. No live secret appears in this repository.

version: 1
mode_file: scripts/hooks/secret-boundary.mode
current_mode: warn

# Both implementations must agree on every case. They do not today:
#   pattern            hook                              validate.py
#   PEM                BEGIN [A-Z ]*PRIVATE KEY          BEGIN [A-Z0-9 ]*PRIVATE KEY
#   Slack              xox[baprs]-[A-Za-z0-9-]{10,}      xox[baprs]-   (prefix only)
#   password           bounded charset, {6,}             \S+           (any non-space)
#   REDACTED allowance yes                               NO
# validate.py is the broader of the two and is ALREADY blocking in CI, which is
# why all three recorded false positives came from it and none from the hook.
cases:

  # ---- must flag: real credential shapes ---------------------------------
  - id: pem-private-key
    verdict: must_flag
    description: An RSA PRIVATE KEY block header.
    text: LS0tLS1CRUdJTiBSU0EgUFJJVkFURSBLRVktLS0tLQ==

  - id: pem-openssh-key
    verdict: must_flag
    description: An OPENSSH PRIVATE KEY block header — the shape ssh-keygen emits.
    text: LS0tLS1CRUdJTiBPUEVOU1NIIFBSSVZBVEUgS0VZLS0tLS0=

  - id: aws-access-key-id
    verdict: must_flag
    description: An AWS access key id from the AWS documentation example range.
    text: QUtJQUlPU0ZPRE5ON0VYQU1QTEU=

  - id: github-pat
    verdict: must_flag
    description: A GitHub personal access token — ghp_ plus 36 characters.
    text: Z2hwXzAxMjM0NTY3ODlhYmNkZWZnaGlqa2xtbm9wcXJzdHV2d3h5eg==

  - id: slack-bot-token
    verdict: must_flag
    description: A Slack bot token with a realistic body length.
    text: eG94Yi0xMTExMTExMTExMS0yMjIyMjIyMjIyMi1hYmNkZWZnaGlqa2xtbm9wcXJzdHV2

  - id: live-password-assignment
    verdict: must_flag
    description: A password assignment carrying a live-looking value.
    text: cGFzc3dvcmQ6IGh1bnRlcjJodW50ZXIyaHVudGVyMg==

  - id: live-password-beside-an-allowance-term
    verdict: must_flag
    description: >-
      A live password on one content line and the word REDACTED on another. An
      earlier revision applied the allowance to the whole payload/line, so this
      shape disabled detection entirely — the allowance became a way to smuggle
      a credential past the scanner by mentioning REDACTED nearby.
    text: cGFzc3dvcmQ6IGh1bnRlcjJodW50ZXIyaHVudGVyMgpUaGUgdmFsdWUgYWJvdmUgaXMgUkVEQUNURUQgaW4gdGhlIHB1Ymxpc2hlZCBjb3B5Lg==

  # ---- must NOT flag: the three recorded incidents, reconstructed --------
  # The originals are unrecoverable by design — DSH row 5 records that quoting
  # the original would re-trip the gate. These reproduce the SHAPE each incident
  # describes, which is what a regression corpus needs.
  - id: fp-prose-about-a-password-field
    verdict: must_not_flag
    description: >-
      Prose describing that a configuration file contains a password field.
      Incident 1 (servers/hxs-3/configuration.md:107) — CI red four times.
    text: VGhlIGRyb3AtaW4gY2FycmllcyBhIHBhc3N3b3JkOiBmaWVsZCB3aG9zZSB2YWx1ZSBpcyBuZXZlciBwcmludGVkLg==

  - id: fp-comment-describing-the-scanner
    verdict: must_not_flag
    description: >-
      A code comment naming the scanner's own password-assignment pattern.
      Incident 2 (gordon/phase-a/gordon_util.py:75) — owner approved a reword.
    text: IyBGbGFncyBhIHBhc3N3b3JkOiBhc3NpZ25tZW50IHdpdGggYSBsaXZlLWxvb2tpbmcgdmFsdWUu

  - id: fp-directive-clause-in-a-state-log
    verdict: must_not_flag
    description: >-
      An owner directive clause in assignment-style prose, inside an APPEND-ONLY
      state log. Incident 3 (PILOT-OMNIROUTE-LAYER0-001 row 40) — the record was
      edited in place to clear the gate, which the append-only rule forbids.
    text: T3duZXIgZGlyZWN0aXZlOiBkYXNoYm9hcmQgcGFzc3dvcmQ6IHNldCB0byBTU0gtcGFzc3dvcmQgcGFyaXR5Lg==

  # ---- must NOT flag: sanitized and placeholder forms --------------------
  - id: fp-redacted-value
    verdict: must_not_flag
    description: A password assignment whose value is explicitly REDACTED.
    text: cGFzc3dvcmQ6IFJFREFDVEVE

  - id: fp-withheld-value
    verdict: must_not_flag
    description: A password assignment marked withheld.
    text: cGFzc3dvcmQ6IHdpdGhoZWxkIC0gc2VlIHRoZSBjcmVkZW50aWFsIHJlY29yZA==

  - id: fp-askpass-mechanism
    verdict: must_not_flag
    description: >-
      A reference to the ratified askpass pattern, which reads the credential at
      execution time and never stores it.
    text: cGFzc3dvcmQ6IHN1cHBsaWVkIGJ5IHRoZSBhc2twYXNzIGhlbHBlciBhdCBleGVjdXRpb24=

  - id: fp-template-placeholder
    verdict: must_not_flag
    description: An unfilled template placeholder in angle brackets.
    text: cGFzc3dvcmQ6IDx2YWx1ZSBuZXZlciByZWNvcmRlZCBpbiB0aGlzIGRvY3VtZW50Pg==

  - id: fp-short-token-prefix
    verdict: must_not_flag
    description: >-
      Prose naming the Slack token prefix without a token body. validate.py's
      prefix-only Slack pattern flags this; the hook's does not.
    text: U2xhY2sgYm90IHRva2VucyBzdGFydCB3aXRoIHhveGItIGFuZCBhcmUgbmV2ZXIgc3RvcmVkIGhlcmUu
